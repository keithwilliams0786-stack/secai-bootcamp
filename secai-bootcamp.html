const BANK_D2B = [
// ===== 2.4 Data security controls =====
Q({id:'n243',d:2,o:'2.4',t:['privacy-tech'],q:"A hospital network wants third-party researchers to run statistics on patient records in the cloud. Policy says the researchers must never see the records in cleartext, even while the computation is running. Which technique BEST meets this?",
 a:["Encrypting the records at rest with customer-managed keys","Homomorphic encryption, which allows computation on data while it stays encrypted","Static data masking","TLS 1.3 between the researchers and the cloud"],c:1,
 w:["Data must be decrypted to compute on it, which exposes it in use.","Correct: protects data in use, its most vulnerable state.","Masking replaces values; real statistics need real values.","TLS only protects data in transit."],
 x:"Data in use options: homomorphic encryption and trusted execution environments (secure enclaves)."}),
Q({id:'n244',d:2,o:'2.4',t:['privacy-tech','model-attacks'],q:"An ML team training on sensitive customer records wants to make it hard for an attacker to determine whether any individual record was used in training. During training, they clip each example's gradient and add random noise. What is this technique?",
 a:["Differentially private stochastic gradient descent (DP-SGD)","Federated averaging","Quantization-aware training","Data augmentation"],c:0,
 w:["Correct: clipping limits any one record's influence; noise hides its contribution.","FedAvg combines client updates; it doesn't clip and noise per example.","Quantization-aware training preserves accuracy at lower precision.","Augmentation creates varied examples."],
 x:"DP-SGD trade-off: more noise means more privacy but less accuracy."}),
Q({id:'n245',d:2,o:'2.4',t:['privacy-tech'],q:"A data team applies differential privacy to a dataset of customer ages before training. Which practice BEST demonstrates the principle?",
 a:["Deleting the age column entirely","Randomly adding or subtracting a small amount from each age so the model learns trends without exact values","Encrypting the age column with AES-256","Replacing ages with a vault-mapped token"],c:1,
 w:["That's minimization; trends are lost too.","Correct: calibrated noise hides individuals while preserving overall patterns.","Encryption hides values entirely; it isn't differential privacy.","That's tokenization."],
 x:"Differential privacy adds calibrated noise so no individual's contribution can be singled out."}),
Q({id:'n246',d:2,o:'2.4',t:['privacy-tech'],q:"When is data masking typically used as a data safety measure in an AI environment?",
 a:["When developing or testing systems where real sensitive values shouldn't be exposed","When encrypting data in transit between regions","When recovering from a ransomware attack","When the full real value must be processed by the model"],c:0,
 w:["Correct: masking swaps real values for fictional ones in non-production work.","That's TLS/VPN.","Unrelated.","Masking removes the real value, so it doesn't fit."],
 x:"Static masking creates a separate masked dataset; dynamic masking masks values as they're accessed."}),
Q({id:'n247',d:2,o:'2.4',t:['privacy-tech'],q:"A support chatbot's intake form previously collected full date of birth, but the process only needs birth month. The team changes the form so only the month is ever collected. Which practice is this, and how does it differ from redaction?",
 a:["Data minimization; it happens before or during collection, whereas redaction removes data after it was collected","Redaction; both happen at the same time","Tokenization; the date becomes a token","Dynamic masking; the date is hidden at query time"],c:0,
 w:["Correct.","Redaction happens after collection.","Nothing is tokenized.","Nothing is collected to mask."],
 x:"The key difference between minimization and redaction is when the removal happens."}),
Q({id:'n248',d:2,o:'2.4',t:['privacy-tech'],q:"Where should encryption keys for a cloud-hosted training dataset be stored?",
 a:["In a key management service or HSM with access-control policies, separate from the data","In the same storage bucket as the dataset","Hard-coded in the training script","In the model's system prompt"],c:0,
 w:["Correct: e.g., AWS KMS or Azure Key Vault.","Defeats the purpose of encryption.","Exposes keys to anyone with the code.","Extremely unsafe."],
 x:"Keys can live in a KMS, TPM, or HSM; keep them separate from the data they protect."}),
Q({id:'n249',d:2,o:'2.4',t:['privacy-tech'],q:"Which protocol recommendation BEST protects AI training data moving from storage to a model cluster across a network?",
 a:["TLS 1.3 or newer (or HTTP/3 with QUIC, which includes TLS 1.3)","FTP","Telnet","SMBv1"],c:0,
 w:["Correct.","Unencrypted.","Unencrypted.","Deprecated and insecure."],
 x:"SFTP, FTPS, HTTPS, and VPNs also protect data in transit."}),
Q({id:'n250',d:2,o:'2.4',t:['privacy-tech','compliance'],q:"An organization wants to monitor how regulated data is accessed and moved by its AI system throughout the data's life cycle, from collection to destruction. Which program fits, and what does it depend on?",
 a:["Data loss prevention (DLP), which depends on clear data classification and labeling","A prompt firewall, which depends on rate limits","Model watermarking, which depends on test prompts","Federated learning, which depends on client devices"],c:0,
 w:["Correct: e.g., Microsoft Purview DLP.","Prompt firewalls filter prompts; they don't track data life cycle.","Watermarking proves origin.","FL is a training approach."],
 x:"DLP tools need labels such as public, internal, confidential, secret to apply the right controls."}),
Q({id:'n251',d:2,o:'2.4',t:['privacy-tech'],q:"An analytics team replaces customer names with realistic fake names in a copy of the database used for model testing. The production database is unchanged. What is this?",
 a:["Static data masking","Dynamic data masking","Homomorphic encryption","Anonymization by deletion"],c:0,
 w:["Correct: a separate permanently masked dataset.","Dynamic masks at access time without creating a copy.","Computation on ciphertext.","Names were replaced, not deleted."],
 x:"Static = separate masked copy. Dynamic = masked as accessed; original intact at rest."}),
// ===== 2.5 Monitoring and auditing =====
Q({id:'n252',d:2,o:'2.5',t:['monitoring'],q:"A team is defining what to log for an AI assistant to support operational monitoring and compliance. Which THREE items belong in the log? (Select three.)",
 a:["Input prompts","Model responses","Token usage per user","Users' plaintext passwords","Full unredacted credit card numbers from prompts"],c:[0,1,2],
 w:["Correct: watch for restricted inputs and injection.","Correct: watch for exposure of controlled data.","Correct: excessive use may indicate abuse.","Never log passwords.","Sanitize PCI data before logging."],
 x:"Also log latency, stop parameters, and error codes. Sanitize PII/PHI in logs and set them read-only."}),
Q({id:'n253',d:2,o:'2.5',t:['monitoring','drift-maint'],q:"A team sends the same set of pre-formatted prompts to its production model every day and checks whether answers stay accurate, safe, and within policy. What are these prompts called?",
 a:["Canary prompts","Few-shot examples","Jailbreak prompts","System prompts"],c:0,
 w:["Correct: early warning for drift or degradation.","Few-shot examples teach a format in one prompt.","Those test guardrail bypass.","System prompts set behavior."],
 x:"Track drift and retrain to re-baseline when canary results degrade."}),
Q({id:'n254',d:2,o:'2.5',t:['monitoring'],q:"Which metric is BEST suited to evaluating how well an AI-generated incident summary captures the content of reference summaries, while tolerating paraphrasing?",
 a:["ROUGE","BLEU","ROC AUC","Latency in milliseconds"],c:0,
 w:["Correct: designed for summarization quality.","BLEU measures word overlap and doesn't account for missing context.","ROC AUC measures a classifier's ability to separate two classes.","Latency measures speed."],
 x:"BLEU is simpler (often used for translation); ROUGE is better for summaries."}),
Q({id:'n255',d:2,o:'2.5',t:['monitoring'],q:"Which metric indicates how well a binary classifier distinguishes between two groups, based on true-positive and false-positive rates?",
 a:["ROC AUC","ROUGE","BLEU","Cost per completed task"],c:0,
 w:["Correct.","Summarization metric.","Translation/overlap metric.","An operational cost metric."],
 x:"Model-specific KPIs include accuracy, precision, recall, and ROC AUC."}),
Q({id:'n256',d:2,o:'2.5',t:['monitoring','testing-oversight'],q:"After every model update, an engineering team runs the model against a curated set of high-quality, trusted examples with known correct answers to confirm behavior stays within organizational parameters. What is this set called?",
 a:["A golden dataset","A canary token","A shadow dataset","An augmented dataset"],c:0,
 w:["Correct: the trusted truth standard for consistent evaluation.","Canaries detect leakage or tampering.","Not a standard term here.","Augmented data is synthetic training material."],
 x:"Golden datasets support consistent evaluations after updates and audits."}),
Q({id:'n257',d:2,o:'2.5',t:['monitoring'],q:"Which technique ties an AI system's answers back to trusted data sources to reduce hallucinations?",
 a:["Grounding checks","Prompt compression","LRU eviction","Session rate limiting"],c:0,
 w:["Correct.","Reduces token cost.","Removes old embeddings from a store.","Limits request volume."],
 x:"RAG tuning and response-confidence monitoring also help isolate hallucinations."}),
Q({id:'n258',d:2,o:'2.5',t:['monitoring'],q:"During an outage, an engineer must temporarily use elevated permissions on an AI platform to restore service. Which approach meets audit expectations?",
 a:["A break-glass workflow that logs the justification and authorization and automatically revokes the elevated access afterward","Sharing the root password in the team chat","Permanently granting the engineer admin rights","Disabling access logging until the outage ends"],c:0,
 w:["Correct.","No accountability.","Violates least privilege.","Destroys the audit trail."],
 x:"Access logs should be audited across all models, datasets, and endpoints with separation of duties."}),
Q({id:'n259',d:2,o:'2.5',t:['monitoring'],q:"A vector database is reaching its storage limit. Which policy removes the oldest, least recently accessed embeddings to make room for new ones?",
 a:["Least recently used (LRU) eviction","Data balancing","Down-sampling","Model pruning"],c:0,
 w:["Correct.","Adjusts class proportions.","A balancing technique.","Removes model weights, not stored embeddings."],
 x:"Retention policies, deduplication, and eviction control storage costs."}),
Q({id:'n260',d:2,o:'2.5',t:['monitoring'],q:"Analysts find that almost every first answer from an internal assistant needs two or three follow-up prompts before it's useful. Which metric BEST captures the cost impact of this?",
 a:["Cost per successfully completed task","Model parameter count","Encryption key length","Number of GPUs in the cluster"],c:0,
 w:["Correct: each extra query adds workload and cost.","Not an outcome metric.","Unrelated.","Infrastructure, not efficiency per task."],
 x:"Improving response specificity reduces supplemental queries, time, and cost."}),
Q({id:'n261',d:2,o:'2.5',t:['monitoring','risk'],q:"To check a hiring model for bias, an auditor changes only the applicant's gender on otherwise identical records and checks whether the score changes. What is this technique?",
 a:["Counterfactual testing","Load testing","Regression testing","Canary prompting"],c:0,
 w:["Correct: alter one input and observe behavior.","Measures performance under load.","Re-runs tests after changes.","Monitors drift and safety daily."],
 x:"Counterfactual testing supports bias detection and explainability."}),
Q({id:'n262',d:2,o:'2.5',t:['monitoring'],q:"Which TWO controls protect the integrity of AI system logs? (Select two.)",
 a:["Read-only permissions on log files","Remote logging to an off-site location users can't readily reach","Letting analysts edit logs to remove noise","Storing logs only on the model server"],c:[0,1],
 w:["Correct.","Correct.","Editing destroys integrity.","Compromise of the server would expose or alter logs."],
 x:"Also encrypt logs and sanitize PII/PHI through masking or tokenization."}),
Q({id:'n263',d:2,o:'2.5',t:['monitoring'],q:"An organization's monitoring policy says HR-sensitive prompts about salary must get real-time analyst visibility, but employees still need help with legitimate HR questions. Which rule action is MOST appropriate for prompts containing salary keywords?",
 a:["Flag and alert an analyst","Block and log every such prompt","Allow but log only for monthly review","Take no action"],c:0,
 w:["Correct: visibility without blocking legitimate internal help.","Too heavy-handed for internal HR help.","Too weak for timely intervention.","Violates the monitoring policy."],

// ===== 2.6 Attack analysis and compensating controls =====
Q({id:'n264',d:2,o:'2.6',t:['model-attacks'],q:"During testing of a warehouse robot's vision model, a small yellow sticker on any package causes it to be classified as 'safe to handle' even when it's hazardous. All other classifications are accurate. What is the MOST likely cause?",
 a:["A hidden-trigger backdoor embedded through poisoned training data","A trojan that exfiltrates images to a remote server","Concept drift from new package designs","A membership inference attack"],c:0,
 w:["Correct: normal behavior until a specific trigger appears.","A trojan hides malicious code that acts in the background; outputs here are what's corrupted.","Drift wouldn't depend on one specific sticker.","Membership inference reveals training membership."],
 x:"Backdoor = trigger planted via data poisoning. Trojan = malicious code hidden inside the model package."}),
Q({id:'n265',d:2,o:'2.6',t:['model-attacks'],q:"Auditors find hidden code in a medical imaging model package that silently copies every uploaded scan and its classification to an external server, while results shown to clinicians remain accurate. Which attack is this?",
 a:["Trojan embedded in the AI model","Backdoor trigger attack","Model inversion","Model skewing"],c:0,
 w:["Correct: malicious payload runs in the background while the model appears normal.","A backdoor changes outputs when a trigger appears.","Inversion reconstructs training data from outputs.","Skewing shifts behavior through biased data."],
 x:"Trojans often arrive through supply chain or deployment pipeline compromise."}),
Q({id:'n266',d:2,o:'2.6',t:['model-attacks'],q:"An online education platform suspects a competitor is cloning its proprietary recommendation model through automated API queries. Paying customers can't have their access restricted. Which approach BEST detects and disrupts the theft?",
 a:["Per-source query rate limits plus monitoring for spikes of similar or systematically varied queries, with automatic throttling and investigation","Encrypting the model weights at rest","Requiring longer passwords","Removing the API entirely"],c:0,
 w:["Correct.","Extraction via queries never touches the stored weights.","Doesn't stop an authorized customer account being misused.","Would break the business."],
 x:"Also consider decoy (honey) endpoints and watermarking API outputs to prove cloning."}),
Q({id:'n267',d:2,o:'2.6',t:['model-attacks'],q:"A team deploys a fake API endpoint that looks identical to the real model API but has no legitimate users. What is the purpose?",
 a:["Any large-scale querying of it signals likely automated model extraction","To load-balance real traffic","To store backups of model weights","To serve a cheaper model version"],c:0,
 w:["Correct: there's no legitimate reason to call a honey endpoint.","It isn't for real traffic.","Not a storage location.","Not a production endpoint."],
 x:"Decoy endpoints and special system prompts are model-theft tripwires."}),
Q({id:'n268',d:2,o:'2.6',t:['model-attacks','drift-maint'],q:"A weekly-retrained fraud model keeps stable overall accuracy, but analysts notice it now approves many clearly fraudulent transactions from one merchant category in one region. What should the security engineer do FIRST?",
 a:["Compare recent training data feature and label distributions against historical baselines to detect drift or anomalous patterns in that segment","Raise the global approval threshold","Switch to a larger model","Disable weekly retraining permanently"],c:0,
 w:["Correct: skewed or poisoned data often fails on specific segments while overall metrics look fine.","A global change ignores the targeted pattern.","Size doesn't address skew.","May be part of the fix, but investigate first."],
 x:"Model skewing: overall accuracy can stay high while specific or rare cases fail."}),
Q({id:'n269',d:2,o:'2.6',t:['llm-attacks','guardrails'],q:"A ticketing integration requires an AI agent to return JSON with exactly four fields of fixed types. A week of logs shows a sudden spike in responses rejected for unexpected fields. What does this MOST likely indicate?",
 a:["Something has gone wrong, such as an attacker, a misbehaving model, or modified data, because injection usually adds fields or changes types","The model is performing normally","The token limit is too high","The temperature is too low"],c:0,
 w:["Correct: schema validation failures are a high-confidence indicator.","A spike in failures isn't normal.","Unrelated.","Low temperature makes output more consistent."],
 x:"Schema validation silently blocks most injections, jailbreaks, and exfiltration attempts that need extra fields."}),
Q({id:'n270',d:2,o:'2.6',t:['model-attacks'],q:"Which TWO methods help detect data poisoning before or during training? (Select two.)",
 a:["Similarity scoring of new data against trusted datasets","Reproducibility checks that the same inputs produce the same expected results","Raising the output token limit","Switching the gateway to session-based limits"],c:[0,1],
 w:["Correct: flags outliers.","Correct: reveals tampering.","Unrelated.","Unrelated."],
 x:"Also monitor for data drift against historical baselines."}),
Q({id:'n271',d:2,o:'2.6',t:['llm-attacks','guardrails'],q:"A clinical-messaging assistant sometimes suggests treatments that conflict with the hospital's approved guidelines. The hospital wants a compensating control that checks and corrects outputs in real time against trusted medical standards, not just blocking prompts. Which control BEST fits?",
 a:["Model guardrails that validate outputs against an approved clinical knowledge base and reject or revise deviating responses","Prompt templates with embedded clinical rules","Role-based access so only clinicians see drafts","Rate limiting on the messaging endpoint"],c:0,
 w:["Correct: output-side validation against trusted standards.","Templates guide input but don't verify the output.","Access control doesn't fix wrong content.","Volume control doesn't fix wrong content."],
 x:"Guardrails are logic-based constraints or external validators that monitor and correct model outputs in real time."}),
Q({id:'n272',d:2,o:'2.6',t:['llm-attacks'],q:"Why is a model's chain-of-thought reasoning a security concern?",
 a:["Injected text in the reasoning can shift later steps, and stored traces may contain secrets or private retrieval data","It always slows inference by 50%","It prevents the model from using tools","It encrypts the model's outputs"],c:0,
 w:["Correct: protect CoT integrity and confidentiality, especially if logged.","Not a security concern.","CoT helps tool use.","It doesn't encrypt anything."],
 x:"In regulated settings, CoT may be the only auditable record of why a decision was made."}),
Q({id:'n273',d:2,o:'2.6',t:['llm-attacks'],q:"An AI agent was granted write access to the company's ticketing system, file shares, and email to 'help with incidents.' A prompt injection caused it to forward sensitive files externally. Which design principle would MOST reduce the impact of similar attacks?",
 a:["Least privilege with narrow tool definitions and human approval for high-impact actions","Larger context windows","More detailed system prompts","Higher temperature"],c:0,
 w:["Correct: limits what any manipulation can achieve.","Unrelated.","Prompts alone can be bypassed.","Unrelated."],
 x:"Excessive agency turns minor reasoning errors into breaches; also sandbox execution and validate output schemas."}),
Q({id:'n274',d:2,o:'2.6',t:['llm-attacks','testing-oversight'],q:"How can teams detect hallucinations by comparing models?",
 a:["Cross-model validation: two or more models answer the same query and divergence is flagged","Running the same model at higher temperature","Compressing prompts","Raising rate limits"],c:0,
 w:["Correct.","Adds randomness rather than checking facts.","Saves tokens.","Unrelated."],
 x:"Factual consistency checks against trusted knowledge sources are the other main method."}),
Q({id:'n275',d:2,o:'2.6',t:['model-attacks'],q:"Which conditions MOST enable membership inference attacks?",
 a:["Overfitting, overly precise probability disclosures, and unmonitored query access","Strong rate limits and generalized outputs","Differential privacy during training","Low-precision quantization"],c:0,
 w:["Correct.","These reduce the risk.","DP is a defense.","Not an enabler."],
 x:"Mitigations: rate limiting, output filtering, generalized or coarse confidence scores, differential privacy."}),
Q({id:'n276',d:2,o:'2.6',t:['model-attacks'],q:"An attacker sends a fraud model thousands of crafted transactions and studies the outputs to reconstruct details about specific individuals in the training data. Which attack is this, and which control directly reduces it?",
 a:["Model inversion; limit sensitive data in training and return generalized outputs","Model theft; encrypt model files","Data poisoning; hash datasets","Prompt injection; use prompt templates"],c:0,
 w:["Correct.","Theft copies capability; encryption at rest doesn't stop query-based inversion.","No data was altered.","Not an LLM instruction override."],
 x:"Also apply differential privacy and monitor query patterns."}),
Q({id:'n277',d:2,o:'2.6',t:['model-attacks'],q:"Which control prevents an attacker who compromises an internal service from downloading the model's weights, LoRA adapters, or checkpoints?",
 a:["Locking down and encrypting the storage locations of model artifacts","Raising the output token limit","Adding more canary prompts","Using a larger context window"],c:0,
 w:["Correct.","Unrelated.","Detects drift, not theft of files.","Unrelated."],
 x:"Also slow or block users extracting large volumes of reasoning traces used for distillation."}),
Q({id:'n278',d:2,o:'2.6',t:['llm-attacks'],q:"Outputs from a code-generating model are passed directly to a browser automation tool that executes them. In many incidents labeled prompt injection, what is the real primary issue?",
 a:["Model output was executed without validation","The model's temperature was too low","The prompt was too short","The model was too small"],c:0,
 w:["Correct: outputs must be treated as untrusted input.","Unrelated.","Unrelated.","Unrelated."],
 x:"Secure designs use structured outputs, allow-listed actions, and out-of-band approvals."}),
Q({id:'n279',d:2,o:'2.6',t:['model-attacks'],q:"An AI-driven pipeline gathers public web content for training. Attackers seed misleading articles to push the model toward harmful stereotypes. Which compensating controls BEST address this?",
 a:["Use curated datasets with documented sources and histories, run periodic bias evaluations, and publish model cards","Increase crawl frequency","Remove all logging","Switch to zero-shot prompting"],c:0,
 w:["Correct.","More crawling ingests more poison.","Removes evidence.","Doesn't fix training data."],
 x:"Model cards document capabilities, limitations, and training data types; escalation paths handle unexpected results."}),

Q({id:'r220',r:1,d:2,o:'2.5',t:['monitoring'],q:"Which monitoring signal could indicate a user is gradually steering a conversation toward prohibited content over many consecutive queries?",

Q({id:'r221',r:1,d:2,o:'2.5',t:['monitoring'],q:"An organization must measure whether its AI system's output treats different groups or individuals equitably, as required where decisions affect people's opportunities. What is this measurement called, and what may it require?",

Q({id:'r222',r:1,d:2,o:'2.6',t:['model-attacks'],q:"How does a backdoor attack differ from a trojan attack on an AI model?",

/* ============================== STATE ============================== */
const STORE_KEY = 'secai-bootcamp-progress-v1';
let STATE = {
  blocksDone:{},          // blockId -> true
  objRatings:{},          // '1.1' -> 1..3
  quizAnswers:{},         // blockId+qi -> chosenIdx
  fcIndex:0,
  fcDomainFilter:'all',
  matchState:{},          // attack text -> matched bool
  matchScore:0,
  exam:null,              // v3 exam in progress or last results (see EXAM ENGINE v3)
  qstats:{},              // itemId -> {n, cr, first, last, ts}
  attempts:[],            // scored attempt history
  finalOverride:false,    // unlock the final early
  bd:{attempts:[]},       // brain dump drill history
  gameStats:{},           // personal bests for the games
  soundOn:true,           // game sound effects toggle
};
let CURRENT_VIEW = 'day1';
let OPEN_BLOCK = null;

async function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ STATE = Object.assign(STATE, JSON.parse(raw)); }
    delete STATE.examState;  // v2 exam format is not compatible with v3
    if(STATE.exam && STATE.exam.items && STATE.exam.items.some(e=>!ITEM[e.id])) STATE.exam=null;
    STATE.qstats=STATE.qstats||{}; STATE.attempts=STATE.attempts||[]; STATE.bd=STATE.bd||{attempts:[]};
  }catch(e){ /* no saved state yet, or storage unavailable */ }
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){}
  },250);
}

/* ============================== PROGRESS CALC ============================== */
function allBlocks(){ return DAYS.flatMap(d=>d.blocks); }
function contentBlocks(){ return allBlocks().filter(b=>b.type!=='admin'); }

function domainBlockIds(domainNum){
  const ids=[];
  DAYS.forEach(d=>{ if(d.domainFocus===domainNum){ d.blocks.forEach(b=>{ if(b.type!=='admin') ids.push(b.id); }); } });
  return ids;
}
function domainPct(domainNum){
  const ids=domainBlockIds(domainNum);
  if(!ids.length) return 0;
  const done=ids.filter(id=>STATE.blocksDone[id]).length;
  return Math.round((done/ids.length)*100);
}
function overallPct(){
  const cb=contentBlocks();
  if(!cb.length) return 0;
  const done=cb.filter(b=>STATE.blocksDone[b.id]).length;
  return Math.round((done/cb.length)*100);
}
function dayPct(day){
  const cb=day.blocks.filter(b=>b.type!=='admin');
  if(!cb.length) return 100;
  const done=cb.filter(b=>STATE.blocksDone[b.id]).length;
  return Math.round((done/cb.length)*100);
}

/* ============================== RENDER: SIDEBAR ============================== */
function renderSidebar(){
  const pct = overallPct();
  document.getElementById('gaugePct').textContent = pct+'%';
  const status = pct===0?'NOT STARTED':pct<40?'IN PROGRESS':pct<100?'ON TRACK':'BOOTCAMP COMPLETE';
  const statusColor = pct===0?'var(--ink-dim)':pct<40?'var(--red)':pct<100?'var(--amber)':'var(--green)';
  const statusEl=document.getElementById('gaugeStatus');
  statusEl.textContent=status; statusEl.style.color=statusColor;
  const ring=document.getElementById('gaugeRing');
  const col = pct<40? '#F0555A' : pct<75? '#F5B942' : '#3DDC84';
  ring.style.background = 'conic-gradient('+col+' '+(pct*3.6)+'deg, #1A2740 0deg)';

  const barsEl=document.getElementById('domainBars');
  barsEl.innerHTML='';
  [1,2,3,4].forEach(n=>{
    const dp=domainPct(n);
    const d=DOMAINS[n];
    const row=document.createElement('div');
    row.className='dbar-row';
    row.innerHTML = '<div class="dbar-top"><span><span class="code">D'+n+'</span> '+d.short+' ('+d.weight+'%)</span><span>'+dp+'%</span></div>'+
      '<div class="dbar-track"><div class="dbar-fill" style="width:'+dp+'%;background:'+d.color+';"></div></div>';
    barsEl.appendChild(row);
  });

  const nav=document.getElementById('navlist');
  nav.innerHTML='';
  const label1=document.createElement('div'); label1.className='navlabel'; label1.textContent='Bootcamp Days'; nav.appendChild(label1);
  DAYS.forEach(d=>{
    const dp=dayPct(d);
    const item=document.createElement('div');
    item.className='navitem'+(CURRENT_VIEW===d.key?' active':'');
    const dotClass = dp===0?'':dp<100?'partial':'done';
    item.innerHTML = '<span class="idx">D'+d.id+'</span><span class="dot '+dotClass+'"></span><span>'+d.title.split(' — ')[0]+'</span><span class="pct">'+dp+'%</span>';
    item.onclick=()=>{ CURRENT_VIEW=d.key; OPEN_BLOCK=null; render(); };
    nav.appendChild(item);
  });
  const label2=document.createElement('div'); label2.className='navlabel'; label2.textContent='Study Tools'; nav.appendChild(label2);
  const tools=[
    {key:'tracker', name:'Objective Tracker'},
    {key:'flashcards', name:'Flashcards'},
    {key:'match', name:'Attack ↔ Control Drill'},
    {label:'Exam Prep'},
    {key:'exam', name:'Practice Tests & Exams'},
    {key:'readiness', name:'Readiness Tracker'},
    {key:'braindump', name:'Brain Dump Drill'},
    {label:'Games'},
    {key:'pipeline', name:'Defend the Pipeline'},
    {key:'jeopardy', name:'Jeopardy Board'},
    {key:'wheel', name:'Wheel of Security'},
    {label:'PBQ Simulator'},
    {key:'pbqarch', name:'Architecture Controls'},
    {key:'pbqsort', name:'Framework Sort'},
    {key:'pbqmulti', name:'Tool Selection (multi-part)'},
    {key:'pbqtable', name:'Attack / Control Table'},
    {key:'pbqrules', name:'Policy Rule Builder'}
  ];
  tools.forEach(t=>{
    if(t.label){ const lb=document.createElement('div'); lb.className='navlabel'; lb.textContent=t.label; nav.appendChild(lb); return; }
    const item=document.createElement('div');
    item.className='navitem'+(CURRENT_VIEW===t.key?' active':'');
    item.innerHTML = '<span class="idx">›</span><span>'+t.name+'</span>';
    item.onclick=()=>{ CURRENT_VIEW=t.key; render(); };
    nav.appendChild(item);
  });
  const cov=coverage(); const last=(STATE.attempts||[]).filter(a=>a.mode==='practice').slice(-1)[0];
  document.getElementById('covLine').innerHTML='Bank coverage <b>'+cov.n+'/'+cov.tot+'</b> ('+cov.pct+'%)<br>Last practice test <b>'+(last?last.pct+'%':'—')+'</b>'+(last&&last.fresh.n?' · first-attempt <b>'+Math.round(last.fresh.c/last.fresh.n*100)+'%</b>':'');
}

/* ============================== RENDER: QUIZ WIDGET ============================== */
function renderQuiz(qObj, uid){
  const saved = STATE.quizAnswers[uid];
  const wrap=document.createElement('div');
  wrap.className='qcard';
  const qt=document.createElement('div'); qt.className='qtext'; qt.textContent=qObj.text; wrap.appendChild(qt);
  qObj.opts.forEach((optText,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=optText;
    if(saved!=null){
      b.disabled=true;
      if(i===qObj.correctIdx) b.classList.add('correct');
      else if(i===saved) b.classList.add('wrong');
    }
    b.onclick=()=>{
      if(STATE.quizAnswers[uid]!=null) return;
      STATE.quizAnswers[uid]=i; saveState();
      renderQuizButtons(wrap, qObj, uid);
    };
    wrap.appendChild(b);
  });
  const ex=document.createElement('div'); ex.className='explain'+(saved!=null?' show':'');
  ex.textContent=qObj.explain||'';
  wrap.appendChild(ex);
  return wrap;
}
function renderQuizButtons(wrap, qObj, uid){
  const opts=wrap.querySelectorAll('.opt');
  const saved=STATE.quizAnswers[uid];
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===qObj.correctIdx) b.classList.add('correct');
    else if(i===saved) b.classList.add('wrong');
  });
  wrap.querySelector('.explain').classList.add('show');
}

/* ============================== RENDER: DAY VIEW ============================== */
function renderDay(dayKey){
  const day = DAYS.find(d=>d.key===dayKey);
  const main=document.getElementById('main');
  main.innerHTML='';
  const top=document.createElement('div'); top.className='topline';
  top.innerHTML = '<div><h1>'+day.title+'</h1><div class="sub">'+day.label+' · '+day.dateNote+'</div></div>'+
    '<div class="pill">DOMAIN FOCUS: D'+day.domainFocus+' · '+DOMAINS[day.domainFocus].short+'</div>';
  main.appendChild(top);

  day.blocks.forEach(b=>{
    const blk=document.createElement('div');
    blk.className='block'+(OPEN_BLOCK===b.id?' open':'');
    const head=document.createElement('div'); head.className='block-head';
    const chk=document.createElement('div');
    chk.className='chk'+(STATE.blocksDone[b.id]?' on':'');
    if(b.type==='admin'){ chk.style.visibility='hidden'; }
    chk.onclick=(e)=>{ e.stopPropagation(); if(b.type==='admin')return; STATE.blocksDone[b.id]=!STATE.blocksDone[b.id]; saveState(); render(); };
    head.appendChild(chk);
    const time=document.createElement('div'); time.className='time mono'; time.textContent=b.time; head.appendChild(time);
    const bt=document.createElement('div'); bt.className='btitle';
    const objTag = b.obj? '<span class="tag obj">'+b.obj+'</span>' : '';
    const typeTag = '<span class="tag '+b.type+'">'+b.type.toUpperCase()+'</span>';
    bt.innerHTML = '<div class="name">'+b.title+'</div><div class="tags">'+typeTag+objTag+'</div>';
    head.appendChild(bt);
    const caret=document.createElement('div'); caret.className='caret'; caret.textContent='▸'; head.appendChild(caret);
    head.onclick=()=>{ OPEN_BLOCK = (OPEN_BLOCK===b.id? null : b.id); render(); };
    blk.appendChild(head);

    const body=document.createElement('div'); body.className='block-body';
    const inner=document.createElement('div'); inner.className='block-inner';
    inner.innerHTML = b.body;
    if(b.terms && b.terms.length){
      const h4=document.createElement('h4'); h4.textContent='Key Terms'; inner.appendChild(h4);
      const chips=document.createElement('div'); chips.className='term-chips';
      b.terms.forEach(t=>{ const c=document.createElement('span'); c.className='term-chip'; c.textContent=t; chips.appendChild(c); });

      b.quiz.forEach((qq,i)=>{ inner.appendChild(renderQuiz(qq, b.id+'-q'+i)); });
    }
    body.appendChild(inner);
    blk.appendChild(body);
    main.appendChild(blk);
  });
}

let matchSelection = {a:null, c:null};
function renderMatch(){
  const main=document.getElementById('main'); main.innerHTML='';
  const top=document.createElement('div'); top.className='topline';
  top.innerHTML='<div><h1>Attack ↔ Control Drill</h1><div class="sub">Objective 2.6 — the single highest-value objective on the exam. Click an attack, then its matching compensating control.</div></div>'+
    '<div class="pill">SCORE: '+Object.keys(STATE.matchState).filter(k=>STATE.matchState[k]).length+' / '+MATCH_PAIRS.length+'</div>';
  main.appendChild(top);

  const resetBtn=document.createElement('button'); resetBtn.className='btn'; resetBtn.style.marginBottom='14px'; resetBtn.textContent='Reset Drill';
  resetBtn.onclick=()=>{ STATE.matchState={}; matchSelection={a:null,c:null}; saveState(); render(); };
  main.appendChild(resetBtn);

  const grid=document.createElement('div'); grid.className='match-grid';
  const colA=document.createElement('div'); colA.className='match-col';
  colA.innerHTML='<h4>Attack</h4>';
  const shuffledA=[...MATCH_PAIRS];
  shuffledA.forEach(p=>{
    const done = STATE.matchState[p.a];
    const el=document.createElement('div');
    el.className='match-item'+(done?' correct locked':'')+(matchSelection.a===p.a?' sel':'');
    el.textContent=p.a;
    if(!done){
      el.onclick=()=>{ matchSelection.a=p.a; tryMatch(); render(); };
    }
    colA.appendChild(el);
  });

  const colC=document.createElement('div'); colC.className='match-col';
  colC.innerHTML='<h4>Compensating Control</h4>';
  const shuffledC=[...MATCH_PAIRS].sort(()=>Math.random()-0.5);
  shuffledC.forEach(p=>{
    const done = STATE.matchState[p.a];
    const el=document.createElement('div');
    el.className='match-item'+(done?' correct locked':'')+(matchSelection.c===p.c?' sel':'');
    el.textContent=p.c;
    if(!done){
      el.onclick=()=>{ matchSelection.c=p.c; tryMatch(); render(); };
    }
    colC.appendChild(el);
  });

  grid.appendChild(colA); grid.appendChild(colC);
  main.appendChild(grid);

  function tryMatch(){
    if(matchSelection.a && matchSelection.c){
      const pair = MATCH_PAIRS.find(p=>p.a===matchSelection.a);
      if(pair && pair.c===matchSelection.c){
        STATE.matchState[pair.a]=true; saveState();
      }
      matchSelection={a:null,c:null};
    }
  }
}

/* ============================== RENDER: FINAL EXAM ============================== */
/* ============================== EXAM ENGINE v3 ==============================
   Unseen-first drawing, per-attempt option shuffling, multi-select, matching, PBQs,
   first-attempt vs repeat scoring, readiness tracking, gated weak-areas final, balanced fresh mock. */
let examTimerHandle=null;
const ALL_ITEMS=[].concat(BANK_EXISTING,BANK_D1,BANK_D2A,BANK_D2B,BANK_D3,BANK_D4,MATCH_SETS,PBQ_BANK);
const ITEM={}; ALL_ITEMS.forEach(it=>{ ITEM[it.id]=it; });
const isQ=it=>it.type==='mc'||it.type==='multi';
const POOL={
  regQ:ALL_ITEMS.filter(it=>!it.r&&isQ(it)), regM:ALL_ITEMS.filter(it=>!it.r&&it.type==='match'), regP:ALL_ITEMS.filter(it=>!it.r&&it.type==='pbq'),
  resQ:ALL_ITEMS.filter(it=>it.r&&isQ(it)),  resM:ALL_ITEMS.filter(it=>it.r&&it.type==='match'),  resP:ALL_ITEMS.filter(it=>it.r&&it.type==='pbq')
};
POOL.regAll=POOL.regQ.concat(POOL.regM,POOL.regP);
POOL.resAll=POOL.resQ.concat(POOL.resM,POOL.resP);
/* Back-compat for the games (Jeopardy draws from EXAM_BANK). Reserve items are never exposed in games. */
const EXAM_BANK=POOL.regQ.filter(it=>it.type==='mc').map(it=>({text:it.q,opts:it.a,correctIdx:it.c,explain:it.x,domain:it.d}));

const BLUEPRINT={1:10,2:24,3:15,4:11};   // 60 items, proportional to the 17/40/24/19 split
const TYPE_LABEL={mc:'Multiple choice',multi:'Multiple response',match:'Matching',pbq:'Performance-based'};
const MODES={
  practice:{name:'Practice Test',dur:60*60},
  domain:{name:'Domain Drill',dur:20*60},
  weak:{name:'Weak-Topic Drill',dur:0,instant:true},
  final:{name:'Weak-Areas Final',dur:40*60},
  mock:{name:'Balanced Fresh Mock',dur:60*60}
};

/* ---------- stats helpers ---------- */
function qst(id){ return (STATE.qstats||{})[id]; }
function seen(id){ const s=qst(id); return !!(s&&s.n>0); }
function coverage(){ const tot=POOL.regAll.length; const n=POOL.regAll.filter(it=>seen(it.id)).length; return {n:n,tot:tot,pct:tot?Math.floor(n/tot*100):0}; }
function reserveUsed(){ return POOL.resAll.filter(it=>seen(it.id)).length; }
function tagStats(){
  const out={}; Object.keys(TAGS).forEach(t=>{ out[t]={n:0,c:0}; });
  Object.keys(STATE.qstats||{}).forEach(id=>{ const it=ITEM[id], s=STATE.qstats[id]; if(!it||!it.t) return; it.t.forEach(t=>{ if(out[t]){ out[t].n+=s.n; out[t].c+=s.cr; } }); });
  return out;
}
function tagWeakness(t, ts){
  const prior=TAGS[t]&&TAGS[t].weak?0.35:0.12; const s=ts[t];
  if(!s||s.n<3) return prior;
  return 0.25*prior+0.75*(1-s.c/s.n);
}
function itemWeight(it, ts){ return 0.05+Math.max.apply(null,(it.t||['x']).map(t=>tagWeakness(t,ts))); }
function domainStats(){
  const out={1:{n:0,c:0},2:{n:0,c:0},3:{n:0,c:0},4:{n:0,c:0}};
  Object.keys(STATE.qstats||{}).forEach(id=>{ const it=ITEM[id], s=STATE.qstats[id]; if(it&&out[it.d]){ out[it.d].n+=s.n; out[it.d].c+=s.cr; } });
  return out;
}

/* ---------- selection ---------- */
function priorityOrder(pool){
  const uns=gShuffle(pool.filter(it=>!seen(it.id)));
  const sn=pool.filter(it=>seen(it.id)).map(it=>({it:it,k:[qst(it.id).ts||0,qst(it.id).last,Math.random()]}))
    .sort((a,b)=>a.k[0]-b.k[0]||a.k[1]-b.k[1]||a.k[2]-b.k[2]).map(x=>x.it);
  return uns.concat(sn);
}
function freshFirst(primary, secondary){
  const pu=gShuffle(primary.filter(it=>!seen(it.id))), su=gShuffle(secondary.filter(it=>!seen(it.id)));
  const rest=priorityOrder(primary.concat(secondary).filter(it=>seen(it.id)));
  return pu.concat(su,rest);
}
function pickOnePerKind(ordered,n){
  // unseen first (one per kind, then any kind), then seen (one per kind, then any)
  const out=[], kinds={}; const uns=ordered.filter(it=>!seen(it.id)), sn=ordered.filter(it=>seen(it.id));
  [uns,sn].forEach(list=>{
    list.forEach(it=>{ if(out.length<n&&!kinds[it.kind]&&out.indexOf(it)<0){ out.push(it); kinds[it.kind]=1; } });
    list.forEach(it=>{ if(out.length<n&&out.indexOf(it)<0){ out.push(it); kinds[it.kind]=1; } });
  });
  return out;
}
function fillByDomain(ordered, targets){
  const out=[]; const used={};
  [1,2,3,4].forEach(dn=>{ ordered.filter(it=>it.d===dn).slice(0,targets[dn]||0).forEach(it=>{ out.push(it); used[it.id]=1; }); });
  const want=Object.keys(targets).reduce((a,k)=>a+targets[k],0);
  ordered.forEach(it=>{ if(out.length<want&&!used[it.id]){ out.push(it); used[it.id]=1; } });
  return out;
}
/* Coverage-first fill: honor the blueprint with unseen items; if a domain runs out of unseen items,
   borrow unseen items from other domains before repeating anything. */
function fillCoverage(ordered, targets){
  const out=[], used={}; const want=Object.keys(targets).reduce((a,k)=>a+targets[k],0);
  const take=it=>{ out.push(it); used[it.id]=1; };
  [1,2,3,4].forEach(dn=>{ ordered.filter(it=>it.d===dn&&!seen(it.id)).slice(0,targets[dn]||0).forEach(take); });
  ordered.forEach(it=>{ if(out.length<want&&!used[it.id]&&!seen(it.id)) take(it); });
  if(out.length<want){
    const have={1:0,2:0,3:0,4:0}; out.forEach(it=>have[it.d]++);
    [1,2,3,4].forEach(dn=>{ ordered.filter(it=>it.d===dn&&!used[it.id]).slice(0,Math.max(0,(targets[dn]||0)-have[dn])).forEach(it=>{ if(out.length<want) take(it); }); });
    ordered.forEach(it=>{ if(out.length<want&&!used[it.id]) take(it); });
  }
  return out;
}
function weightedPick(pool,n,wfn){
  const arr=pool.slice(), out=[];
  while(out.length<n&&arr.length){
    const ws=arr.map(wfn); const tot=ws.reduce((a,b)=>a+b,0); let r=Math.random()*tot, i=0;
    for(;i<arr.length-1;i++){ r-=ws[i]; if(r<=0) break; }
    out.push(arr.splice(i,1)[0]);
  }
  return out;
}
function adjTargets(base, taken){ const t=Object.assign({},base); taken.forEach(it=>{ t[it.d]=Math.max(0,(t[it.d]||0)-1); }); return t; }

function buildItems(mode, dn){
  const ts=tagStats();
  if(mode==='practice'){
    const p=pickOnePerKind(priorityOrder(POOL.regP),3);
    // matching sets: unseen first; only repeat one if there aren't enough unseen questions to fill the slot
    let m=POOL.regM.filter(it=>!seen(it.id)); m=gShuffle(m).slice(0,2);
    const unseenQ=POOL.regQ.filter(it=>!seen(it.id)).length;
    if(m.length<2&&unseenQ<57-m.length) m=m.concat(priorityOrder(POOL.regM.filter(it=>seen(it.id))).slice(0,2-m.length));
    const q=fillCoverage(priorityOrder(POOL.regQ.concat(POOL.regM.filter(x=>m.indexOf(x)<0))),adjTargets(BLUEPRINT,p.concat(m)));
    return p.concat(gShuffle(q.concat(m)));
  }
  if(mode==='domain'){
    const p=priorityOrder(POOL.regP.filter(it=>it.d===dn)).slice(0,1);
    const m=priorityOrder(POOL.regM.filter(it=>it.d===dn)).slice(0,1);
    const q=priorityOrder(POOL.regQ.filter(it=>it.d===dn)).slice(0,20-p.length-m.length);
    return p.concat(gShuffle(q.concat(m)));
  }
  if(mode==='weak'){
    return weightedPick(POOL.regQ,15,it=>{ const s=qst(it.id); const boost=!s?1:(s.last<1?2.2:0.5); return itemWeight(it,ts)*boost; });
  }
  if(mode==='final'){
    const pool=POOL.resQ.concat(POOL.resM);
    const w=it=>itemWeight(it,ts)*(seen(it.id)?0.15:1);
    let picked=[];
    [1,2,3,4].forEach(d=>{ picked=picked.concat(weightedPick(pool.filter(it=>it.d===d),3,w)); });
    picked=picked.concat(weightedPick(pool.filter(it=>picked.indexOf(it)<0),35-picked.length,w));
    const p=freshFirst(POOL.resP,POOL.regP).slice(0,1);
    return p.concat(gShuffle(picked));
  }
  if(mode==='mock'){
    const p=pickOnePerKind(freshFirst(POOL.resP,POOL.regP),3);
    const m=freshFirst(POOL.resM,POOL.regM).slice(0,2);
    const q=fillByDomain(freshFirst(POOL.resQ,POOL.regQ),adjTargets(BLUEPRINT,p.concat(m)));
    return p.concat(gShuffle(q.concat(m)));
  }
  return [];
}
function permFor(it){
  if(it.type==='mc'||it.type==='multi'){
    const idx=it.a.map((_,i)=>i); const lock=it.lock||[];
    const free=gShuffle(idx.filter(i=>lock.indexOf(i)<0)); const out=[];
    idx.forEach(i=>{ out.push(lock.indexOf(i)>=0?i:free.shift()); });
    return {perm:out};
  }
  if(it.type==='match'){ return {perm:gShuffle(it.p.map((_,i)=>i)), perm2:gShuffle(it.p.map((_,i)=>i).concat([it.p.length]))}; }
  if(it.type==='pbq'&&it.kind==='table'){ return {chips:gShuffle(Object.keys(it.ans).map(k=>it.ans[k]).concat(it.decoys||[]))}; }
  return {};
}
function startExamMode(mode, dn){
  const items=buildItems(mode,dn);
  STATE.exam={mode:mode,dn:dn||null,items:items.map(it=>Object.assign({id:it.id},permFor(it))),
    fresh:items.reduce((o,it)=>{ o[it.id]=!seen(it.id); return o; },{}),
    ans:{},flag:{},checked:{},cur:0,start:Date.now(),dur:MODES[mode].dur,done:false,result:null,reviewFilter:'missed'};
  CURRENT_VIEW='exam'; saveState(); render(); window.scrollTo(0,0);
}

/* ---------- grading ---------- */
function gradePbq(it,a){
  let pts=0,max=0;
  if(it.kind==='multi'){ it.parts.forEach((pt,pi)=>pt.items.forEach((x,ii)=>{ max++; const v=a[pi+'-'+ii]; if(pt.type==='check'? (!!v)===x.a : v===x.a) pts++; })); }
  else if(it.kind==='table'){ Object.keys(it.ans).forEach(k=>{ max++; if(a[k]===it.ans[k]) pts++; }); }
  else if(it.kind==='rules'){ it.rules.forEach((r,ri)=>r.lines.forEach((l,li)=>{ max++; if(a[ri+'-'+li]===l.a) pts++; })); }
  return {pts:pts,max:max};
}
function gradeItem(it,a){
  if(it.type==='mc'){ const ok=a===it.c; return {credit:ok?1:0,pts:ok?1:0,max:1}; }
  if(it.type==='multi'){ const s=a||[]; const ok=s.length===it.c.length&&it.c.every(i=>s.indexOf(i)>=0); return {credit:ok?1:0,pts:ok?1:0,max:1}; }
  if(it.type==='match'){ const m=a||{}; let r=0; it.p.forEach((_,i)=>{ if(m[i]===i) r++; }); const ok=r===it.p.length&&m[it.p.length]==null; return {credit:ok?1:0,pts:r,max:it.p.length}; }
  if(it.type==='pbq'){ const g=gradePbq(it,a||{}); return {credit:g.max?g.pts/g.max:0,pts:g.pts,max:g.max}; }
  return {credit:0,pts:0,max:1};
}
function isAnswered(it,a){

}
function submitExam(){
  const es=STATE.exam; if(!es||es.done) return;
  clearInterval(examTimerHandle);
  const now=Date.now(); STATE.qstats=STATE.qstats||{};
  let sum=0; const byD={1:{n:0,c:0},2:{n:0,c:0},3:{n:0,c:0},4:{n:0,c:0}}; const fr={n:0,c:0}, rp={n:0,c:0}, pb={n:0,c:0}; const tagMiss={};
  es.items.forEach((e,i)=>{
    const it=ITEM[e.id]; const g=gradeItem(it,es.ans[i]); e.g=g; sum+=g.credit;
    byD[it.d].n++; byD[it.d].c+=g.credit;
    const bucket=es.fresh[e.id]?fr:rp; bucket.n++; bucket.c+=g.credit;
    if(it.type==='pbq'){ pb.n++; pb.c+=g.credit; }
    if(g.credit<1) (it.t||[]).forEach(t=>{ tagMiss[t]=(tagMiss[t]||0)+1; });
    const s=STATE.qstats[e.id]||{n:0,cr:0};
    if(s.n===0) s.first=g.credit;
    s.n++; s.cr+=g.credit; s.last=g.credit; s.ts=now;
    STATE.qstats[e.id]=s;
  });
  const used=Math.min(es.dur||Infinity, Math.round((now-es.start)/1000));
  const res={date:now,mode:es.mode,dn:es.dn,n:es.items.length,answered:es.items.filter((e,i)=>isAnswered(ITEM[e.id],es.ans[i])).length,score:sum,pct:Math.round(sum/es.items.length*100),
    fresh:fr,repeat:rp,pbq:pb,byD:byD,tagMiss:tagMiss,used:used,dur:es.dur};
  es.result=res; es.done=true;
  STATE.attempts=(STATE.attempts||[]).concat([res]);
  saveState(); render(); window.scrollTo(0,0);
}

function startExamTimer(){

    const pace=document.querySelector('.pace');

d1b1:{terms:['Isolation Forest','Autoencoder','Gradient-boosted trees','k-fold','Weak supervision','Shadow mode','Federated learning','Secure aggregation'],html:`
<h4>Which ML technique fits the scenario</h4>
<ul>
<li><b>Labels exist → supervised.</b> <b>Gradient-boosted decision trees</b> are many small trees trained in sequence, each fixing the last one's mistakes. They're good at ranking with hundreds of fine-grained signals (phishing-domain likelihood, lateral movement, prioritizing scan findings). <b>CNNs</b> read raw executable bytes to spot packed malware. <b>Logistic regression</b> is chosen when auditors must be able to examine its decisions.</li>
<li><b>No labels → unsupervised.</b> Use this for zero-days, insider threats, and brand-new workloads. <b>Clustering</b> maps normal groupings. An <b>autoencoder</b> learns to recreate normal records, so <b>high reconstruction error = anomaly</b>. An <b>Isolation Forest</b> makes random cuts, and records isolated in <b>very few cuts</b> are outliers.</li>
<li><b>Feedback loop:</b> once an analyst verifies and labels an anomaly, it becomes training data for future supervised models.</li>
<li><b>Weak supervision</b> auto-labels from YARA/Sigma rules, sandbox verdicts, and threat feeds. It's fast but adds label noise (false positives and missed novel attacks). Fixes: human <b>label audits</b>, <b>confidence weighting</b> of low-trust sources, and semi-supervised refinement on analyst-verified predictions.</li>
<li><b>Validation:</b> the training set learns, the validation set tunes and checks, and the test set gives the final unbiased estimate. <b>k-fold cross-validation</b> rotates the held-out fold and averages the scores. Red teams inject outliers and poisoned samples into validation to test brittleness.</li>
<li><b>Metrics:</b> precision = flagged items that were truly bad; recall = bad items that were caught; F1 balances the two. A confusion matrix shows the trade-off.</li>
<li><b>Reinforcement learning:</b> state → action → reward. Rewards include penalties for false positives and latency. Train in a replay lab, run in <b>shadow mode</b> beside analysts, then switch to <b>autonomous mode</b> with every decision logged.</li>
<li><b>Federated learning</b> sends the model to the data. Risks: poisoned client gradients, leakage through updates, device heterogeneity, and communication overhead. Controls: authenticate clients, <b>secure aggregation</b>, differential privacy, and anomaly detection on updates.</li>
<li><b>Pre-training vs. fine-tuning vs. RAG:</b> broad base vs. specialize with a small dataset vs. <i>no training</i> (retrieve documents at query time).</li>
</ul>
<h4>Prompting pitfalls CertMaster tests</h4>
<ul>
<li><b>Zero-shot</b> output is a hypothesis; validate it. <b>One-shot</b> can overfit to an atypical single example. <b>Multi-shot</b> costs more tokens and can leak proprietary indicators, so redact.</li>
<li>A good user prompt has <b>context</b> (evidence), <b>perspective</b> (persona/lens), and <b>output shape</b> (e.g., JSON keys).</li>
<li>Before using public models, swap sensitive values for <b>consistent, format-preserving placeholders</b>.</li>
</ul>`},
d1b3:{terms:['Data verification','Data balancing','Down-sampling','Tenant isolation'],html:`
<h4>Corrected: lineage vs. provenance</h4>
<ul><li><b>Lineage</b> records every <i>transformation</i> a dataset goes through. <b>Provenance</b> documents its <i>origin, licensing, and consent</i>: who created it, when, and how. For LLM/RAG content, save the source URL, timestamp, content hash, and license so bad data can be removed quickly.</li></ul>
<h4>Pipeline hardening sequence</h4>
<ul>
<li><b>Verify</b> on arrival that data is complete, accurate, and traceable. <b>Clean and standardize</b> it (missing time zones or subnet masks cause false lateral-movement alerts). <b>Encrypt</b> it in transit and at rest, with keys stored separately.</li>
<li><b>Data verification:</b> hash every approved dataset, store the hashes read-only, recompute in CI, and fail the job on any mismatch.</li>
<li><b>Integrity across parties:</b> digitally sign archives and record the hashes on an append-only ledger.</li>
<li><b>Augmentation</b> (rotate, flip, add noise) improves generalization. Tag synthetic data so it stays traceable.</li>
<li><b>Balancing:</b> when benign traffic is 99% of the data, a model can score high by calling everything safe. Down-sample the majority class or rebalance.</li>
<li><b>Sharing risk:</b> unsanitized IOC lists and timestamped logs reveal detection techniques and your operating hours and shifts.</li>
<li><b>Semi-structured</b> files (JSON, YAML, email headers) can hide tokens and passwords, so scan them before use.</li>
<li><b>RAG store protections:</b> encrypt the vector index, isolate tenants (departments can't retrieve each other's content), and sanitize documents and queries against injection.</li>
</ul>`},
d1b5:{terms:['Design stage','Operation/inference','Response levels','Model registry','Signed heartbeats'],html:`
<h4>CertMaster's 6-stage life cycle (know both lists)</h4>
<ol><li><b>Design</b>: goals and risk appetite; threat modeling and compliance obligations start here.</li>
<li><b>Data collection & preparation</b>: provenance, hash-based immutability checks, tokenize PII.</li>
<li><b>Model development/training</b>: dependency scanning, reproducible builds, isolated training networks, adversarial training.</li>
<li><b>Model deployment/integration</b>: canary or blue-green rollout; connect alerts to the SIEM.</li>
<li><b>Operation/inference</b>: runtime monitoring for features drifting beyond training distributions, latency spikes (DoS), and unusual calls.</li>
<li><b>Monitoring & maintenance</b>: <b>regular red-teaming, patching underlying libraries, revisiting threat models</b>, and retraining from feedback pipelines (false positives, analyst annotations, post-incident reports). It loops back to design.</li></ol>
<p>The Sybex 8-stage list (business case, collection, development, evaluation, deployment, validation, monitoring, feedback) maps onto this same loop.</p>
<h4>Authenticity and trust at intake</h4>
<ul><li>Signed sources, an auditable chain of custody, and allow-listed crawler domains. Log the checks in immutable audit trails.</li>
<li><b>Crowd-sourced labels</b>: strong identity verification plus continuous quality scoring. Keep raw and labeled versions so you can revert.</li>
<li><b>Starved pipelines</b>: a DoS on sensors can make silence look normal. Use rate limits, redundant sensors, and <b>cryptographically signed heartbeats</b> with sequence numbers.</li>
<li><b>Known-answer reference inputs</b> in the stream reveal slow threshold-shifting poisoning.</li>
<li><b>Model registry</b> plus formal change control, documented approvals, change windows, and rollback plans.</li></ul>
<h4>Human roles</h4>
<ul><li><b>Human-in-the-loop</b>: a qualified person decides at critical points. <b>Oversight</b>: ongoing dashboard review with authority to suspend automation. <b>Validation</b>: independent sampling with known inputs.</li>
<li><b>Response levels:</b> detect-only → auto-remediate → human-approve. Use the two-person rule for critical actions, and fall back to monitor-only when confidence drops.</li>
<li>Oversight roles: <b>model owner</b> (integrity), <b>risk owner</b>, and <b>steward</b> (ethics), independent of the builders.</li></ul>`},
d2b1:{terms:['AVID','AI Incident Database','arXiv','CWE','Causal taxonomy','Domain taxonomy'],html:`
<h4>Correction: STRIDE</h4>
<p>STRIDE categorizes attacker threat types. It does <b>not</b> separate intentional from accidental risk. The resource that does is the <b>MIT AI Risk Repository's causal taxonomy</b>: entity (AI/human/other), intent (intentional/unintentional/other), and timing (pre- or post-deployment).</p>
<h4>Threat resources: pick by what you need</h4>
<ul><li><b>MIT AI Risk Repository</b>: risk database with causal and domain taxonomies (7 domains, e.g., Privacy & Security, Misinformation, Malicious Actors & Misuse).</li>
<li><b>CVE AI Workgroup</b>: criteria and taxonomies for AI vulnerabilities; assigns CVE IDs.</li>
<li><b>AVID</b>: open-source knowledge base of failure modes for models, datasets, and systems. Check it before you deploy a component.</li>
<li><b>AI Incident Database (AIID)</b>: real-world harms (deepfakes, bias, misuse) to study attack patterns.</li>
<li><b>arXiv</b>: newest research papers. <b>CWE</b>: map prompt injection to CWE-77 and system prompt leakage or inversion to CWE-200.</li></ul>
<h4>Prerequisites, team, and process</h4>
<ul><li><b>Prerequisites:</b> AI architecture and data flows, AI threats, organizational security policies, regional compliance standards, and knowledge of threat-modeling frameworks.</li>
<li><b>Teams:</b> security, application architecture, development, infrastructure, legal and compliance, and an AI architect.</li>
<li><b>Process:</b> (1) gather the use case, diagrams, data collected and processed, users, deployment, and key assets → (2) choose fitting frameworks (OWASP LLM/ML Top 10, ATLAS, NIST AI RMF, STRIDE, DREAD, MAESTRO) → (3) identify threats as an attacker → (4) rate likelihood × impact → (5) report and walk stakeholders through it → (6) reassess throughout the SDLC.</li></ul>
<h4>OWASP ML Security Top 10 (2023)</h4>
<p>ML01 input manipulation · ML02 data poisoning · ML03 model inversion · ML04 membership inference · ML05 model theft · ML06 AI supply chain · ML07 transfer learning · ML08 model skewing · ML09 output integrity · ML10 model poisoning.</p>`},
d2b3:{terms:['Intent detection','Secrets detection','Session rate limit','Quantity quota','Virtual keys'],html:`
<h4>Guardrail types</h4>
<ul><li><b>PII/PCI redaction</b>: mask personal and card data in inputs and outputs. <b>Prompt injection prevention</b>: block attempts to override instructions. <b>Jailbreaking prevention</b>: analyze chained prompts that force unsafe content.</li>
<li><b>Secrets/credential detection</b>: API keys, tokens, passwords, internal URLs. <b>Injection attacks prevention</b>: XSS, SSRF, markdown injection. <b>Malware detection</b>: malicious links and exploit code in outputs. <b>Phishing detection</b>: deceptive output and URLs. <b>Intent detection</b>: restrict requests outside approved use cases.</li>
<li>Guardrails operate at the input, output, and contextual layers. Moving them into a <b>prompt firewall at the gateway</b> centralizes policy for every app.</li></ul>
<h4>Model evaluation depends on the source</h4>
<ul><li><b>In-house:</b> full review of lineage and controls. <b>Open-source pre-trained:</b> training data integrity, embedded bias, content moderation, policy alignment. <b>Vendor API:</b> audit external assurances (SOC 2, third-party pen tests, ISO attestations, performance claims, contract compliance).</li></ul>
<h4>Gateway quotas</h4>
<ul><li><b>Rate limit</b>: requests per short window (reject or queue). <b>Session-based limit</b>: requests per session or conversation. <b>Token limit</b>: input and output tokens. <b>Input quota</b>: data or requests over days, weeks, or months (data size in MB/GB/tokens). <b>Quantity quota</b>: number of files or items (e.g., 20 per session). <b>Modality limit</b>: allowed input types; can switch one off everywhere instantly.</li>
<li><b>Scoped virtual keys</b> per app or user with expiry, rotation, and instant revocation instead of one master key. <b>Retries</b> must count against rate limits.</li></ul>
<h4>Control testing methods</h4>
<p>Prompt injection, data poisoning (fake training labels), output handling (does a script tag render?), supply chain (hidden triggers in downloaded models), excessive agency (destructive action without approval), system prompt leakage ("what were you told never to say?"), indirect injection (planted text in fetched content), bias (counterfactual inputs), hallucination (invented facts), guardrail bypass (fiction or role framing), rate limitation (flood scripts), and access control (asking for other users' data).</p>`},
d2b5:{terms:['IAAA','ABAC','Policy as code','API control profile'],html:`
<h4>IAM processes and models</h4>
<ul><li><b>Identification</b>: create an identity that uniquely represents the user, device, or process. <b>Authentication</b>: prove it. <b>Authorization</b>: grant and enforce rights. <b>Accounting</b>: log usage and alert on unauthorized attempts.</li>
<li><b>RBAC</b> grants by role. <b>ABAC</b> grants by attributes (e.g., a 'public' data label, location, time).</li>
<li>Use separate permissions for <b>inference</b> and for <b>retraining</b>.</li>
<li><b>Policy as code</b> (OPA, AWS IAM, Azure Policy): define, test, and version policies, then <b>roll them out automatically to every environment together</b> for consistent, auditable enforcement.</li>
<li><b>API control profile:</b> authentication (OAuth2, API keys, JWT), authorization, throttling, input/output validation, audit logging, content filtering, and context-aware controls.</li>
<li><b>Agents and tools</b> are privileged execution surfaces: explicit tool allow lists, network ACLs, expiring secrets, logging, anonymization, and human-in-the-loop.</li>
<li><b>Network/API:</b> enforce HTTPS, one-time tokens, input validation before execution, firewalls, and MFA.</li></ul>`},
d3b1:{terms:['DP-SGD','Homomorphic encryption','TEE','Static vs dynamic masking','Minimization vs redaction'],html:`
<h4>Privacy techniques you missed on CertMaster</h4>
<ul><li><b>Differential privacy</b>: add calibrated noise (e.g., randomly add or subtract a few years from ages) so the model learns trends without exposing individuals. <b>DP-SGD</b> clips each example's gradient and adds noise. More noise means more privacy and less accuracy. Defends against membership inference.</li>
<li><b>Homomorphic encryption</b>: compute on data while it stays encrypted, so even processors never see cleartext. <b>TEEs/secure enclaves</b>: hardware isolation for data in use.</li>
<li><b>Data masking</b>: swap real values for fictional ones when the real content isn't needed, typically <b>development, testing, or other non-production work</b>. Static = a separate masked copy. Dynamic = masked as accessed.</li>
<li><b>Minimization</b> happens before or during collection. <b>Redaction</b> happens after collection. Anonymization removes identifying details.</li>
<li><b>Keys</b> belong in a KMS, TPM, or HSM (AWS KMS, Azure Key Vault), separate from the data. <b>Transit:</b> TLS 1.3+, or HTTP/3 with QUIC.</li>
<li><b>DLP</b> (e.g., Purview) tracks regulated data from collection to destruction, but only works with clear classification labels.</li></ul>`},
d3b3:{terms:['Canary prompts','ROUGE','ROC AUC','Golden dataset','Counterfactual testing','Break-glass'],html:`
<h4>What to log</h4>
<p>Input prompts, model responses, latency, stop parameters, error codes, and token use per user. Sanitize PII/PHI (masking or tokenization), encrypt logs, set them read-only, and ship copies to a remote location. Watch for contextual drift across consecutive prompts.</p>
<h4>Quality and drift</h4>
<ul><li><b>Canary prompts</b>: fixed prompts run regularly to check accuracy, safety, and policy. <b>Golden dataset</b>: trusted truth set used after every update. <b>Counterfactual testing</b>: change one attribute and see if the output changes (bias).</li>
<li><b>Grounding checks</b> tie answers to trusted sources. Also use confidence monitoring and RAG tuning.</li>
<li><b>ROC AUC</b> = how well a classifier separates two classes. <b>BLEU</b> = word overlap (translation; misses context). <b>ROUGE</b> = better for summaries; tolerates paraphrasing.</li></ul>
<h4>Cost and operations</h4>
<ul><li>Prompt compression, <b>cost per successfully completed task</b>, cost breakdown by project or customer, <b>LRU eviction</b> of old embeddings, retention and deduplication policies, and a documented rebuild frequency.</li>
<li><b>Break-glass</b> access: justified, logged, and automatically revoked. Audit access logs across all models and endpoints with separation of duties.</li>
<li><b>Rule actions must match policy.</b> Your CertMaster PBQ miss was choosing "block and log" where policy wanted "flag and alert analyst."</li></ul>`},
d3b5:{terms:['Backdoor','Trojan','Honey endpoint','Schema validation','Model skewing'],html:`
<h4>Backdoor vs. trojan (missed twice on CertMaster)</h4>
<ul><li><b>Backdoor</b>: a <b>trigger</b> (pixel pattern, sticker, phrase) is planted through <b>data poisoning during training</b>. The model behaves normally until the trigger appears.</li>
<li><b>Trojan</b>: <b>malicious code hidden inside the model package</b>. Outputs look normal while it acts in the background (e.g., copying uploads to an attacker server). It often arrives through the supply chain or deployment pipeline.</li></ul>
<h4>Detecting and disrupting model theft</h4>
<ul><li>Per-source <b>rate limits</b>, monitoring for spikes of similar or <b>systematically varied</b> queries, auto-throttling, <b>honey (decoy) endpoints</b>, watermarking API outputs, coarse confidence scores, and locked-down storage for weights, LoRA adapters, and checkpoints.</li>
<li><b>Inversion</b> reconstructs training data, <b>membership inference</b> tests whether a record was in training (enabled by overfitting and precise confidence scores), and <b>extraction</b> clones the model.</li></ul>
<h4>Skew, poisoning, and output integrity</h4>
<ul><li><b>Model skewing / data drift:</b> overall accuracy can stay stable while a specific segment fails. Compare recent feature and label distributions against baselines.</li>
<li><b>Poisoning detection:</b> similarity scores against trusted data, reproducibility checks, and drift detection.</li>
<li><b>Schema validation:</b> reject output that doesn't match the defined JSON schema. A spike in failures is a high-confidence alarm.</li>
<li><b>Chain-of-thought</b> traces can be injected and can contain secrets, so protect them if you log them.</li>
<li><b>Compensating control example:</b> a medical assistant checks outputs against an approved clinical knowledge base (a guardrail that validates output) rather than relying on prompt templates.</li></ul>`},
d4b1:{terms:['IDE plug-in','CLI plug-in','Personal assistant','Browser plug-in','MCP server'],html:`
<h4>Tool selection: your biggest CertMaster gap</h4>
<table class="mini"><tr><th>Tool</th><th>Pick it when the use case is…</th></tr>
<tr><td>IDE plug-in</td><td>Code quality, linting, vulnerability analysis <i>as code is written</i>, refactoring, explaining code (Copilot, Tabnine, Codeium, CodeWhisperer).</td></tr>
<tr><td>CLI plug-in</td><td>Terminal work: generating and explaining commands, scripts over log files, packet-capture signature matching, log pattern recognition, driving pen-test frameworks (aicommits, Codex-CLI).</td></tr>
<tr><td>Chatbot</td><td>Conversational Q&A, translation and summarization of reports, collaborative threat-modeling guidance.</td></tr>
<tr><td>Personal assistant</td><td><b>Tracking procedure completion</b>, assigning tasks, triggering playbooks, <b>case status updates to the whole team</b>.</td></tr>
<tr><td>Browser plug-in</td><td>Phishing and fraud detection on pages and URLs as users browse.</td></tr>
<tr><td>MCP server</td><td>AI agents sharing context and state, and connecting to back-end streams (e.g., real-time transaction anomaly detection). Risk: <b>context leakage</b>, so add access control, logging, and encryption.</td></tr></table>
<ul><li>Test every AI tool in a controlled environment first: hallucinated code or commands can make unintended changes.</li>
<li><b>Linting</b> = code quality and standards. <b>SAST</b> = security vulnerabilities (injection, XSS, broken auth).</li>
<li>Fraud detection catches "impossible travel": transactions too far apart in too little time.</li></ul>`},
d4b3:{terms:['Data correlation','Honeypot evasion','Disinformation'],html:`
<h4>Recon and correlation</h4>
<p>AI correlates breach dumps (spotting reused or similar passwords), OSINT, and leaked data in minutes to find high-value targets and likely attack paths. It also handles semantic enrichment, attack planning, automated vulnerability validation, and adaptive phishing.</p>
<h4>Deception</h4>
<ul><li><b>Disinformation</b> is deliberate (e.g., repeated fabricated videos of an official to sway opinion). <b>Misinformation</b> isn't intentional.</li>
<li>"Phishing 3.0": personalized from public data, no grammar errors, possibly backed by a deepfake of a known executive. GANs also generate spam variants that slip past filters.</li>
<li><b>Honeypots:</b> attackers use AI to spot them from response times and inconsistencies. Defenders use AI to adapt them to the attacker's TTPs.</li></ul>`},
d4b5:{terms:['Regression testing','SBOM','M-of-N'],html:`
<h4>DevSecOps details</h4>
<ul><li><b>SCA</b> reviews third-party components and dependencies, often with an <b>SBOM</b> (libraries, frameworks, dependencies, datasets, models).</li>
<li><b>Unit testing</b> covers individual functions. <b>Model testing</b> checks the right model, input handling, fairness, data leakage, and pen testing. <b>Regression testing</b> re-runs tests after every change and rolls back if something breaks.</li>
<li>Automated change approvals must be logged and verified by humans, because AI can't be held accountable.</li>
<li><b>M-of-N</b>: e.g., 7 of 10 models must approve a change, which avoids a single point of failure.</li>
<li><b>No-code</b> = fully visual. <b>Low-code</b> = some human code (e.g., customizing SOAR playbooks and dashboards). <b>IaC</b> = infrastructure defined in code.</li></ul>`},
d4b7:{terms:['Centralized / federated / hybrid CoE','Platform engineer','AI security architect','AI governance engineer'],html:`
<h4>CertMaster's CoE models</h4>
<ul><li><b>Centralized</b>: most development and all governance in one team; good for small or highly regulated organizations. <b>Federated</b>: developers in business units, with the CoE as standards and assurance. <b>Hybrid</b> (≈ hub-and-spoke): central platforms, policies, and reviews, with business units building inside boundaries. Hybrid is the most common.</li>
<li><b>Policy</b> states what's allowed, what evidence is needed, and who decides (sign-off for promotion to production, training on customer data, autonomous actions). <b>Procedures</b> turn policy into auditable steps. <b>Technical guardrails</b> enforce it (registries, least privilege, secrets management, logging, filtering).</li>
<li><b>Maturity:</b> policy + inventory → registry, standard, monitoring → refined risk management, automated evidence, third-party validation.</li></ul>
<h4>Roles</h4>
<p>Data engineer (pipelines, quality) · data scientist (problem, features, baseline models) · ML engineer (productionize) · AI architect (overall design) · platform engineer (shared infrastructure) · MLOps engineer (CI/CD, versioning, drift, rollback) · AI security architect (protections) · AI governance engineer (codify approvals and evidence) · AI risk analyst (assess risk, track override rates) · AI auditor (independent assurance).</p>`},
d5b1:{terms:['Three lines of AI risk','Human-on-the-loop','Model card'],html:`
<h4>Additions from CertMaster</h4>
<ul><li><b>AI risk is attributed along three lines:</b> (1) business context and the impact of AI decisions, (2) data and model behavior, (3) operations and oversight. (You missed this "select three" item.)</li>
<li><b>Extensive testing before release</b> = accuracy tests + fairness checks across groups + stress tests with unusual inputs + red-teaming. (You missed this twice.)</li>
<li>Also: define decision rights, document the system in a <b>model card</b> (purpose, data sources, training period, limitations, intended users, prohibited uses), monitor after release (technical and business metrics), and prepare AI incident playbooks.</li>
<li><b>Human-in-the-loop</b>: the AI proposes and a person decides. <b>Human-on-the-loop</b>: the AI decides routine cases and humans monitor and can override.</li>
<li>Regulated settings may prefer <b>simpler, interpretable models</b> when performance is comparable.</li>
<li>Treat an acting AI as an <b>untrusted client</b> of your APIs: authenticate, authorize, validate input, scope permissions, rate-limit, and require approval for high-impact actions.</li></ul>`},
d5b2:{terms:['ISO/IEC 42001','ISO/IEC 23894','OECD AI Principles','Sanctioned AI'],html:`
<h4>Standards and frameworks</h4>
<ul><li><b>ISO/IEC 42001</b>: certifiable AI Management System. <b>23894</b>: AI risk management guidance. <b>22989</b>: terminology. <b>5338</b>: life cycle processes (drift, decay).</li>
<li><b>OECD AI Principles</b>: non-binding, adopted 2019, updated 2024. <b>EU AI Act</b>: in force August 1, 2024; most obligations from August 2, 2026. Limited-risk systems carry transparency duties (disclose AI, label synthetic media).</li>
<li><b>Common regulatory themes:</b> accountable governance, an inventory with risk classification, impact assessments before launch, lawful data use and human oversight, continuous measurement, claims that match reality, third-party management, transparency and recourse.</li></ul>
<h4>Organizational policy</h4>
<ul><li>Reduce shadow AI by offering a <b>catalog of sanctioned tools with SSO</b>. Use public models for low-risk work with strong data-use guarantees, and private models for sensitive data (customer-managed keys, no training on your data).</li>
<li><b>Classification drives AI handling:</b> restricted never leaves the trust boundary, confidential is auto-redacted before reaching a model, internal only goes to no-retention models.</li>
<li><b>Third-party evaluations</b> (SOC 2 Type II, pen test, privacy assessment) shorten procurement, affect insurance terms, and keep marketing claims truthful.</li></ul>`}
};
function applyLessonAddenda(){
  DAYS.forEach(d=>d.blocks.forEach(b=>{ const a=LESSON_ADDENDA[b.id]; if(!a||b._addended) return;
    b.body+='<div class="addendum"><div class="addendum-tag">Added Oct 2026 · CertMaster gap review</div>'+a.html+'</div>';
    (a.terms||[]).forEach(t=>{ if(b.terms.indexOf(t)<0) b.terms.push(t); }); b._addended=true; }));
}

   {d:1,t:'Isolation Forest',def:'Unsupervised: cuts the data at random. Records isolated after very few cuts are anomalies.'},

   {d:1,t:'Secure aggregation',def:'Federated learning: client updates are encrypted and only revealed in aggregate, so the server never sees one client\'s contribution.'},
   {d:1,t:'Data verification',def:'Hash every approved dataset, store the hashes read-only, recompute before training, and fail the job on any mismatch.'},
   {d:1,t:'Data balancing',def:'Rebalance class proportions (e.g., down-sample the 99% benign class) so rare attacks get proportionate attention.'},

   {d:1,t:'AI life cycle (CertMaster)',def:'Design → Data collection/prep → Model development/training → Deployment/integration → Operation/inference → Monitoring/maintenance (then back to design).'},
   {d:2,t:'AVID',def:'AI Vulnerability Database: open-source knowledge base of failure modes for models, datasets, and systems. Search it before deploying a component.'},

   {d:2,t:'Quantity quota',def:'Caps the number of files, documents, or items a user or app can upload or process per session, day, or month.'},
   {d:2,t:'Session-based rate limit',def:'Caps requests within a single active session or conversation, not a reset-every-minute window.'},

   {d:2,t:'Identification (IAM)',def:'Creating an account or identity that uniquely represents a user, device, or process. Then authentication, authorization, accounting.'},
   {d:2,t:'Policy as code',def:'Access policy defined, tested, versioned, and automatically deployed to every environment (OPA, AWS IAM, Azure Policy).'},
   {d:2,t:'DP-SGD',def:'Differentially private SGD: clip each example\'s gradient and add noise. More noise = more privacy, less accuracy.'},

/* ============================== GAMES: SHARED (sound, helpers) ============================== */
const SFX = (function(){
  let ctx=null;
  function ensure(){
    if(ctx) return ctx;
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC) ctx=new AC(); }catch(e){}
    return ctx;
  }
  function tone(freq, start, dur, type, vol){
    const c=ensure(); if(!c) return;
    const t0=c.currentTime+start;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.16,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }
  const lib={
    click(){ tone(660,0,0.06,'square',0.05); },
    tick(){ tone(1100,0,0.03,'square',0.04); },
    correct(){ tone(523,0,0.12,'triangle'); tone(659,0.10,0.12,'triangle'); tone(784,0.20,0.24,'triangle'); },
    wrong(){ tone(160,0,0.28,'sawtooth',0.14); tone(120,0.12,0.30,'sawtooth',0.12); },
    lose(){ tone(392,0,0.18,'triangle'); tone(330,0.16,0.18,'triangle'); tone(262,0.32,0.38,'triangle'); },
    dd(){ [392,523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.16,'sawtooth',0.08)); },
    win(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.2,'triangle',0.15)); tone(1047,0.5,0.5,'triangle',0.15); },
    bankrupt(){ tone(220,0,0.4,'sawtooth',0.14); tone(110,0.15,0.6,'sawtooth',0.14); }
  };
  return { play(n){
    if(STATE.soundOn===false) return;
    const c=ensure(); if(!c) return;
    try{ if(c.state==='suspended'&&c.resume) c.resume(); if(lib[n]) lib[n](); }catch(e){}
  }};
})();

function gEl(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function gShuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function gBtn(label, cls, fn){ const b=gEl('button','btn '+(cls||''),label); b.onclick=fn; return b; }
function setBest(key,val){
  STATE.gameStats=STATE.gameStats||{};
  if(val>(STATE.gameStats[key]||0)){ STATE.gameStats[key]=val; saveState(); return true; }
  return false;
}
function gMoney(n){ return (n<0?'-$':'$')+Math.abs(n); }
function getBest(key){ return (STATE.gameStats&&STATE.gameStats[key])||0; }

let GAME_TIMER=null, GAME_KEYHANDLER=null, WHEEL_TIMEOUT=null;
function stopGameTimers(){
  if(GAME_TIMER){ clearInterval(GAME_TIMER); GAME_TIMER=null; }
  if(WHEEL_TIMEOUT){ clearTimeout(WHEEL_TIMEOUT); WHEEL_TIMEOUT=null; }
  if(typeof WHEEL!=='undefined' && WHEEL && WHEEL.phase==='spinning'){ WHEEL.phase='spin'; WHEEL.msg='Spin the wheel.'; }
  GAME_KEYHANDLER=null;
}
document.addEventListener('keydown', e=>{
  if(!GAME_KEYHANDLER) return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  GAME_KEYHANDLER(e);
});

function gameHeader(title, sub, pills){
  const main=document.getElementById('main'); main.innerHTML='';
  const top=gEl('div','topline');

  right.appendChild(sb);
  top.appendChild(left); top.appendChild(right); main.appendChild(top);
  return main;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecAI+ CY0-001 — Video Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1C; --panel:#0F1729; --panel-2:#141F38; --line:#22304F;
  --ink:#E8ECF4; --ink-dim:#8B96AC; --cyan:#5AC8FA; --green:#3DDC84; --amber:#F5B942; --red:#F0555A;
  --mono:'JetBrains Mono',monospace; --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.mono{font-family:var(--mono);} .disp{font-family:var(--disp);}

#app{display:flex;min-height:100vh;}

/* Sidebar / playlist */
#pl{width:300px;flex:none;background:linear-gradient(180deg,var(--panel),#0B1220);border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 14px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.brand-mark{width:32px;height:32px;border-radius:8px;background:conic-gradient(from 220deg,var(--cyan),var(--green) 40%,var(--amber) 70%,var(--red) 100%);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:10px;color:#0A0F1C;flex:none;}
.brand-text .t1{font-family:var(--disp);font-weight:700;font-size:13px;}
.brand-text .t2{font-family:var(--mono);font-size:10px;color:var(--ink-dim);}

.support-note{font-size:11px;color:var(--ink-dim);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:14px;line-height:1.4;}
.support-note.warn{border-color:var(--amber);color:var(--amber);}

.pl-progress{margin-bottom:14px;}
.pl-progress-top{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim);margin-bottom:5px;}
.pl-track{height:6px;border-radius:4px;background:#1A2740;overflow:hidden;}
.pl-fill{height:100%;background:var(--green);border-radius:4px;}

.dayhead{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin:14px 4px 6px;}
.ep{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;}
.ep:hover{background:#131E36;}
.ep.active{background:#132038;border-color:var(--line);}
.ep .num{font-family:var(--mono);font-size:11px;color:var(--ink-dim);width:20px;flex:none;padding-top:1px;}
.ep .meta{flex:1;min-width:0;}
.ep .ttl{font-size:12.5px;line-height:1.3;}
.ep .sub{font-size:10.5px;color:var(--ink-dim);margin-top:2px;font-family:var(--mono);}
.ep .dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;margin-top:4px;}
.ep .dot.done{background:var(--green);}
.ep .dot.playing{background:var(--cyan);}

/* Main player */
#player{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:26px 20px 40px;}
.screen-wrap{width:100%;max-width:820px;}
.screen{
  width:100%;aspect-ratio:16/9;border-radius:16px;border:1px solid var(--line);
  background:radial-gradient(circle at 20% 15%,rgba(90,200,250,.10),transparent 45%),
             radial-gradient(circle at 85% 90%,rgba(61,220,132,.08),transparent 45%),
             linear-gradient(160deg,#101B33,#0A1220);
  position:relative;overflow:hidden;display:flex;flex-direction:column;padding:26px 30px;
}
.screen .epcode{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.06em;}
.screen h2{font-family:var(--disp);font-size:clamp(18px,3vw,26px);margin:6px 0 18px;}
.slide-bullets{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;}
.bullet{
  font-size:clamp(13px,1.9vw,16.5px);line-height:1.5;color:#8792A8;padding:9px 14px;border-radius:9px;
  border-left:3px solid transparent;transition:all .25s ease;
}
.bullet.active{color:var(--ink);background:rgba(90,200,250,.08);border-left-color:var(--cyan);transform:translateX(2px);}
.bullet.past{color:#5C6884;}

.viz{position:absolute;bottom:14px;right:20px;display:flex;gap:3px;align-items:flex-end;height:20px;opacity:.6;}
.viz span{width:3px;background:var(--green);border-radius:2px;animation:bar 1s ease-in-out infinite;}
.viz span:nth-child(2){animation-delay:.15s;} .viz span:nth-child(3){animation-delay:.3s;}
.viz span:nth-child(4){animation-delay:.45s;} .viz span:nth-child(5){animation-delay:.6s;}
@keyframes bar{0%,100%{height:5px;}50%{height:18px;}}
.viz.paused span{animation-play-state:paused;height:5px;}

.caption-bar{
  margin-top:14px;min-height:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 16px;font-size:13.5px;line-height:1.5;color:var(--ink);
}
.caption-bar .lbl{font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);letter-spacing:.08em;display:block;margin-bottom:3px;}

/* Controls */
.controls{width:100%;max-width:820px;margin-top:16px;}
.scrub{height:5px;border-radius:4px;background:#1A2740;cursor:pointer;overflow:hidden;margin-bottom:12px;}
.scrub-fill{height:100%;background:var(--cyan);width:0%;}
.ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.ctrl-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;
}
.ctrl-btn.play{width:50px;height:50px;background:var(--cyan);color:#04121F;border:none;font-size:18px;}
.ctrl-btn:hover{border-color:var(--cyan);}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed;}
.spacer{flex:1;}
select, .rate-btn{
  font-family:var(--mono);font-size:12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;cursor:pointer;
}
.toggle{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);}
.toggle input{accent-color:var(--cyan);}
.timecode{font-family:var(--mono);font-size:11px;color:var(--ink-dim);}

.ep-nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px;}
.ep-nav .btn{
  flex:1;font-family:var(--mono);font-size:12px;padding:10px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);cursor:pointer;text-align:center;
}
.ep-nav .btn:hover{border-color:var(--cyan);color:var(--cyan);}
.ep-nav .btn:disabled{opacity:.35;cursor:not-allowed;}

@media(max-width:880px){
  #app{flex-direction:column;}
  #pl{width:100%;height:auto;position:relative;max-height:280px;}
  #player{padding:16px;}
}
</style>
</head>
<body>
<div id="app">
  <aside id="pl">
    <div class="brand">
      <div class="brand-mark">CY0</div>
      <div class="brand-text"><div class="t1">SECAI+ VIDEO COURSE</div><div class="t2">CY0-001 · WATCH &amp; LISTEN</div></div>
    </div>
    <div id="supportNote"></div>
    <div class="pl-progress">
      <div class="pl-progress-top"><span>Course progress</span><span id="plPct">0%</span></div>
      <div class="pl-track"><div class="pl-fill" id="plFill" style="width:0%"></div></div>
    </div>
    <div id="playlist"></div>
  </aside>

  <main id="player">
    <div class="screen-wrap">
      <div class="screen" id="screen">
        <div class="epcode mono" id="epCode">—</div>
        <h2 id="epTitle">Loading…</h2>
        <div class="slide-bullets" id="bullets"></div>
        <div class="viz" id="viz"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="caption-bar"><span class="lbl">CAPTION</span><span id="captionText">Press play to begin.</span></div>

      <div class="controls">
        <div class="scrub" id="scrub"><div class="scrub-fill" id="scrubFill"></div></div>
        <div class="ctrl-row">
          <button class="ctrl-btn" id="btnPrevSlide" title="Previous slide">⟲</button>
          <button class="ctrl-btn play" id="btnPlay" title="Play/Pause">▶</button>
          <button class="ctrl-btn" id="btnNextSlide" title="Next slide">⟳</button>
          <span class="timecode" id="timecode">Slide 0/0</span>
          <div class="spacer"></div>
          <select id="rateSel" title="Playback speed">
            <option value="0.8">0.8×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
          </select>
          <select id="voiceSel" title="Narrator voice"></select>
          <label class="toggle"><input type="checkbox" id="autoplayChk" checked> Autoplay next</label>
        </div>
      </div>

      <div class="ep-nav">
        <button class="btn" id="btnPrevEp">← Previous episode</button>
        <button class="btn" id="btnNextEp">Next episode →</button>
      </div>
    </div>
  </main>
</div>

<script>
/* ============================== EPISODE DATA ============================== */
/* Each slide: heading + chunks. Each chunk has cap (on-screen bullet) and say (spoken text). */
function ep(id, day, domain, code, title, slides){ return {id, day, domain, code, title, slides}; }
function sl(heading, chunks){ return {heading, chunks}; }
function ch(cap, say){ return {cap, say: say||cap}; }

const EPISODES = [

ep('e00', 0, 0, 'INTRO', 'Welcome to the SecAI+ Bootcamp Course',[
 sl('How this course works',[
  ch('60-minute exam, 60 questions, passing score 600 of 900','Here is what you are working toward. The CompTIA SecAI+ exam, code C Y zero dash zero zero one, is sixty questions in sixty minutes, mixing multiple choice with performance-based questions, and the passing score is six hundred on a scale of one hundred to nine hundred.'),
  ch('Four domains, weighted very unevenly','The exam blueprint has four domains, and they are not weighted evenly. Securing AI Systems is forty percent all by itself. AI-assisted Security is twenty-four percent. Governance, Risk, and Compliance is nineteen percent. And Basic AI Concepts, the vocabulary domain, is seventeen percent.'),
  ch('This course follows the weighting, not the page order','Because of that, this course spends the most time on Securing AI Systems, less on AI-assisted Security and Governance, and treats Basic AI Concepts as the vocabulary foundation everything else depends on.'),
  ch('Sit back, listen, and let each episode auto-advance','Each episode plays like a short lecture. Bullets highlight on screen as I talk through them, and when an episode ends, the next one starts automatically unless you turn that off. You can pause, rewind a slide, skip ahead, or change the playback speed at any time.')
 ])
]),

ep('e01', 1, 1, '1.1', 'AI Types, Training, and Prompt Engineering',[
 sl('Types of AI',[
  ch('Generative AI creates new content','Generative AI is the branch of AI that produces new content, like text, images, or code, instead of just classifying or predicting based on existing data.'),
  ch('Machine learning improves from data','Machine learning describes systems that improve their performance from data, without being explicitly reprogrammed for every new task.'),
  ch('Deep learning uses multi-layer neural networks','Deep learning is a subset of machine learning that relies on neural networks with many layers stacked on top of each other.'),
  ch('Transformers power modern LLMs through attention','Transformers are the architecture behind most modern large language models. Their defining feature is the attention mechanism, which lets the model weigh relationships across an entire input at once, rather than reading it strictly word by word.'),
  ch('NLP is the broader field; LLMs and SLMs are implementations','Natural language processing, or N L P, is the broad field of machines working with human language. Large language models and small language models are specific implementations within that field.')
 ]),
 sl('LLMs, SLMs, and GANs',[
  ch('LLM: broad, general-purpose, resource-heavy','A large language model is broad, general-purpose, and resource-heavy. It is trained on huge, diverse datasets and can handle a wide range of tasks.'),
  ch('SLM: narrower, cheaper, often edge-deployed','A small language model is narrower in scope, cheaper to run, and often fine-tuned for one specific task or deployed directly on a device with limited compute.'),
  ch('GAN: generator vs. discriminator, common in deepfakes','A generative adversarial network, or GAN, pits two networks against each other. A generator creates content, and a discriminator tries to tell real from fake. The generator improves by learning to fool the discriminator. This is the technology behind most deepfakes, which becomes very relevant again later in this course.')
 ]),
 sl('Training concepts',[
  ch('Supervised learning uses labeled data','Supervised learning trains a model on labeled input and output pairs, so it learns a mapping between the two.'),
  ch('Unsupervised learning finds patterns without labels','Unsupervised learning finds clusters or patterns in data that has no labels at all.'),
  ch('Reinforcement learning uses reward and penalty','Reinforcement learning shapes behavior through a feedback loop of rewards and penalties, rather than labeled examples.'),
  ch('Fine-tuning specializes a pre-trained model','Fine-tuning takes a model that has already been trained broadly, and trains it further on a narrower, domain-specific dataset.'),
  ch('Pruning removes weights; quantization lowers precision','Pruning shrinks a model by removing weights it does not need. Quantization shrinks it a different way, by reducing the numerical precision of the weights that remain, which speeds up inference at some cost to accuracy.')
 ]),
 sl('Prompt engineering vocabulary',[
  ch('System prompt sets behavior; user prompt is the input','A system prompt sets the model behavior or persona and is usually hidden from the end user. A user prompt is what the person actually types.'),
  ch('Zero-shot, one-shot, and multi-shot prompting','Zero-shot means no examples are given. One-shot gives a single example. Multi-shot, also called few-shot, gives several examples to steer the format or quality of the output.'),
  ch('Prompt templates double as a security control','A prompt template is a reusable, structured prompt pattern. Later this week, you will see prompt templates come back as an actual security control, because they limit how much free text an attacker can inject.'),
  ch('Exam angle: know why an LLM differs from an SLM','On the exam, expect questions asking you to explain why a large language model differs from a small one, and when you would choose to fine-tune a model instead of simply prompt-engineering it.')
 ]),
 sl('Model quality problems and dimensionality techniques',[
  ch('Overfitting versus underfitting','Overfitting means a model performs beautifully on its training data but fails to generalize to new examples, because it essentially memorized the training set instead of learning the real pattern. Underfitting is the opposite problem: the model is too simple to capture the pattern at all, so it performs poorly even on the data it trained on.'),
  ch('Concept drift is not the same as a training bug','Concept drift is when a deployed model\u2019s accuracy quietly degrades over time, because real-world data has shifted away from what it was originally trained on. A phishing-URL classifier trained last year missing this year\u2019s new phishing patterns is concept drift, not a bug in the model itself.'),
  ch('Data imbalance skews minority-class accuracy','Data imbalance is a training set with far more examples of one class than another, which leads to poor prediction accuracy specifically for the underrepresented class.'),
  ch('Precision, recall, and F1 score','These are the standard model evaluation metrics, tested against data the model has never seen before, not just the training set.'),
  ch('PCA and k-means, two named techniques worth knowing','Principal component analysis, or PCA, reduces the number of features in a dataset while preserving the key patterns, which is useful for visualizing complex data like network traffic. K-means clustering is a common unsupervised technique for grouping similar data points together, for example to flag unusual traffic that does not fit any existing group.')
 ])
]),

ep('e02', 1, 1, '1.2', 'Data Security and RAG Foundations',[
 sl('Data hygiene concepts',[
  ch('Lineage: traceable history of data','Data lineage is the traceable history of where a piece of data came from and how it was transformed along the way.'),
  ch('Provenance: origin and authenticity','Data provenance is specifically about the origin and authenticity of that data source.'),
  ch('Integrity means data has not been improperly altered','Data integrity is the assurance that data has not been changed in an unauthorized or unintended way.'),
  ch('Cleansing removes errors and duplicates','Data cleansing is the process of removing errors, duplicates, and inconsistencies before that data is used to train or run a model.'),
  ch('Structured, semi-structured, and unstructured data, and watermarking','Structured data lives in tables and databases, highly organized and easy to secure. Semi-structured data, like emails or log files, has some structure but needs custom validation. Unstructured data, like free text, images, and video, is the hardest to govern and makes up most AI training data. Watermarking embeds a hidden signal in AI-generated or training content, so its origin can be proven later.')
 ]),
 sl('Retrieval-Augmented Generation, or RAG',[
  ch('RAG pulls in outside data at query time','RAG lets a model pull in external or enterprise data at the moment of the query, instead of relying only on what it learned during training.'),
  ch('Embeddings capture semantic meaning as vectors','Embeddings are numerical vector representations of text or data that capture semantic meaning, so similar concepts end up close together mathematically.'),
  ch('Vector databases store embeddings for fast search','A vector database stores those embeddings and supports fast similarity search. This is where your enterprise data actually meets model behavior, and it is a real, exploitable attack surface.'),
  ch('Exam angle: leaks usually trace back to retrieval, not the model','If a scenario describes a chatbot leaking confidential internal data, the root cause is almost always missing access controls on the vector store or retrieval layer, not a flaw in the underlying model itself.')
 ])
]),

ep('e03', 1, 1, '1.3', 'Security Throughout the AI Life Cycle',[
 sl('The five life-cycle stages, in order',[
  ch('One: the business case','It starts with the business case. Define the problem and the value before you ever touch data or a model.'),
  ch('Two: data collection','Next is data collection, where sourcing, consent, and lineage tracking all begin.'),
  ch('Three: model development and evaluation','Third is model development and evaluation, where the model is trained and tested against accuracy, bias, and security criteria.'),
  ch('Four: deployment','Fourth is deployment, releasing the model into production with guardrails and access controls already in place.'),
  ch('Five: ongoing monitoring','And fifth is ongoing monitoring. The life cycle does not end at launch. Drift, abuse, and new threats all have to be watched continuously.'),
  ch('Exam angle: know the order','Expect ordering questions on the exam, like at which stage a particular control or activity should happen.')
 ]),
 sl('Human-centric design principles',[
  ch('Human-in-the-loop: active participation','Human-in-the-loop means a human actively participates in the decision or output process.'),
  ch('Human oversight: monitoring with intervention','Human oversight means humans monitor the system and can intervene, even if they are not reviewing every single transaction.'),
  ch('Human validation: verifying before acting','Human validation means a human verifies or approves outputs before they are acted on, especially for high-consequence decisions.'),
  ch('Exam angle: automated high-stakes actions are a red flag','If a scenario describes a model automatically freezing accounts or denying loans with zero human review, that is a gap in human oversight and validation. Flag that pattern immediately.')
 ])
]),

ep('e04', 2, 2, '2.1', 'AI Threat-Modeling Resources',[
 sl('Five catalogs, and when to reach for each',[
  ch('OWASP LLM Top 10: top risks for LLM applications','The OWASP LLM Top 10 lists the top risks specific to large language model applications, things like prompt injection and insecure output handling.'),
  ch('OWASP ML Security Top 10: broader ML risks','The OWASP Machine Learning Security Top 10 covers broader machine-learning risks that go beyond just language models.'),
  ch('MITRE ATLAS: the ATT&CK for adversarial AI','MITRE ATLAS is the adversarial-AI counterpart to MITRE ATT&CK. It catalogs real-world adversary tactics and techniques specifically against AI systems.'),
  ch('MIT AI Risk Repository: broad academic risk database','The MIT AI Risk Repository is a broad, academic and industry-sourced database of AI risks across many categories, useful for governance-style framing.'),
  ch('CVE AI Working Group: tracked, numbered vulnerabilities','The CVE AI Working Group extends the standard CVE vulnerability tracking process specifically to AI vulnerabilities.'),
  ch('Exam angle: match the described weakness to the right catalog','On the exam, you will be given a description of a weakness or need, and asked to pick which framework or resource actually models it.')
 ])
]),

ep('e05', 2, 2, '2.2', 'Security Controls for AI Systems',[
 sl('Model controls',[
  ch('Guardrails constrain input and output','Guardrails are rules or filters that constrain what the model will accept as input or produce as output.'),
  ch('Model evaluation tests ongoing quality and security','Model evaluation is the ongoing testing of a model for accuracy, bias, and security regressions over time.'),
  ch('Prompt templates reduce free-text injection surface','Prompt templates constrain the format of what a user can submit, which reduces how much free text an attacker actually has to inject malicious instructions into.')
 ]),
 sl('Gateway controls: the chokepoint before the model',[
  ch('Prompt firewall filters input before the model sees it','A prompt firewall inspects and filters prompts before they ever reach the model, functioning much like a web application firewall does for ordinary web traffic.'),
  ch('Rate limits cap requests; token limits cap size','Rate limits cap how many requests a user or key can make in a given time window. Token limits cap the size of a single input or output, which controls cost and shrinks the abuse surface.'),
  ch('Input quotas, modality limits, and endpoint access controls','Input quotas cap total usage over a longer period. Modality limits restrict which input or output types are even allowed, like text only, no images. And endpoint access controls decide who or what can reach the API in the first place.'),
  ch('Exam angle: model controls shape the model, gateway controls shape what reaches it','Expect requirement-matching questions where you are given a list of requirements and have to choose the right control stack. Model controls shape what the model itself does. Gateway controls shape what is even allowed to reach the model.')
 ])
]),

ep('e06', 2, 2, '2.3', 'Access Controls for AI Systems',[
 sl('Four layers of access control',[
  ch('Model access: who can invoke the model','Model access governs who or what can invoke the model at all.'),
  ch('Data access: who can reach the underlying data','Data access governs who or what can reach the underlying training data or any RAG-connected data store.'),
  ch('Agent access: the newest, most exam-relevant layer','Agent access governs what an autonomous AI agent is permitted to touch, execute, or call entirely on its own. This is the layer most candidates have not thought carefully about before, because agents can take real actions, like writing files or calling external APIs, without a human approving each step.'),
  ch('Network and API access: traditional perimeter controls','Network and API access is the traditional network-layer and API-key-based restriction to the AI service itself.'),
  ch('Exam angle: unapproved agent actions point straight to agent access','If a scenario describes an AI agent doing something on its own that it should not have been able to do, like deleting records or sending unauthorized emails, that is an agent access control failure. Hold onto that thought, because it connects directly to excessive agency later in this course.')
 ])
]),

ep('e07', 2, 2, '2.4', 'Data Security Controls for AI Systems',[
 sl('Three states of encryption',[
  ch('In transit: data moving between systems','Encryption in transit protects data as it moves between systems, typically using T L S.'),
  ch('At rest: data stored on disk','Encryption at rest protects data while it sits stored on disk.'),
  ch('In use: the state most candidates forget','Encryption in use protects data while it is actively being processed in memory, during inference itself. This is the differentiator most candidates forget, and it is usually implemented through confidential computing, secure enclaves the cloud provider itself cannot see into, or homomorphic encryption, which performs computation directly on encrypted data without ever decrypting it at all.')
 ]),
 sl('The data-safety toolkit',[
  ch('Anonymization irreversibly removes identifying information','Anonymization irreversibly removes identifying information from a dataset, so re-identification is not possible even if it is combined with other public data sources.'),
  ch('Pseudonymization is the reversible cousin of anonymization','Pseudonymization replaces identifying data with a token or key instead of removing it outright. The critical difference from anonymization: whoever holds that key can still re-identify the person. Do not treat these as interchangeable on the exam.'),
  ch('Classification labels tag data by sensitivity','Classification labels tag data as public, internal, confidential, or restricted, so automated controls can apply based on that tag.'),
  ch('Redaction permanently removes sensitive elements','Redaction permanently removes sensitive elements from a document or output.'),
  ch('Masking partially obscures a value for display','Masking partially obscures a value for display, like showing only the last four digits of an account number, while the full value may still exist elsewhere in the system.'),
  ch('Minimization limits collection to what is actually needed','Data minimization means collecting and retaining only the data actually required for the task at hand.'),
  ch('Exam angle: pick the exact right technique for the exposure described','Scenario questions hinge on picking the right technique for a described exposure. Partial display of sensitive data is masking. Irreversibly stripping identity from training data is anonymization. Know the difference cold.')
 ])
]),

ep('e08', 2, 2, '2.5', 'Monitoring and Auditing for AI Systems',[
 sl('Monitoring: ongoing, real-time posture',[
  ch('Prompt monitoring watches both queries and responses','Prompt monitoring logs and reviews both the queries going in and the responses coming out, watching for abuse or drift.'),
  ch('Log sanitization protects the logs themselves','Log sanitization and protection matters because logs can capture sensitive prompt content, so the logs need the same protection as the data they contain.'),
  ch('Response-confidence tracking watches for degrading reliability','Response-confidence tracking watches the model confidence scores over time, to catch reliability degrading before it becomes a real problem.'),
  ch('AI cost monitoring is unique to AI systems','AI cost monitoring tracks spend across prompts, storage, and processing. This one is unique to AI systems, and it matters because a sudden spike in spend can signal abuse or a compromised API key. Remember this one specifically, because it is an easy giveaway on the exam.'),
  ch('Cost attribution is a distinct, related practice','Cost attribution is different from cost monitoring. Monitoring tracks the total spend. Attribution identifies which specific team or user is actually driving that spend, so if one department is responsible for seventy percent of monthly token consumption, attribution is what surfaces that.')
 ]),
 sl('Three rate-control concepts, frequently confused',[

/* ============================== STATE & STORAGE ============================== */
const STORE_KEY='secai-video-progress-v1';
let STATE={ completed:{}, rate:1, voiceURI:null, autoplay:true };
async function loadState(){
  try{ const r=await window.storage.get(STORE_KEY,false); if(r&&r.value) STATE=Object.assign(STATE, JSON.parse(r.value)); }catch(e){}
}
let saveTimer=null;
function saveState(){ clearTimeout(saveTimer); saveTimer=setTimeout(async ()=>{ try{ await window.storage.set(STORE_KEY, JSON.stringify(STATE), false);}catch(e){} },300); }

/* ============================== PLAYER STATE ============================== */
let curEp=0, curSlide=0, curChunk=0;
let isPlaying=false;
let ttsSupported = ('speechSynthesis' in window);
let voices=[];
let fallbackTimer=null;

function flatChunks(episode){
  const out=[];
  episode.slides.forEach((s,si)=>{ s.chunks.forEach((c,ci)=>{ out.push({si,ci,cap:c.cap,say:c.say}); }); });
  return out;
}

/* ============================== RENDER: PLAYLIST ============================== */
function renderPlaylist(){
  const doneCount = EPISODES.filter(e=>STATE.completed[e.id]).length;
  const pct = Math.round((doneCount/EPISODES.length)*100);
  document.getElementById('plPct').textContent = pct+'%';
  document.getElementById('plFill').style.width = pct+'%';

  const note = document.getElementById('supportNote');
  if(!ttsSupported){
    note.innerHTML = '<div class="support-note warn">Your browser has no built-in narrator voice available here, so this plays as a paced, auto-advancing slideshow with captions instead of spoken audio.</div>';
  } else {
    note.innerHTML = '<div class="support-note">Uses your device\u2019s built-in narrator voice. Quality varies by phone/browser \u2014 try a different voice below if it sounds off.</div>';
  }

  const pl=document.getElementById('playlist');
  pl.innerHTML='';
  let lastDay=null;
  EPISODES.forEach((e,i)=>{
    if(e.day!==lastDay){
      lastDay=e.day;
      const h=document.createElement('div'); h.className='dayhead';
      h.textContent = e.day===0? 'Start Here' : 'Day '+e.day;
      pl.appendChild(h);
    }
    const row=document.createElement('div'); row.className='ep'+(i===curEp?' active':'');
    const dotCls = i===curEp && isPlaying ? 'dot playing' : STATE.completed[e.id] ? 'dot done' : 'dot';
    row.innerHTML = '<span class="num mono">'+(i+1)+'</span><span class="'+dotCls+'"></span>'+
      '<div class="meta"><div class="ttl">'+e.title+'</div><div class="sub">'+(e.code!=='CLOSE'&&e.code!=='INTRO'? 'Obj '+e.code : e.code)+'</div></div>';
    row.onclick=()=>loadEpisode(i,true);
    pl.appendChild(row);
  });
}

/* ============================== RENDER: SCREEN ============================== */
function renderScreen(){
  const e = EPISODES[curEp];
  const chunks = flatChunks(e);
  const cur = chunks[curChunk] || chunks[0];
  document.getElementById('epCode').textContent = (e.code==='CLOSE'||e.code==='INTRO') ? e.code : 'OBJECTIVE '+e.code;
  document.getElementById('epTitle').textContent = e.slides[cur.si].heading;

  const bWrap=document.getElementById('bullets');
  bWrap.innerHTML='';
  e.slides[cur.si].chunks.forEach((c,ci)=>{
    const d=document.createElement('div');
    d.className='bullet'+(ci===cur.ci?' active':ci<cur.ci?' past':'');
    d.textContent=c.cap;
    d.onclick=()=>{ jumpToChunk(cur.si, ci); };
    bWrap.appendChild(d);
  });

  document.getElementById('captionText').textContent = cur.say;
  document.getElementById('timecode').textContent = 'Slide '+(cur.si+1)+'/'+e.slides.length+' \u00b7 Line '+(curChunk+1)+'/'+chunks.length;
  document.getElementById('scrubFill').style.width = Math.round(((curChunk+1)/chunks.length)*100)+'%';

  document.getElementById('btnPlay').textContent = isPlaying? '❚❚' : '▶';
  document.getElementById('viz').classList.toggle('paused', !isPlaying);

  document.getElementById('btnPrevEp').disabled = curEp===0;
  document.getElementById('btnNextEp').disabled = curEp===EPISODES.length-1;
}

function jumpToChunk(si, ci){
  const e=EPISODES[curEp];
  const chunks=flatChunks(e);
  const idx = chunks.findIndex(c=>c.si===si && c.ci===ci);
  if(idx<0) return;
  stopSpeaking();
  curChunk=idx;
  renderScreen();
  if(isPlaying) speakCurrent();
}

/* ============================== VOICES ============================== */
function populateVoices(){
  if(!ttsSupported) return;
  voices = window.speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));
  if(!voices.length) voices = window.speechSynthesis.getVoices();
  const sel=document.getElementById('voiceSel');
  sel.innerHTML='';
  voices.forEach(v=>{
    const o=document.createElement('option'); o.value=v.voiceURI; o.textContent=v.name+' ('+v.lang+')';
    if(v.voiceURI===STATE.voiceURI) o.selected=true;
    sel.appendChild(o);
  });
  if(!STATE.voiceURI && voices.length) STATE.voiceURI = voices[0].voiceURI;
}
if(ttsSupported){
  window.speechSynthesis.onvoiceschanged = populateVoices;
}

/* ============================== SPEAKING ENGINE ============================== */
function stopSpeaking(){
  if(ttsSupported) window.speechSynthesis.cancel();
  clearTimeout(fallbackTimer);
}
function speakCurrent(){
  stopSpeaking();
  const e=EPISODES[curEp];
  const chunks=flatChunks(e);
  const cur=chunks[curChunk];
  if(!cur) return;

  if(ttsSupported){
    const u = new SpeechSynthesisUtterance(cur.say);
    u.rate = Number(STATE.rate)||1;
    const v = voices.find(vv=>vv.voiceURI===STATE.voiceURI);
    if(v) u.voice=v;
    u.onend=()=>{ if(isPlaying) advance(); };
    u.onerror=()=>{ if(isPlaying) advance(); };
    window.speechSynthesis.speak(u);
  } else {
    // fallback: pace by estimated reading time (~2.6 words/sec at 1x)
    const words = cur.say.split(/\s+/).length;
    const ms = Math.max(1400, (words/2.6/(Number(STATE.rate)||1))*1000);
    fallbackTimer=setTimeout(()=>{ if(isPlaying) advance(); }, ms);
  }
}
function advance(){
  const e=EPISODES[curEp];
  const chunks=flatChunks(e);
  if(curChunk < chunks.length-1){
    curChunk++;
    renderScreen();
    speakCurrent();
  } else {
    STATE.completed[e.id]=true; saveState();
    if(curEp < EPISODES.length-1 && STATE.autoplay){
      loadEpisode(curEp+1, true);
    } else {
      isPlaying=false;
      renderScreen(); renderPlaylist();
    }
  }
}

/* ============================== TRANSPORT CONTROLS ============================== */
function play(){
  isPlaying=true;
  renderScreen(); renderPlaylist();
  speakCurrent();
}
function pause(){
  isPlaying=false;
  stopSpeaking();
  renderScreen(); renderPlaylist();
}
function loadEpisode(i, autoPlay){
  stopSpeaking();
  curEp=i; curChunk=0;
  isPlaying=!!autoPlay;
  renderScreen(); renderPlaylist();
  if(isPlaying) speakCurrent();
}
function nextSlideBtn(){
  const e=EPISODES[curEp]; const chunks=flatChunks(e);
  const cur=chunks[curChunk];
  const nextSlideIdx=Math.min(e.slides.length-1, cur.si+1);
  const idx=chunks.findIndex(c=>c.si===nextSlideIdx && c.ci===0);
  if(idx>=0){ stopSpeaking(); curChunk=idx; renderScreen(); if(isPlaying) speakCurrent(); }
}
function prevSlideBtn(){
  const e=EPISODES[curEp]; const chunks=flatChunks(e);
  const cur=chunks[curChunk];
  const prevSlideIdx=Math.max(0, cur.si-1);
  const idx=chunks.findIndex(c=>c.si===prevSlideIdx && c.ci===0);
  if(idx>=0){ stopSpeaking(); curChunk=idx; renderScreen(); if(isPlaying) speakCurrent(); }
}

/* ============================== WIRE UP ============================== */
document.getElementById('btnPlay').onclick=()=>{ isPlaying? pause() : play(); };
document.getElementById('btnNextSlide').onclick=nextSlideBtn;
document.getElementById('btnPrevSlide').onclick=prevSlideBtn;
document.getElementById('btnPrevEp').onclick=()=>{ if(curEp>0) loadEpisode(curEp-1,true); };
document.getElementById('btnNextEp').onclick=()=>{ if(curEp<EPISODES.length-1) loadEpisode(curEp+1,true); };
document.getElementById('rateSel').onchange=(e)=>{ STATE.rate=e.target.value; saveState(); if(isPlaying) speakCurrent(); };
document.getElementById('voiceSel').onchange=(e)=>{ STATE.voiceURI=e.target.value; saveState(); if(isPlaying) speakCurrent(); };
document.getElementById('autoplayChk').onchange=(e)=>{ STATE.autoplay=e.target.checked; saveState(); };
document.getElementById('scrub').onclick=(e)=>{
  const rect=e.currentTarget.getBoundingClientRect();
  const pctClick=(e.clientX-rect.left)/rect.width;
  const chunks=flatChunks(EPISODES[curEp]);
  const idx=Math.min(chunks.length-1, Math.max(0, Math.floor(pctClick*chunks.length)));
  stopSpeaking(); curChunk=idx; renderScreen(); if(isPlaying) speakCurrent();
};

(async function init(){
  await loadState();
  document.getElementById('rateSel').value = STATE.rate||1;
  document.getElementById('autoplayChk').checked = STATE.autoplay!==false;
  if(ttsSupported){ populateVoices(); setTimeout(populateVoices,300); }
  renderPlaylist();
  renderScreen();
})();
</script>
</body>

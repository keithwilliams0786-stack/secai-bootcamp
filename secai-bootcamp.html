    {id:'d4b1', time:'08:15–09:45', dur:'1h30m', type:'lecture', obj:'3.1', title:'AI-Enabled Tools for Security Tasks',
      body:`<h4>Tool landscape</h4>
      <ul>
        <li>IDE, browser, and CLI plug-ins that embed AI assistance into existing workflows</li>
        <li>Chatbots and personal assistants for analyst-facing Q&A and triage support</li>
        <li><b>Model Context Protocol (MCP) servers</b> — a current, exam-relevant way AI assistants connect to external tools/data sources in a standardized way (you're literally using one right now)</li>
      </ul>
      <h4>Use cases the exam cares about</h4>
      <ul>
        <li><b>Anomaly detection</b> — flags individual events that deviate from a learned baseline (e.g., a login at 3 a.m. from an unusual location)</li>
        <li><b>Pattern recognition</b> — a distinct, higher-level capability: correlates multiple seemingly benign events across time to surface a coordinated attack that no single event would trigger an alert for</li>
        <li>Vulnerability analysis, automated penetration testing</li>
        <li>Incident management and threat modeling support</li>
        <li>Fraud detection</li>
        <li>Summarization (turning huge logs/alerts into readable analyst summaries)</li>
      </ul>
      <p><b>Exam angle:</b> questions pair a task with the right tool category — "an analyst needs a fast way to summarize a week of SIEM alerts" points to summarization/chatbot tooling, not automated pentesting. Don't confuse anomaly detection (single deviant event) with pattern recognition (correlating many small, individually-normal events into one coordinated picture) — this exact distinction has appeared as a direct compare/contrast question.</p>`,
      terms:['MCP servers','Anomaly detection','Pattern recognition','Automated pentesting','Fraud detection','Summarization'],
      quiz:[
        q("A standardized protocol that lets an AI assistant connect to external tools and data sources is best described as:",
          ["A GAN","Model Context Protocol (MCP)","A prompt firewall","RAG"],1,"MCP standardizes how AI assistants connect to external tools/data — a current, exam-relevant concept.",3),
        q("Over a week, an AI tool notices the same external IP slowly accessing multiple servers with valid credentials, extracting small amounts of data from each — no single event triggers an alert, but the combined activity suggests a stealthy attack. This capability is:",
          ["Anomaly detection","Pattern recognition","Signature matching","Fraud detection"],1,
          "Pattern recognition correlates multiple individually-benign events into one coordinated finding, distinct from anomaly detection's single-event deviation.",3)
      ]},

    {id:'d4b2', time:'09:45–10:00', dur:'15m', type:'admin', obj:null, title:'Break', body:`<p>Short break.</p>`, terms:[], quiz:[]},

    {id:'d4b3', time:'10:00–11:30', dur:'1h30m', type:'lecture', obj:'3.2', title:'How AI Enables or Enhances Attack Vectors',
      body:`<h4>Offense-side concepts (conceptual/"explain" objective — expect recognition, not simulation). This objective got a full dedicated chapter in the official study guide — treat it accordingly, it's not a throwaway.</h4>
      <ul>
        <li><b>Deepfakes</b> — AI-generated synthetic media used for impersonation (voice/video)</li>
        <li><b>Misinformation vs. disinformation</b> — misinformation is <i>unintentionally</i> spreading false content (people sharing something believing it's real); disinformation is a <i>deliberate</i>, organized attempt to manipulate opinion. Same content, different intent — the exam tests whether you catch which one a scenario describes</li>
        <li><b>Adversarial networks (GANs) used offensively</b> — attackers use GAN-produced content to evade AI detectors, poison models, or trick decision systems with adversarial patches</li>
        <li><b>AI-accelerated reconnaissance and social engineering</b> — automating target research and crafting highly personalized phishing/pretexting at scale</li>
        <li><b>Obfuscation and polymorphic malware</b> — AI rewrites malicious code into endless unique variants that evade signature detection. Named real-world examples: <b>WormGPT</b> and <b>FraudGPT</b> (malicious LLMs built for generating phishing emails and malware scripts), and <b>BlackMamba</b> (malware with no malicious code visible in static analysis — it queries an LLM at runtime to generate a fresh keylogger on the fly)</li>
        <li><b>Automated data correlation</b> — attackers using AI to stitch together disparate leaked/public data into actionable intelligence, prioritizing the most exploitable targets</li>
        <li><b>Automated attack generation</b> — AI agents automate an entire intrusion end-to-end: scanning, exploit selection, and execution, letting unskilled attackers run multistep campaigns without writing code</li>
        <li><b>AI-powered honeypot detection and evasion</b> — attackers use ML to analyze service responses and identify honeypots before engaging. The reverse also happens: attackers build convincing fake honeypots of their own to harvest credentials or malware from researchers</li>
        <li><b>AI-powered DDoS</b> — AI-driven botnets analyze live traffic conditions and adapt in real time — shifting ports, packet types, and timing based on feedback, making them far harder to block with static rule sets than a traditional DDoS</li>
      </ul>
      <p><b>Exam angle:</b> a described incident ("the CFO received a video call that looked and sounded exactly like the CEO authorizing a wire transfer") should trigger immediate recognition: deepfake-enabled impersonation. A viral AI-generated image causing panic with no organized campaign behind it is misinformation; the same image pushed deliberately by a coordinated actor is disinformation — read for intent, not just content.</p>`,
      terms:['Deepfakes','Misinformation','Disinformation','WormGPT','FraudGPT','BlackMamba','AI-accelerated recon','Obfuscation','Automated data correlation','Automated attack generation','AI-powered DDoS','Honeypot evasion'],
      quiz:[
        q("A finance employee receives a highly convincing video call appearing to be the CEO, requesting an urgent wire transfer. This attack is most accurately described as:",
          ["Model inversion","Deepfake-enabled impersonation","Data poisoning","Model theft"],1,
          "Synthetic video/voice impersonation used to manipulate a person is deepfake-enabled impersonation.",3),
        q("An AI-generated image of a bridge collapse goes viral and causes panic, but no organized campaign is behind it — people simply believed it was real and shared it. This is:",
          ["Disinformation","Misinformation","Deepfake impersonation","Model inversion"],1,
          "No deliberate coordinated intent = misinformation. The same content pushed intentionally by an organized actor would be disinformation.",3),
        q("Malware is found to contain no malicious instructions under static analysis, but at runtime it queries an LLM to generate a fresh keylogger. This defensive challenge best represents:",
          ["Polymorphic malware","A missing digital signature","Legacy software risk","Unencrypted communication"],0,
          "This is the BlackMamba pattern — AI-generated payloads at runtime evade static signature detection, a form of polymorphic malware.",3),
        q("A botnet dynamically shifts its target ports, packet types, and timing based on real-time traffic feedback during an attack, evading static block lists. This is:",
          ["Automated data correlation","AI-powered DDoS","Model denial of service","Automated attack generation"],1,
          "AI-powered DDoS specifically adapts attack parameters in real time based on live conditions, unlike a traditional static-pattern DDoS.",3)
      ]},

    {id:'d4b4', time:'11:30–12:30', dur:'1h', type:'admin', obj:null, title:'Lunch', body:`<p>Full break.</p>`, terms:[], quiz:[]},

    {id:'d4b5', time:'12:30–14:00', dur:'1h30m', type:'lecture', obj:'3.3', title:'Using AI to Automate Security Tasks',
      body:`<h4>Automation in practice</h4>
      <ul>
        <li><b>Three tiers, not two</b> — <b>no-code</b> platforms use only visual/natural-language interfaces with zero scripting; <b>low-code</b> platforms allow some scripting for flexibility on top of visual tools; full <b>scripting</b> environments give complete programmatic control. AI lowers the barrier at every tier by generating scripts from natural language</li>
        <li>Document synthesis (turning raw findings into polished reports — sound familiar?)</li>
        <li>Incident-ticket management and triage automation</li>
        <li>AI-assisted change management — assessing proposed changes, auto-approving routine updates, recommending rollbacks, monitoring for unexpected behavior during deployment</li>
        <li>AI agents performing multi-step security work autonomously — the key differentiator from a plain automation script: an agent can plan, adapt, and act independently within its guardrails, not just follow a fixed predetermined sequence</li>
        <li><b>AI in CI/CD pipelines</b> — intelligent code scanning, software composition analysis (SCA), dependency analysis, unit/regression test generation, and model testing gates before deployment</li>
        <li><b>Static vs. dynamic code analysis</b> — static analysis examines code without running it (spotting insecure patterns, hardcoded secrets); dynamic analysis observes the application's actual live behavior. Both show up in AI-assisted CI/CD pipelines</li>
        <li><b>Automated rollback</b> — a distinct CI/CD capability: AI monitors live performance metrics after deployment and automatically reverts to the prior version if error rates or response times spike, alerting the team</li>
      </ul>
      <p><b>Exam angle:</b> if you've never watched an AI agent triage a ticket queue or gate a CI/CD pipeline on a failed model test, this is the section to review with extra care. Watch for the "no-code has zero scripting, low-code allows some" distinction specifically — it's a clean either/or the exam likes to test.</p>`,
      terms:['No-code','Low-code','Scripting','Document synthesis','AI-assisted change management','AI agents','CI/CD code scanning','SCA','Static analysis','Dynamic analysis','Automated rollback'],
      quiz:[
        q("A CI/CD pipeline automatically blocks a deployment when a new model version fails an automated bias/accuracy test gate. This is an example of:",
          ["Excessive agency","AI in CI/CD (model testing gate)","Model denial of service","Data poisoning"],1,
          "Automated model-testing gates inside CI/CD pipelines are a core AI-assisted security automation use case.",3),
        q("Which correctly distinguishes no-code from low-code automation platforms?",
          ["No-code platforms are inherently AI-driven, low-code is not","Low-code platforms allow some scripting for flexibility; no-code platforms use only visual/natural-language interfaces with no scripting at all","No-code always performs faster than low-code","Low-code cannot integrate AI assistants"],1,
          "No-code = zero scripting, visual/NL only. Low-code = visual tools plus some scripting flexibility.",3),
        q("Shortly after a new deployment, an AI system detects a sharp rise in error rates and response times, automatically reverts to the prior version, and alerts DevOps and security. This capability is:",
          ["Static code analysis","Automated rollback","Unit testing","Dynamic code analysis"],1,
          "Automated rollback is the CI/CD capability of monitoring live post-deploy metrics and automatically reverting on failure.",3),
        q("What differentiates an AI agent from a traditional automation script in a security context?",
          ["Agents always require human approval before any action","Scripts use machine learning; agents do not","An agent can plan, adapt, and act independently within its scope rather than following a fixed sequence","Agents cannot be used in CI/CD pipelines"],2,
          "The defining trait of an agent vs. a script is autonomous planning/adaptation within guardrails, not just fixed rule-following.",3)
      ]},

    {id:'d4b6', time:'14:00–14:15', dur:'15m', type:'admin', obj:null, title:'Break', body:`<p>Short break.</p>`, terms:[], quiz:[]},

    {id:'d4b7', time:'14:15–15:15', dur:'1h', type:'lecture', obj:'4.1', title:'Governance Structures That Support AI',
      body:`<h4>Three governance structures (not just one — this was previously under-covered)</h4>
      <ul>
        <li><b>Centralized Center of Excellence (CoE)</b> — one team sets standards, manages the platform, and supports project teams directly</li>
        <li><b>Hub-and-spoke</b> — as programs mature, many shift here: the CoE (hub) provides shared resources/oversight while business units (spokes) drive their own execution</li>
        <li><b>Embedded</b> — AI roles live fully inside product teams with only a light central coordination layer. Trade-off: faster delivery, but higher risk of duplicate effort and inconsistent controls across teams</li>
        <li><b>AI policies and procedures</b> — the formal documented rules governing acceptable AI use, development, and deployment</li>
      </ul>
      <h4>Roles (know who does what — match-the-responsibility questions)</h4>
      <ul>
        <li><b>Data scientist</b> — builds/analyzes models and data pipelines</li>
        <li><b>Data engineer</b> — a distinct role from data scientist: builds/maintains the data pipelines themselves, owns data quality and data lineage for training datasets</li>
        <li><b>AI architect</b> — designs the end-to-end AI system architecture, including model type choices and integration approach</li>
        <li><b>ML engineer</b> — builds/productionizes ML models and pipelines</li>
        <li><b>MLOps engineer</b> — owns the operational deployment/monitoring pipeline for models (the ML equivalent of DevOps)</li>
        <li><b>AI security architect</b> — designs security controls specific to AI systems</li>
        <li><b>AI governance engineer</b> — implements governance tooling/processes</li>
        <li><b>AI risk analyst</b> — assesses/quantifies AI-related risk, conducts privacy impact assessments before project approval</li>
        <li><b>AI auditor</b> — independently reviews AI systems for compliance/quality</li>
      </ul>
      <p><b>Exam angle:</b> "who is responsible for X" questions are common — e.g., ongoing model monitoring/deployment pipeline health = MLOps engineer; independent compliance review = AI auditor; data pipeline quality and lineage specifically (not model-building) = data engineer, not data scientist. On structure questions, "fully decentralized with minimal central coordination" is describing the embedded model and its main risk is duplicate/inconsistent controls, not slow delivery.</p>`,
      terms:['AI Center of Excellence','Hub-and-spoke','Embedded model','Data engineer','MLOps engineer','AI security architect','AI governance engineer','AI risk analyst','AI auditor'],
      quiz:[
        q("Which role is most directly responsible for the operational health of a model's deployment and monitoring pipeline?",
          ["AI auditor","MLOps engineer","AI risk analyst","Data scientist"],1,
          "MLOps engineers own operational deployment/monitoring — the ML equivalent of DevOps.",4),
        q("An organization embeds AI developers directly within each product team with minimal central coordination. Which risk does this structure carry?",
          ["Excessive oversight slowing every project","Duplicate efforts and inconsistent controls across teams","Overreliance on a single Center of Excellence","Reduced ability to move quickly"],1,
          "The embedded model trades central consistency for speed — its main risk is duplicated effort and inconsistent controls, not slowness.",4),
        q("A team member builds and maintains data pipelines, ensures data quality, and manages data lineage for AI training datasets. This role is:",
          ["Data scientist","Data engineer","MLOps engineer","AI architect"],1,
          "Data engineer is distinct from data scientist — pipeline/quality/lineage ownership is the data engineer's job specifically.",4)
      ]},

    {id:'d5b1', time:'08:15–09:15', dur:'1h', type:'lecture', obj:'4.2', title:'Risks Associated with AI',
      body:`<h4>Responsible-AI principles (the "why" behind every risk below)</h4>
      <ul>
        <li>Fairness, reliability &amp; safety, transparency, privacy, explainability, inclusiveness, accountability, and <b>consistency</b> — eight principles total (consistency is the one most study materials leave off the list, and it means the model behaves predictably given similar inputs, not just accurately)</li>
      </ul>
      <h4>Practical risk list</h4>
      <ul>
        <li><b>Bias introduction</b> — model outputs systematically disadvantage a group</li>
        <li><b>Accidental data leakage</b> — sensitive data unintentionally surfaced in output</li>
        <li><b>Reputational damage</b> — public-facing AI failures damaging brand trust</li>
        <li><b>Model accuracy drift</b> — performance degrading over time as real-world data shifts from training data</li>
        <li><b>IP risk</b> — training on or generating content that infringes intellectual property</li>
        <li><b>Autonomous-system risk</b> — risk introduced specifically by systems acting without direct human control</li>
        <li><b>Shadow AI</b> — unsanctioned AI tool use inside the business, the modern version of shadow IT, and an easy scenario for exam writers (an employee pastes confidential data into a public chatbot the company never approved)</li>
      </ul>
      <p><b>Exam angle:</b> memorize "shadow AI" by name — it's a near-guaranteed appearance and easy to mix up with sanctioned/unsanctioned tooling from 4.3 below.</p>`,
      terms:['Bias introduction','Model accuracy drift','IP risk','Autonomous-system risk','Shadow AI'],
      quiz:[
        q("An employee pastes confidential contract terms into a free public AI chatbot that was never approved by IT. This is best described as:",
          ["Model accuracy drift","Shadow AI","Membership inference","Data poisoning"],1,
          "Unsanctioned AI tool use inside the business is shadow AI — the modern equivalent of shadow IT.",4)
      ]},

    {id:'d5b2', time:'09:15–10:15', dur:'1h', type:'lecture', obj:'4.3', title:'Compliance Impact on AI Use & Development',
      body:`<h4>Regulatory map (know which applies where, not the statute text)</h4>
      <ul>
        <li><b>EU AI Act</b> — the only <i>legally binding</i> regulation on this list; risk-tiered for AI systems touching the EU market. Four tiers, worth knowing by name: <b>unacceptable risk</b> (prohibited outright — e.g., social scoring systems), <b>high risk</b> (heavy obligations: documentation, transparency, human oversight, impact assessments), <b>limited risk</b> (lighter obligations — e.g., a general chatbot must disclose it's AI and offer a path to a human), <b>minimal risk</b> (no special obligations)</li>
        <li><b>NIST AI Risk Management Framework (AI RMF)</b> — U.S. voluntary (not legally binding) framework for managing AI risk (govern/map/measure/manage functions)</li>

 a:["Raw unencrypted PII","Embeddings for similarity search","Firewall rules","Quantized model weights"],c:1,
 w:["A vector store holds numeric embeddings, and storing raw unencrypted PII would be a control failure.","Correct: text chunks are stored as embeddings so similar content can be retrieved.","Firewall rules live in network/security appliances.","Model weights live with the model, not the retrieval store."],
 x:"RAG keeps the foundation model unchanged and retrieves relevant chunks from a vector store of embeddings at query time."}),
Q({id:'e004',d:1,o:'1.3',t:['lifecycle','data-integrity'],q:"Which life cycle stage is where data lineage and provenance tracking should begin?",
 a:["Deployment","Data collection","Ongoing monitoring","Business case"],c:1,
 w:["By deployment, untracked data has already shaped the model.","Correct: provenance (origin, license, consent) and lineage (transformations) start when data is sourced.","Monitoring is too late to establish where training data came from.","The business case defines goals; no data has been collected yet."],
 x:"Provenance and lineage must be captured as data is collected and prepared, or they can't be reconstructed later."}),
Q({id:'e005',d:1,o:'1.3',t:['testing-oversight'],q:"An organization automatically freezes flagged accounts with zero human review. This is a gap in:",
 a:["Watermarking","Human oversight/validation","Data lineage","Quantization"],c:1,
 w:["Watermarking proves content origin; it doesn't govern automated actions.","Correct: high-impact automated actions should require human approval.","Lineage tracks data transformations, not decision approval.","Quantization is a model-efficiency technique."],
 x:"High-consequence actions (freezing accounts) belong in a human-approve response level, not auto-remediate."}),
Q({id:'e006',d:1,o:'1.1',t:['ai-concepts'],q:"Which pair correctly differentiates LLMs from SLMs?",
 a:["LLMs are narrower and cheaper; SLMs are broad and resource-heavy","LLMs are broad/general-purpose; SLMs are narrower and cheaper","Both are identical in scope and cost","SLMs cannot be fine-tuned"],c:1,
 w:["This reverses the two.","Correct: LLMs have huge parameter counts and need heavy GPUs; SLMs are lighter and cheaper.","Their scope and hardware needs differ substantially.","SLMs are frequently fine-tuned or adapter-tuned for a domain."],
 x:"LLMs: tens to hundreds of billions of parameters, broad reasoning. SLMs: millions to low billions, low latency, can run on modest hardware."}),
Q({id:'e007',d:1,o:'1.1',t:['ai-concepts'],q:"Reducing a model's numerical weight precision to shrink size and speed inference is:",
 a:["Pruning","Quantization","Fine-tuning","Masking"],c:1,
 w:["Pruning removes low-impact weights entirely; it doesn't change precision.","Correct: e.g., converting 32-bit floats to 8-bit integers.","Fine-tuning trains a model further on a narrower dataset.","Masking hides sensitive data values; it's a privacy control."],
 x:"Quantization lowers numeric precision of weights/activations; pruning removes weights."}),
Q({id:'e008',d:1,o:'1.1',t:['ml-techniques'],q:"A model performs excellently on training data but fails to generalize to new, unseen examples. This is:",
 a:["Underfitting","Overfitting","Concept drift","Data imbalance"],c:1,
 w:["Underfitting performs poorly even on training data.","Correct: the model memorized training data instead of learning general patterns.","Concept drift is degradation over time as real-world data changes.","Imbalance hurts minority-class accuracy; it's not the core definition here."],
 x:"Overfitting = great on training data, poor on unseen data. Validation and test sets exist to catch it."}),
Q({id:'e009',d:1,o:'1.1',t:['drift-maint'],q:"A phishing-URL classifier trained a year ago is now missing many current phishing patterns, though nothing about the model itself changed. This is:",
 a:["Overfitting","Underfitting","Concept drift","Data poisoning"],c:2,
 w:["Overfitting is a training-time generalization problem.","Underfitting would have shown poor performance from the start.","Correct: the real-world data shifted away from what the model learned.","Poisoning requires tampering with training data; nothing indicates that here."],
 x:"Concept drift is accuracy decaying as the world changes. The fix is monitoring against baselines and retraining."}),
Q({id:'e010',d:1,o:'1.1',t:['ml-techniques'],q:"A team wants to reduce hundreds of network-traffic features down to a manageable number while preserving key patterns for visualization. Which technique fits?",
 a:["k-means clustering","Principal component analysis (PCA)","Data minimization","Quantization"],c:1,
 w:["k-means groups records; it doesn't reduce the number of features.","Correct: PCA reduces dimensionality while keeping most of the variance.","Data minimization limits what data is collected for privacy.","Quantization lowers model weight precision."],
 x:"PCA is the standard dimensionality-reduction technique for high-dimensional data like traffic features."}),
Q({id:'e011',d:1,o:'1.2',t:['data-integrity'],q:"JSON documents, email headers, and log files, which have some structure but need custom validation, are best classified as:",
 a:["Structured data","Semi-structured data","Unstructured data","Augmented data"],c:1,
 w:["Structured data is tabular/fixed-format, like NetFlow records or IOC lists.","Correct: key-value or partially structured formats sit in between.","Unstructured data is packet payloads, chat transcripts, images.","Augmented data is synthetic training examples, not a structure category."],
 x:"Semi-structured formats (JSON, YAML, email headers) can hide secrets like tokens in fields, so they need scanning before use."}),
Q({id:'e012',d:1,o:'1.1',t:['ai-concepts'],q:"A SOC analyst needs to automate a complex workflow by breaking it into smaller sub-tasks the system plans and executes on its own. Which AI approach fits best?",
 a:["Agentic AI","Retrieval-augmented generation (RAG)","Generative AI","Chatbot"],c:0,
 w:["Correct: agents perceive, reason, decide, and act across multi-step tasks.","RAG retrieves documents for context; it doesn't plan and execute tasks.","Generative AI creates content; autonomy isn't implied.","A chatbot is a conversational interface."],
 x:"Agentic AI plans and executes multi-step work autonomously, which is also why it needs tight agent access controls."}),
Q({id:'e013',d:1,o:'1.1',t:['ml-techniques'],q:"One full pass of the entire training dataset through a model during training is called:",
 a:["A token","An epoch","A temperature setting","A checkpoint"],c:1,
 w:["A token is a unit of text a model processes.","Correct: too few epochs underfit, too many overfit.","Temperature controls output randomness at inference.","A checkpoint is a saved model state."],
 x:"Choosing the number of epochs during fine-tuning balances underfitting against overfitting."}),
Q({id:'e014',d:1,o:'1.2',t:['data-integrity'],q:"An intrusion-detection training set is 99% benign flows, and the model scores high accuracy by labeling everything 'safe.' Which technique most directly fixes this?",
 a:["Data lineage","Data balancing","Data provenance","Data verification"],c:1,
 w:["Lineage records transformations; it doesn't change class proportions.","Correct: rebalancing (e.g., down-sampling the majority class) gives rare attacks proportionate weight.","Provenance documents origin and licensing.","Verification (hashing) confirms the data wasn't altered."],
 x:"Corrected Oct 2026: the earlier version credited data augmentation. Balancing is the named technique for skewed class distributions; augmentation creates varied examples to improve generalization."}),
// ---------------- Domain 2 ----------------
Q({id:'e015',d:2,o:'2.1',t:['threat-modeling'],q:"A framework cataloging real-world adversary tactics and techniques against AI systems, structured like MITRE ATT&CK, is:",
 a:["OWASP LLM Top 10","MITRE ATLAS","MIT AI Risk Repository","CVE AI Workgroup"],c:1,
 w:["OWASP LLM Top 10 ranks vulnerability categories; it isn't a tactics/techniques matrix.","Correct: ATLAS maps adversary tactics and techniques across the ML life cycle.","The MIT repository is a risk database with causal and domain taxonomies.","The CVE AI Workgroup assigns IDs to AI vulnerabilities."],
 x:"ATLAS is the adversarial-AI counterpart to ATT&CK."}),
Q({id:'e016',d:2,o:'2.1',t:['threat-modeling'],q:"A specific, trackable vulnerability in an open-source ML library should be assigned an identifier through:",
 a:["OWASP ML Top 10","The CVE AI Workgroup","OECD AI Principles","NIST AI RMF"],c:1,
 w:["The ML Top 10 is a category list, not a vulnerability ID system.","Correct: the CVE program's AI Workgroup sets criteria for AI vulnerabilities and assigns CVE IDs.","OECD principles are values-based guidance.","NIST AI RMF is a risk-management framework."],
 x:"The CVE AI Workgroup brings AI-specific vulnerabilities into the CVE database with clear taxonomies."}),
Q({id:'e017',d:2,o:'2.2',t:['gateway-quotas'],q:"Which control restricts which input/output modalities (text, image, audio) a system accepts?",
 a:["Rate limits","Modality limits","Token limits","Endpoint access control"],c:1,
 w:["Rate limits cap requests per time window.","Correct: modality limits allow or block input/output types per user, app, or region.","Token limits cap prompt/response size.","Endpoint access control governs who can reach which model endpoint."],
 x:"Modality limits at the gateway can switch off a risky input type everywhere at once without code changes."}),
Q({id:'e018',d:2,o:'2.2',t:['guardrails'],q:"Which control sits at the gateway layer, centrally inspecting prompts and responses for every application before they reach the model?",
 a:["Application-level guardrails","Prompt firewall","Model evaluation","Data classification"],c:1,
 w:["Guardrails in each app work, but must be configured app by app.","Correct: a prompt firewall at the gateway is one enforcement point for all apps.","Model evaluation is a testing activity.","Classification labels data sensitivity."],
 x:"Moving guardrail logic into a prompt firewall at the gateway centralizes policy and adds observability."}),
Q({id:'e019',d:2,o:'2.3',t:['access-control','llm-attacks'],q:"An autonomous agent sends unauthorized external emails on its own. The control gap is:",
 a:["Data access","Agent access","Network access","Model access"],c:1,
 w:["Data access governs which data a subject can read.","Correct: agents need explicit tool allow lists and human approval for high-impact actions.","Network access governs connectivity, not what actions an agent may take.","Model access governs use or modification of the model itself."],
 x:"Agents and their tools are privileged execution surfaces: allow-list tools, scope permissions, require approvals."}),
Q({id:'e020',d:2,o:'2.3',t:['access-control'],q:"A finance RAG assistant must only retrieve documents the requester is already authorized to view. This requires:",
 a:["Token limits","Data access controls mirroring source-system entitlements","Modality limits","Watermarking"],c:1,
 w:["Token limits cap size, not authorization.","Correct: retrieval must enforce the same permissions as the source system.","Modality limits restrict input types.","Watermarking marks content origin."],
 x:"If retrieval ignores source entitlements, the assistant becomes a path around existing access controls."}),
Q({id:'e021',d:2,o:'2.4',t:['privacy-tech'],q:"Protecting data while it is actively processed in memory during inference is:",
 a:["Encryption at rest","Encryption in transit","Encryption in use","Data minimization"],c:2,
 w:["At rest covers stored data.","In transit covers data moving over a network (TLS).","Correct: e.g., trusted execution environments or homomorphic encryption.","Minimization limits what is collected."],
 x:"Data in use is the hardest state to protect; TEEs/secure enclaves and homomorphic encryption address it."}),
Q({id:'e022',d:2,o:'2.4',t:['privacy-tech'],q:"Showing only the last four digits of an SSN to a support agent is an example of:",
 a:["Anonymization","Masking","Redaction","Minimization"],c:1,
 w:["Anonymization removes identifying details from the dataset itself.","Correct: masking substitutes or hides part of the value for display/use.","Redaction removes unnecessary data after collection.","Minimization limits what's collected in the first place."],
 x:"Masking replaces or obscures real values; dynamic masking does it at access time."}),
Q({id:'e023',d:2,o:'2.4',t:['privacy-tech'],q:"Irreversibly removing identifying information from a dataset is:",
 a:["Masking","Anonymization","Redaction","Classification"],c:1,
 w:["Masking may be reversible or display-only.","Correct: anonymization is intended to be irreversible.","Redaction removes elements from a specific output/document.","Classification labels sensitivity."],
 x:"Anonymized data shouldn't be re-identifiable, though combining datasets can still create re-identification risk."}),
Q({id:'e024',d:2,o:'2.5',t:['monitoring'],q:"A sudden unexplained spike in LLM API spend should first trigger review of:",
 a:["Bias and fairness auditing","AI cost monitoring","Watermarking","Data lineage"],c:1,
 w:["Fairness audits don't explain spend.","Correct: cost and token-use monitoring can reveal abuse or a leaked key.","Watermarking proves origin.","Lineage tracks data transformations."],
 x:"Token use per user is a monitored field; excessive use may indicate abuse or denial-of-wallet."}),
Q({id:'e025',d:2,o:'2.5',t:['monitoring'],q:"Confidently stated but false model outputs are tracked under:",
 a:["Rate monitoring","Hallucinations","Log sanitization","Data minimization"],c:1,
 w:["Rate monitoring tracks request volume.","Correct: hallucinations are plausible but factually wrong outputs.","Log sanitization removes sensitive data from logs.","Minimization limits data collection."],
 x:"Grounding checks, RAG with citations, and cross-model validation reduce hallucinations."}),
Q({id:'e026',d:2,o:'2.6',t:['llm-attacks'],q:"Malicious instructions smuggled into input to override intended model behavior is:",
 a:["Jailbreaking","Prompt injection","Model poisoning","Model inversion"],c:1,
 w:["Jailbreaking specifically targets safety restrictions; injection is the broader override.","Correct: OWASP LLM01.","Model poisoning tampers with training/weights.","Inversion reconstructs training data."],
 x:"Prompt injection overrides system instructions via user input or ingested content."}),
Q({id:'e027',d:2,o:'2.6',t:['llm-attacks'],q:"Bypassing a model's built-in safety restrictions through crafted, often chained, prompts is:",
 a:["Prompt injection","Jailbreaking","Data poisoning","Excessive agency"],c:1,
 w:["Injection overrides instructions generally.","Correct: jailbreaks force unsafe content past safety limits.","Data poisoning targets training data.","Excessive agency is over-permissioned tools/actions."],
 x:"Jailbreaking-prevention guardrails analyze chained prompt patterns used to trick the model."}),
Q({id:'e028',d:2,o:'2.6',t:['model-attacks'],q:"Corrupting training data so a model learns incorrect associations is:",
 a:["Model poisoning","Data poisoning","Model inversion","Model theft"],c:1,
 w:["Model poisoning tampers with parameters/weights.","Correct: the attack targets the training data itself.","Inversion extracts data.","Theft copies the model."],
 x:"Defenses: provenance and lineage validation, hash verification, similarity/drift checks on incoming data."}),
Q({id:'e029',d:2,o:'2.6',t:['model-attacks'],q:"Directly tampering with a model's weights or parameters (not its training data) is:",
 a:["Data poisoning","Model poisoning","Membership inference","Model DoS"],c:1,
 w:["Data poisoning targets the dataset.","Correct: OWASP ML10.","Membership inference tests whether a record was in training data.","Model DoS targets availability."],
 x:"Model poisoning alters parameters, often without hurting normal performance, so it's hard to notice."}),
Q({id:'e030',d:2,o:'2.6',t:['model-attacks'],q:"Reconstructing sensitive training data by probing a model's outputs is:",
 a:["Model theft","Model inversion","Excessive agency","Insecure output handling"],c:1,
 w:["Theft replicates the model's capabilities.","Correct: OWASP ML03.","Excessive agency is about permissions.","Output handling is about downstream execution."],
 x:"Mitigations: limit sensitive training data, differential privacy, generalized outputs, query monitoring."}),
Q({id:'e031',d:2,o:'2.6',t:['model-attacks'],q:"Determining whether a specific record was part of a model's training set is:",
 a:["Model theft","Membership inference","Data poisoning","Model inversion"],c:1,
 w:["Theft copies capability.","Correct: OWASP ML04.","Poisoning corrupts training.","Inversion reconstructs content rather than testing membership."],
 x:"Membership inference is enabled by overfitting, overly precise confidence scores, and unmonitored query access."}),
Q({id:'e032',d:2,o:'2.6',t:['model-attacks'],q:"Compromising a model, dataset, or dependency before it reaches your organization is:",
 a:["Model DoS","AI supply-chain attack","Excessive agency","Jailbreaking"],c:1,
 w:["DoS targets availability.","Correct: OWASP LLM03 / ML06.","Excessive agency is over-permissioning.","Jailbreaking bypasses safety at runtime."],
 x:"Validate pre-trained models and datasets the same way you validate software packages and containers."}),
Q({id:'e033',d:2,o:'2.6',t:['llm-attacks','gateway-quotas'],q:"Overwhelming a model with expensive queries to exhaust compute, cost, or availability is:",
 a:["Model theft","Model denial of service","Insecure output handling","Prompt injection"],c:1,
 w:["Theft aims to copy the model.","Correct: OWASP LLM10 (unbounded consumption).","Output handling is downstream execution risk.","Injection overrides instructions."],
 x:"Rate limits, token and tool budgets, timeouts, and maximum chain depth limit model DoS."}),
Q({id:'e034',d:2,o:'2.6',t:['llm-attacks'],q:"An app executes an LLM's generated code output directly without review, enabling an attacker's malicious command to run. This is:",
 a:["Membership inference","Insecure (improper) output handling","Model inversion","Data poisoning"],c:1,
 w:["Membership inference is a privacy attack.","Correct: OWASP LLM05; outputs must be treated as untrusted input.","Inversion extracts training data.","Poisoning targets training data."],
 x:"Use structured outputs, schema validation, allow-listed actions, and out-of-band approval for high-risk operations."}),
Q({id:'e035',d:2,o:'2.6',t:['model-attacks','drift-maint'],q:"Users intentionally give a recommendation system deceptive feedback over time, gradually biasing it toward their preferred outputs without triggering alarms. This is:",
 a:["Data poisoning","Model skewing","Prompt injection","Model theft"],c:1,
 w:["Classic data poisoning tampers with a training set directly.","Correct: OWASP ML08; biased feedback shifts behavior gradually.","Injection is an inference-time override.","Theft copies the model."],
 x:"Model skewing also appears as training/production distribution divergence; overall accuracy can stay high while targeted cases fail."}),
Q({id:'e036',d:2,o:'2.6',t:['testing-oversight'],q:"A clinician acts on an AI triage recommendation without independently verifying it, and the recommendation turns out to be wrong. This risk is:",
 a:["Excessive agency","Overreliance","Model inversion","Model skewing"],c:1,
 w:["Excessive agency is about what the model/agent can do.","Correct: humans over-trusting convincing output.","Inversion is data extraction.","Skewing is biased drift."],
 x:"Mitigate with training, UI that shows uncertainty/evidence, and mandatory second checks for high-impact actions."}),
Q({id:'e037',d:2,o:'2.6',t:['model-attacks'],q:"A stop sign is altered with stickers so a computer-vision model classifies it as a yield sign at inference time. This is:",
 a:["Model poisoning","Input manipulation (evasion)","Model inversion","Excessive agency"],c:1,
 w:["Poisoning happens during training.","Correct: OWASP ML01; crafted inputs cause misclassification.","Inversion extracts data.","Excessive agency is permissions."],
 x:"If the sticker effect was planted during training as a trigger, it would instead be a backdoor."}),
Q({id:'e038',d:2,o:'2.6',t:['model-attacks'],q:"An attacker infers a model's proprietary decision logic purely from detailed confidence scores returned with every prediction. This is:",
 a:["Model theft via direct file exfiltration","Indirect model theft (extraction)","Membership inference","Model inversion"],c:1,
 w:["No files were taken here.","Correct: behavior is cloned from exposed outputs/metadata.","Membership inference tests record inclusion.","Inversion reconstructs training data."],
 x:"Suppress precise confidence scores, rate-limit, and monitor for systematically varied queries."}),
Q({id:'e039',d:2,o:'2.4',t:['privacy-tech'],q:"A privacy team prepares a public dataset ensuring individuals cannot be re-identified even if combined with other public sources. This is:",
 a:["Pseudonymization","Data masking","Anonymization","Data redaction"],c:2,
 w:["Pseudonymization is reversible with a key.","Masking may be reversible or display-only.","Correct: the goal is irreversible de-linking from individuals.","Redaction removes specific unneeded elements."],
 x:"Anonymization aims to be irreversible; pseudonymization keeps a re-identification path."}),
Q({id:'e040',d:2,o:'2.4',t:['privacy-tech'],q:"A bank wants financial data to remain protected even while being processed in memory, so the cloud provider itself cannot access it. Which approach fits?",
 a:["Encryption at rest","Data masking","Confidential computing (secure enclaves / TEE)","Encryption in transit"],c:2,
 w:["At rest doesn't cover processing.","Masking alters data for non-production use.","Correct: hardware isolation protects data in use.","In transit covers network movement."],
 x:"TEEs/secure enclaves isolate data during processing; homomorphic encryption is the other data-in-use option."}),
Q({id:'e041',d:2,o:'2.2',t:['testing-oversight','guardrails'],q:"A compliance team wants a proactive test to reveal whether guardrails fail to block verbatim leakage of proprietary training phrases. Which approach fits?",
 a:["Plant unique canary strings and probe for them post-deployment","Apply k-anonymity to prompts at ingestion","Encrypt the model checkpoint at rest","Add unit tests for SDK request builders"],c:0,
 w:["Correct: if the canary appears in output, the leakage control failed.","k-anonymity is a dataset privacy technique.","Encryption at rest doesn't test output leakage.","SDK unit tests don't test model leakage."],
 x:"Canary records and prompts give known, detectable markers for leakage and poisoning checks."}),
Q({id:'e042',d:2,o:'2.2',t:['testing-oversight','guardrails'],q:"During testing, staff repeatedly send crafted prompts specifically to see if they can bypass a model's guardrails, then check the logs. This practice is:",
 a:["Rate limiting","Guardrail bypass (jailbreak) testing","Model evaluation for bias","Segregation of duties"],c:1,
 w:["Rate limiting is a control, not a test.","Correct: deliberately probing guardrails before attackers do.","Bias evaluation tests fairness.","Segregation of duties is an approval principle."],
 x:"Keep threat databases updated with current exploit prompts so guardrail testing stays realistic."}),
Q({id:'e043',d:2,o:'2.2',t:['gateway-quotas'],q:"An AI API receives a demand surge and, instead of rejecting requests outright, slows and queues them to preserve availability. This is:",
 a:["Hard rate limiting","Throttling","Rate monitoring","Log sanitization"],c:1,
 w:["A hard limit rejects requests over the threshold.","Correct: throttling slows or queues rather than rejecting.","Monitoring observes; it doesn't act.","Sanitization cleans logs."],
 x:"Rate limits define the threshold; requests over it are rejected or queued until the window resets."}),
Q({id:'e044',d:2,o:'2.5',t:['monitoring','governance'],q:"Auditors find that a single administrator both generated AI outputs and approved them for release without any oversight. Which principle was violated?",
 a:["Segregation of duties","Data minimization","Rate limiting","Equal opportunity fairness"],c:0,
 w:["Correct: creation and approval should not rest with one unsupervised person.","Minimization is about data collection.","Rate limiting caps request volume.","Equal opportunity is a fairness metric."],
 x:"Separation of duties also protects log integrity during audits."}),
Q({id:'e045',d:2,o:'2.5',t:['monitoring'],q:"Auditors find one internal team responsible for 70% of monthly AI token consumption. Which practice identifies who is driving spend?",
 a:["Rate monitoring","Cost attribution (breakdown by project/user)","Total cost monitoring only","Accuracy auditing"],c:1,
 w:["Rate monitoring tracks request volume over time.","Correct: break costs down by project, team, or customer.","Total spend alone won't show who caused it.","Accuracy auditing checks correctness."],
 x:"Fine-grained cost breakdowns keep AI operations within budget."}),
Q({id:'e046',d:2,o:'2.5',t:['monitoring'],q:"A model gives individually accurate answers but contradicts an earlier response to a very similar question. Which audit category catches this?",
 a:["Completeness auditing","Consistency auditing","Hallucination auditing","Accuracy auditing"],c:1,
 w:["Completeness checks for missing information.","Correct: stable outputs across similar inputs.","Hallucination checks for false content.","Accuracy checks each answer's correctness."],
 x:"Golden datasets and counterfactual tests help measure consistency after updates."}),
Q({id:'e047',d:2,o:'2.5',t:['risk','testing-oversight'],q:"A loan-approval model consistently rejects applications from one demographic group despite identical financial qualifications. This most specifically reflects:",
 a:["Data bias","Algorithmic bias","Representation bias","Outcome bias"],c:1,
 w:["Data bias is skew in the training data itself.","Correct: the model's decisions produce disparate outcomes for equal inputs.","Representation bias is under-representation in data.","Outcome bias is a decision-review fallacy."],
 x:"Counterfactual testing (swap only the group attribute) exposes this."}),
Q({id:'e048',d:2,o:'2.1',t:['threat-modeling'],q:"An analyst needs a threat resource that classifies AI risks by whether they were caused intentionally or unintentionally, and whether they arose before or after deployment. Which fits best?",
 a:["MIT AI Risk Repository (causal taxonomy)","STRIDE","OWASP LLM Top 10","MAESTRO"],c:0,
 w:["Correct: the causal taxonomy covers entity (AI/human/other), intent, and timing.","STRIDE categorizes attacker threat types; it doesn't classify intent or timing.","OWASP LLM Top 10 ranks LLM vulnerability categories.","MAESTRO threat-models multi-agent systems."],
 x:"Corrected Oct 2026: the earlier version credited STRIDE. The MIT repository's causal taxonomy is what separates intentional from unintentional risk."}),
Q({id:'e049',d:2,o:'2.1',t:['threat-modeling'],q:"An architect needs to threat-model a system where multiple AI agents cooperate on tasks. Which framework was purpose-built for this?",
 a:["STRIDE","OWASP Top 10 (web)","MAESTRO","CVE AI Workgroup"],c:2,
 w:["STRIDE is a general threat categorization.","The web Top 10 targets web apps.","Correct: CSA's MAESTRO targets agentic/multi-agent AI.","The CVE AI Workgroup tracks vulnerabilities."],
 x:"MAESTRO addresses the layered complexity of agentic AI environments."}),
Q({id:'e050',d:2,o:'2.2',t:['gateway-quotas'],q:"In a layered AI architecture, where do connection rate limits and authentication token validation belong?",
 a:["Cloud control plane","API gateway","Prompt firewall","Model layer"],c:1,
 w:["The control plane governs cloud resource management.","Correct: the gateway is the entry point that authenticates and rate-limits.","The prompt firewall inspects content.","The model should never be directly exposed."],
 x:"Cloud control plane → API gateway → WAF → prompt firewall → model."}),
Q({id:'e051',d:2,o:'2.2',t:['guardrails'],q:"Where do injection policies (blocking prompt-injection attempts) belong in a layered AI architecture?",
 a:["WAF","Prompt firewall","Cloud control plane","API gateway authentication"],c:1,
 w:["A WAF handles generic web attacks (SQLi, XSS).","Correct: LLM-specific content inspection lives at the prompt firewall.","The control plane manages cloud resources.","Authentication confirms identity, not content."],
 x:"The prompt firewall inspects both prompts and responses for LLM-specific threats."}),
Q({id:'e052',d:2,o:'2.4',t:['privacy-tech'],q:"A healthcare organization removes direct identifiers (names, SSNs) and indirect identifiers (ZIP codes, birth dates), but a trusted party retains a key that could re-identify individuals. This is best described as:",
 a:["Anonymization","De-identification","Tokenization","Redaction"],c:1,
 w:["Anonymization is irreversible; a retained key contradicts it.","Correct: HIPAA-style de-identification can allow re-identification by a key holder.","Tokenization swaps specific values for vault-mapped tokens.","Redaction removes elements from outputs/documents."],
 x:"De-identification overlaps with pseudonymization; anonymization is the irreversible end."}),
Q({id:'e053',d:2,o:'2.4',t:['privacy-tech'],q:"A payment system replaces a credit card number with a non-sensitive placeholder that maps back to the real number only through a secure vault. This is:",
 a:["Masking","Tokenization","Anonymization","Classification"],c:1,
 w:["Masking hides or substitutes values but typically without a vault mapping.","Correct: the token has no exploitable value on its own.","Anonymization is irreversible.","Classification labels sensitivity."],
 x:"Format-preserving tokens are also used to sanitize logs before sending them to a public model."}),
Q({id:'e054',d:2,o:'2.4',t:['privacy-tech'],q:"A database view masks values on the fly as they're queried, so the viewer only sees the masked version and the stored data is unchanged. This is:",
 a:["Static masking","Dynamic masking","Redaction","Anonymization"],c:1,
 w:["Static masking creates a separate masked copy.","Correct: masking is applied at access time.","Redaction removes data after collection.","Anonymization strips identity from the dataset."],
 x:"Static = permanent masked copy; dynamic = masked as accessed, original at rest."}),
Q({id:'e055',d:2,o:'2.4',t:['privacy-tech','compliance'],q:"Under a typical four-tier data classification scheme, encryption keys and trade secrets belong in:",
 a:["Public","Internal","Confidential","Restricted/Secret"],c:3,
 w:["Public data carries no risk if disclosed.","Internal is for employees only, low impact.","Confidential covers PII and IP generally.","Correct: the most critical tier."],
 x:"A common AI policy rule: restricted data never leaves the trust boundary."}),
Q({id:'e056',d:2,o:'2.6',t:['gateway-quotas','llm-attacks'],q:"An attacker's goal is not to take an AI system offline, but to exhaust its billing budget through high-volume, legitimate-looking usage. This is:",
 a:["Model denial of service","Denial-of-wallet","Excessive agency","Model theft"],c:1,
 w:["Classic DoS targets availability.","Correct: cost exhaustion in pay-per-token environments.","Excessive agency is over-permissioning.","Theft copies the model."],
 x:"Pair rate limits with token limits and budget alerts."}),
Q({id:'e057',d:2,o:'2.2',t:['gateway-quotas'],q:"A denial-of-wallet attack is driving up costs through high request volume and very long responses. Paired with rate limiting, which control addresses the second driver?",
 a:["Endpoint access controls","Output token limits","A content delivery network","Model guardrails"],c:1,
 w:["Access controls don't cap response length.","Correct: token limits cap response size.","A CDN caches static content.","Guardrails filter content, not length."],
 x:"Rate limits address volume; output token limits address size."}),
Q({id:'e058',d:2,o:'2.3',t:['access-control'],q:"An attacker steals a valid session token and reuses it later to impersonate the user. Which control best limits this?",
 a:["IAM federation","Short-lived, expiring session tokens","SSH certificate authentication","Permanent access keys"],c:1,
 w:["Federation shares identity across systems; it doesn't stop replay.","Correct: an expired token is useless when replayed.","SSH certs don't address the stolen web/API token.","Permanent keys make replay worse."],
 x:"Scoped, expiring, revocable keys reduce the impact of credential theft."}),
// ---------------- Domain 3 ----------------
Q({id:'e059',d:3,o:'3.1',t:['ai-tools'],q:"An emerging standard that lets AI systems, agents, and tools share context and state across a workflow in a structured, interoperable way is:",
 a:["RAG","Model Context Protocol (MCP)","GAN","OWASP LLM Top 10"],c:1,
 w:["RAG retrieves documents into a prompt.","Correct: MCP standardizes how components exchange context, memory, and intermediate results.","A GAN is a generative architecture.","OWASP LLM Top 10 is a risk list."],
 x:"MCP's main security implication is a larger surface for context leakage between agents."}),
Q({id:'e060',d:3,o:'3.3',t:['automation'],q:"An analyst needs a fast way to turn a week of SIEM alerts into a readable summary. Best-fit AI use case:",
 a:["Automated penetration testing","Summarization","Fraud detection","Model theft prevention"],c:1,
 w:["Pen testing simulates attacks.","Correct: summarization condenses large volumes into readable output.","Fraud detection flags anomalous transactions.","Not related to reporting."],
 x:"Summaries can be mapped to ATT&CK/ATLAS techniques with source links for the analyst."}),
Q({id:'e061',d:3,o:'3.2',t:['attack-vectors'],q:"A convincing synthetic video call impersonating a CEO to authorize a wire transfer is:",
 a:["Model inversion","Deepfake-enabled social engineering","Data poisoning","Model theft"],c:1,
 w:["Inversion extracts training data.","Correct: synthetic media impersonation.","Poisoning targets training data.","Theft copies a model."],
 x:"Use out-of-band verification for payment approvals regardless of how real the request looks."}),
Q({id:'e062',d:3,o:'3.2',t:['attack-vectors'],q:"Attackers use AI to rapidly research targets and personalize phishing at scale. This is:",
 a:["Model denial of service","AI-accelerated reconnaissance and social engineering","Excessive agency","Model skewing"],c:1,
 w:["DoS targets availability.","Correct: AI speeds OSINT collection and tailors lures.","Excessive agency is over-permissioning.","Skewing is biased drift."],
 x:"Spelling and grammar mistakes are no longer reliable phishing indicators."}),
Q({id:'e063',d:3,o:'3.2',t:['attack-vectors'],q:"AI-assisted techniques used to disguise malicious code or content from signature-based detection are called:",
 a:["Obfuscation","Redaction","Masking","Watermarking"],c:0,
 w:["Correct: modified code with the same behavior evades signatures.","Redaction removes sensitive data.","Masking hides data values.","Watermarking marks origin."],
 x:"Signature detection struggles because generated variants change faster than signatures update."}),
Q({id:'e064',d:3,o:'3.3',t:['automation'],q:"Using AI to auto-generate a polished incident report from raw findings is:",
 a:["Document synthesis","Insecure output handling","Membership inference","Model poisoning"],c:0,
 w:["Correct: turning raw data into readable reports.","That's a vulnerability, not a use case.","A privacy attack.","An integrity attack."],
 x:"Review AI-authored reports for auditability before they become official records."}),
Q({id:'e065',d:3,o:'3.3',t:['automation','testing-oversight'],q:"An AI-assisted CI/CD pipeline blocks deployment when a new model fails an automated bias test. This is:",
 a:["Excessive agency","A CI/CD model testing gate","Model DoS","Shadow AI"],c:1,
 w:["Excessive agency is over-permissioning.","Correct: model testing (including fairness) gates the release.","DoS targets availability.","Shadow AI is unsanctioned tool use."],
 x:"Model testing covers fairness, data leakage, and injection resistance before release."}),
Q({id:'e066',d:3,o:'3.3',t:['automation'],q:"Reviewing third-party libraries and dependencies in a project for known vulnerabilities is:",
 a:["Software composition analysis (SCA)","Model inversion","Data lineage tracking","Prompt engineering"],c:0,
 w:["Correct: SCA examines third-party components, often alongside an SBOM.","Inversion is an attack.","Lineage tracks data transformations.","Prompt engineering steers model output."],
 x:"An SBOM lists libraries, frameworks, datasets, and models; SCA checks them for vulnerabilities."}),
Q({id:'e067',d:3,o:'3.3',t:['automation'],q:"AI supporting approvals, automated deployment, and automated rollback describes:",
 a:["AI-assisted change management","Excessive agency","Model theft","Data minimization"],c:0,
 w:["Correct.","Only if permissions exceed the task.","An attack.","A privacy principle."],
 x:"Automated change approvals should be logged and verified by humans in the loop."}),
Q({id:'e068',d:3,o:'3.2',t:['attack-vectors'],q:"Which is an example of AI-enabled automated attack generation?",
 a:["A SOC analyst manually writing a YARA rule","AI generating novel malware variants and adaptive DDoS tooling","A firewall blocking a known IP","A human reviewing an audit log"],c:1,
 w:["Manual defensive work.","Correct.","A defensive control.","A defensive activity."],
 x:"AI automates target selection, payload creation, and real-time attack adaptation."}),
Q({id:'e069',d:3,o:'3.1',t:['ai-tools'],q:"An administrator uses an AI plug-in in the terminal that generates complex commands and explains each flag before running them. This is best described as:",
 a:["A CLI plug-in","Shadow AI","An MCP server","A browser plug-in"],c:0,
 w:["Correct: CLI plug-ins generate and explain commands at the command line.","Shadow AI is unsanctioned use; nothing says this is unapproved.","MCP shares context between AI components.","Browser plug-ins work inside web pages."],
 x:"Rewritten Oct 2026 for clarity. CLI plug-ins reduce command mistakes but must be tested because hallucinated commands can make unintended changes."}),
Q({id:'e070',d:3,o:'3.3',t:['automation'],q:"AI used to automatically create, triage, and route incoming security tickets is:",
 a:["Excessive agency","Incident-ticket management automation","Model DoS","Insecure output handling"],c:1,
 w:["Not unless it exceeds its scope.","Correct.","An availability attack.","A downstream-execution flaw."],
 x:"Security workflows can open tickets, collect logs, and notify staff automatically."}),
Q({id:'e071',d:3,o:'3.1',t:['ai-tools'],q:"An AI tool notices the same external IP slowly accessing multiple servers with valid credentials over a week, extracting small amounts of data each time. No single event triggers an alert. This capability is:",
 a:["Anomaly detection on a single event","Pattern recognition","Signature matching","Fraud detection"],c:1,
 w:["No single event was anomalous enough.","Correct: recurring trends across many events are flagged.","No known signature matched.","Fraud detection is a specific transaction use case."],
 x:"Pattern recognition finds recurring deviations or trends; anomaly detection compares activity against a baseline."}),
Q({id:'e072',d:3,o:'3.2',t:['attack-vectors'],q:"An AI-generated image of a disaster goes viral and causes panic, but no organized campaign is behind it; people simply believed it. This is:",
 a:["Disinformation","Misinformation","Deepfake impersonation","Model inversion"],c:1,
 w:["Disinformation is created to deceive or harm deliberately.","Correct: false content spread without intent to deceive.","No specific person is impersonated.","Not a data extraction attack."],
 x:"Intent is the difference: disinformation is deliberate; misinformation isn't."}),
Q({id:'e073',d:3,o:'3.2',t:['attack-vectors'],q:"Malware shows nothing malicious under static analysis but queries an LLM at runtime to generate a fresh keylogger. This best represents:",
 a:["Polymorphic, AI-generated malware","A missing digital signature","Legacy software risk","Unencrypted communication"],c:0,
 w:["Correct: payload generated at runtime evades static detection.","Signatures don't explain runtime generation.","Not related to software age.","Not a transport issue."],
 x:"This pattern (e.g., BlackMamba) defeats signature-based tools."}),
Q({id:'e074',d:3,o:'3.2',t:['attack-vectors'],q:"Named malicious LLM tools built for generating phishing emails and malware scripts include:",
 a:["RAG and MCP","WormGPT and FraudGPT","OWASP and MITRE ATLAS","NIST AI RMF and ISO 42001"],c:1,
 w:["Architectures/protocols.","Correct.","Defensive frameworks.","Governance frameworks."],
 x:"These are criminal LLM offerings without safety guardrails."}),
Q({id:'e075',d:3,o:'3.2',t:['attack-vectors'],q:"A botnet dynamically shifts target ports, packet types, and timing based on real-time feedback during an attack, evading static block lists. This is:",
 a:["Automated data correlation","AI-powered DDoS","Model denial of service","Prompt injection"],c:1,
 w:["Correlation is reconnaissance.","Correct: adaptive attack profiles driven by live analysis.","Model DoS targets an AI model specifically.","Injection targets an LLM."],
 x:"AI continuously probes defenses and updates the attack profile to minimize detection."}),
Q({id:'e076',d:3,o:'3.2',t:['attack-vectors'],q:"Attackers use machine learning to analyze response times, service banners, and data consistency to identify deception systems before engaging. This is:",
 a:["Honeypot detection/evasion","Pattern recognition for defense","Membership inference","Model inversion"],c:0,
 w:["Correct.","This is offensive use.","A privacy attack.","A data extraction attack."],
 x:"Defenders can also use AI to adapt honeypots so they're harder to fingerprint."}),
Q({id:'e077',d:3,o:'3.3',t:['automation'],q:"Which platform type lets a user build a solution entirely through a visual interface with no hand-written code at all?",
 a:["Low-code","No-code","Full scripting","Infrastructure as Code"],c:1,
 w:["Low-code mixes visual building with some custom code.","Correct.","Scripting is hand-written code.","IaC is code that defines infrastructure."],
 x:"Low-code is common for customizing prebuilt SOAR playbooks and dashboards."}),
Q({id:'e078',d:3,o:'3.3',t:['automation'],q:"Shortly after a deployment, an AI system detects a sharp rise in errors and latency, reverts to the prior version, and alerts the team. This is:",
 a:["Static code analysis","Automated rollback","Unit testing","Dynamic code analysis"],c:1,
 w:["Static analysis inspects code without running it.","Correct.","Unit tests check individual functions before release.","DAST tests a running app for vulnerabilities."],
 x:"Rollback restores known-good code while another fix is researched."}),
Q({id:'e079',d:3,o:'3.3',t:['automation','ai-concepts'],q:"What is the key differentiator between an AI agent and a traditional automation script?",
 a:["Agents always require human approval before any action","Scripts use machine learning, agents do not","An agent can perceive, plan, adapt, and act within its scope","Agents cannot operate in CI/CD pipelines"],c:2,
 w:["Approval depends on risk level, not on being an agent.","Reversed.","Correct.","Agents are increasingly used in DevSecOps."],
 x:"Agents are active (perceive, reason, decide, act); tools are passive and used by agents."}),
// ---------------- Domain 4 ----------------
Q({id:'e080',d:4,o:'4.1',t:['governance'],q:"A cross-functional team that sets AI standards, reviews projects, curates tools, and writes the AI policy for the whole organization is:",
 a:["An AI Center of Excellence","An MLOps team","A prompt firewall vendor","A vector database admin group"],c:0,
 w:["Correct.","MLOps automates model delivery and monitoring.","A vendor isn't a governance body.","A narrow technical function."],
 x:"The CoE blends engineering, security, privacy, legal, risk, and product."}),
Q({id:'e081',d:4,o:'4.1',t:['governance'],q:"Who automates the model life cycle on the platform: CI/CD for models and prompts, versioning and lineage, retraining, and drift monitoring with rollback?",
 a:["AI auditor","MLOps engineer","AI risk analyst","Data scientist"],c:1,
 w:["Auditors provide independent assurance.","Correct.","Risk analysts assess use cases against risk criteria.","Data scientists explore data and build baseline models."],
 x:"MLOps engineers own repeatable builds, releases, and monitoring."}),
Q({id:'e082',d:4,o:'4.1',t:['governance'],q:"Who provides independent assurance by sampling artifacts and logs, recreating decisions, and confirming approvals followed policy?",
 a:["AI governance engineer","AI auditor","AI architect","ML engineer"],c:1,
 w:["Governance engineers codify approval workflows and evidence collection.","Correct.","Architects design how components fit together.","ML engineers productionize models."],
 x:"Independence is the defining trait of the auditor role."}),
Q({id:'e083',d:4,o:'4.3',t:['compliance'],q:"An employee pastes confidential data into an unapproved public AI chatbot. This is:",
 a:["Model accuracy drift","Shadow AI","Membership inference","Data poisoning"],c:1,
 w:["Drift is performance decay.","Correct: unsanctioned AI use.","A privacy attack on models.","A training integrity attack."],
 x:"Mature programs reduce shadow AI by offering a catalog of sanctioned tools with SSO."}),
Q({id:'e084',d:4,o:'4.2',t:['drift-maint','risk'],q:"Model performance degrading over time as real-world data shifts from training data is:",
 a:["Model accuracy/performance drift","Model theft","Excessive agency","Data minimization"],c:0,
 w:["Correct.","An attack.","Over-permissioning.","A privacy principle."],
 x:"Monitor live inputs and outputs against training baselines, with controlled retraining and rollback."}),
Q({id:'e085',d:4,o:'4.3',t:['compliance'],q:"A risk-tiered regulation for AI systems placed on or used in the EU market is:",
 a:["NIST AI RMF","EU AI Act","OECD AI Principles","ISO 27001"],c:1,
 w:["Voluntary U.S. framework.","Correct.","Non-binding principles.","An information security management standard."],
 x:"Tiers: unacceptable (prohibited), high, limited (transparency), minimal."}),
Q({id:'e086',d:4,o:'4.3',t:['compliance'],q:"A voluntary framework organizing AI risk management into Govern, Map, Measure, and Manage is:",
 a:["EU AI Act","NIST AI Risk Management Framework","OECD AI Principles","MITRE ATLAS"],c:1,
 w:["Binding EU law with risk tiers.","Correct.","Values-based guidance.","An adversary tactics catalog."],
 x:"NIST AI RMF is widely adopted beyond the U.S. because it's practical."}),
Q({id:'e087',d:4,o:'4.3',t:['compliance'],q:"Where data physically resides and which jurisdiction's law applies to it is called:",
 a:["Data lineage","Data sovereignty","Data provenance","Data minimization"],c:1,
 w:["Lineage tracks transformations.","Correct.","Provenance documents origin, license, and consent.","Minimization limits collection."],
 x:"Private models give more control over data residency than shared public models."}),
Q({id:'e088',d:4,o:'4.2',t:['risk'],q:"Which responsible-AI principle is most directly violated when a model's decision process cannot be explained to affected users?",
 a:["Fairness","Transparency and explainability","Accountability","Inclusiveness"],c:1,
 w:["Fairness is about outcomes across groups.","Correct.","Accountability is about who owns decisions.","Inclusiveness is about serving diverse populations."],
 x:"Required depth of explanation scales with risk: medical diagnosis > movie recommendations."}),
Q({id:'e089',d:4,o:'4.3',t:['compliance'],q:"Before adopting a vendor's AI service that will process sensitive data, an organization should obtain:",
 a:["A prompt firewall install","Independent third-party assurance (e.g., SOC 2 Type II, pen test, privacy assessment)","Model quantization","Data anonymization only"],c:1,
 w:["A control, not vendor assurance.","Correct.","An efficiency technique.","Doesn't establish the vendor's posture."],
 x:"Independent evaluations shorten procurement and support the buyer's risk committee."}),
Q({id:'e090',d:4,o:'4.2',t:['risk'],q:"Which responsible-AI principle means an AI system delivers stable, predictable results across similar inputs and across user groups and deployment scenarios?",
 a:["Fairness","Consistency","Explainability","Sustainability"],c:1,
 w:["Fairness focuses on not disadvantaging groups.","Correct.","Explainability is understanding the reasoning.","Sustainability is resource and energy use."],
 x:"Reworded Oct 2026. Consistency is often measured with bias audits using demographic parity and equal opportunity metrics."}),
Q({id:'e091',d:4,o:'4.1',t:['governance'],q:"A CoE centralizes platforms, policies, and reviews, while business units build their own AI solutions within predefined boundaries. This structure is:",
 a:["Fully centralized","Hybrid (hub-and-spoke)","Federated with no central platform","Shadow AI"],c:1,
 w:["Centralized places most development and all governance in one team.","Correct: the most common model because it balances control and efficiency.","Federated puts developers in business units with the CoE as a standards and assurance function.","Shadow AI is unsanctioned use."],
 x:"CertMaster names three models: centralized, federated, hybrid. Hub-and-spoke is another name for the hybrid model."}),
Q({id:'e092',d:4,o:'4.1',t:['governance'],q:"An organization places AI developers inside each business unit and uses the CoE only as a standards and assurance function. Which model is this, and what is its main risk?",
 a:["Centralized; slow delivery","Federated; inconsistent controls and duplicated effort across units","Hybrid; too much central control","Embedded audit; loss of independence"],c:1,
 w:["Centralized keeps development in one team.","Correct.","Hybrid centralizes platforms and reviews.","Not a named structure."],
 x:"Federated gives speed and local ownership but needs strong standards to stay consistent."}),
Q({id:'e093',d:4,o:'4.1',t:['governance'],q:"A team member builds and maintains pipelines that acquire, clean, label, and deliver quality-controlled data for AI training. This role is:",
 a:["Data scientist","Data engineer","MLOps engineer","AI architect"],c:1,
 w:["Data scientists explore data and build baseline models.","Correct.","MLOps automates model CI/CD and monitoring.","Architects design how components fit together."],
 x:"Data engineer = pipelines and data quality; data scientist = problem framing, features, baseline models."}),
Q({id:'e094',d:4,o:'4.3',t:['compliance'],q:"An internal document states: 'Data must be encrypted before being used in any AI training.' This is most likely a:",
 a:["Policy","Standard","Procedure","Guideline"],c:1,
 w:["Policies state what's allowed and who decides, at a higher level.","Correct: a specific, mandatory, measurable requirement.","Procedures give step-by-step how-to.","Guidelines are optional recommendations."],
 x:"Policy → standard → procedure → guideline."}),
Q({id:'e095',d:4,o:'4.3',t:['compliance'],q:"Under the EU AI Act's risk tiers, a government social scoring system would most likely be classified as:",
 a:["Minimal risk","Limited risk","High risk","Unacceptable risk (prohibited)"],c:3,
 w:["Minimal risk has few obligations.","Limited risk carries transparency duties.","High risk is allowed with heavy obligations.","Correct."],
 x:"Specific forms of social scoring are prohibited outright."}),
Q({id:'e096',d:4,o:'4.3',t:['compliance'],q:"Which of these AI-related frameworks or regulations is legally binding, unlike the others?",
 a:["NIST AI RMF","OECD AI Principles","ISO/IEC 42001","EU AI Act"],c:3,
 w:["Voluntary.","Non-binding intergovernmental guidance.","A certifiable standard, but voluntary to adopt.","Correct."],
 x:"ISO 42001 can be certified by a third party, but no law requires it the way the EU AI Act is required."})
];
/* ---------- New Domain 1 questions (Oct 2026). Original items written to match CertMaster's question styles, not copied from it. r:1 = final-exam reserve. ---------- */
const BANK_D1 = [
// ===== 1.1 ML techniques =====
Q({id:'n101',d:1,o:'1.1',t:['ml-techniques'],q:"A threat intelligence team has two years of domain registrations that analysts already labeled as phishing or legitimate. They want to rank how likely each newly registered domain is to be phishing, using hundreds of fine-grained signals such as registrar, name entropy, hosting ASN, and certificate age. Which approach BEST fits this requirement?",
 a:["An Isolation Forest trained on the unlabeled registration stream","Gradient-boosted decision trees trained on the labeled history","An autoencoder that scores reconstruction error","Zero-shot prompting of a general-purpose LLM for each domain"],c:1,
 w:["Isolation Forest is unsupervised; it ignores the labels the team already has.","Correct: labeled data plus many fine-grained features is the textbook case for gradient-boosted trees, which correct each prior tree's mistakes.","Autoencoders learn 'normal' without labels; they flag unusual records, not phishing likelihood.","Zero-shot output is a hypothesis, not a calibrated ranking model."],
 x:"When reliable labels exist, use supervised learning. Gradient-boosted trees combine many weak trees in sequence and handle thousands of signals."}),
Q({id:'n102',d:1,o:'1.1',t:['ml-techniques'],q:"How does an Isolation Forest decide that a network session is anomalous?",
 a:["It reconstructs the session and measures how much information was lost","It randomly partitions the data and flags sessions that can be separated with very few cuts","It compares the session to a labeled set of known attacks","It clusters sessions and alerts on the largest cluster"],c:1,
 w:["That describes an autoencoder's reconstruction error.","Correct: rare, unusual points isolate quickly, so short paths mean anomalies.","That's supervised classification; Isolation Forest needs no labels.","The largest cluster is usually normal behavior, not the anomaly."],
 x:"Isolation Forest: random cuts; outliers get isolated in few cuts. Autoencoder: high reconstruction error. Both are unsupervised."}),
Q({id:'n103',d:1,o:'1.1',t:['ml-techniques'],q:"A SOC trains an autoencoder on 90 days of normal VPN authentication records. A new login event produces a reconstruction error far above every value seen in training. What does this MOST likely indicate?",
 a:["The autoencoder is underfitting and must be retrained with more epochs","The event deviates significantly from the normal behavior the model learned","The event matches a known attack signature in the training set","The login is legitimate because the model could not classify it"],c:1,
 w:["One outlier score doesn't show underfitting; the model reconstructed normal records well enough to set the baseline.","Correct: high reconstruction error means the record falls outside the learned 'normal'.","Autoencoders don't match signatures; they had no attack labels.","Failing to reconstruct an event is the alert signal, not proof it's legitimate."],
 x:"An autoencoder learns to recreate normal records. Records it can't recreate well are flagged for analyst review."}),
Q({id:'n104',d:1,o:'1.1',t:['ml-techniques'],q:"In which situation is unsupervised learning MOST appropriate for security detection?",
 a:["Classifying emails using a large archive of analyst-confirmed spam labels","Hunting for zero-day or insider activity where no reliable labels exist","Predicting exploitability scores from a labeled vulnerability dataset","Translating incident reports into another language"],c:1,
 w:["Plentiful reliable labels favor supervised learning.","Correct: unsupervised methods learn normal behavior and surface deviations without labels.","Labeled targets again favor supervised learning.","Translation is an NLP generation task."],
 x:"Supervised = labeled, known patterns, precise and auditable. Unsupervised = unlabeled, novel threats, flexible and scalable."}),
Q({id:'n105',d:1,o:'1.1',t:['ml-techniques','data-integrity'],q:"A detection team auto-labels raw endpoint logs using YARA rules, sandbox verdicts, and threat feed matches to train a supervised model quickly. After deployment, the model over-flags routine admin scripts. Which safeguard BEST addresses the root cause?",
 a:["Add more automatic labeling sources to increase training volume","Run regular human label audits and down-weight labels from lower-trust sources","Remove the validation set so all data can be used for training","Switch the model to a larger neural network"],c:1,
 w:["More weak labels add more noise, not less.","Correct: weak supervision introduces label noise; audits and confidence weighting restore label quality.","Removing validation hides the problem instead of fixing it.","A bigger model would fit the noisy labels even more closely."],
 x:"Weak supervision speeds labeling but adds noise. Fixes: label audits, confidence weighting, and semi-supervised refinement on analyst-verified predictions."}),
Q({id:'n106',d:1,o:'1.1',t:['ml-techniques'],q:"Which model type can learn opcode and entropy patterns directly from an executable's raw byte sequence to spot packed malware that evades signature scanners?",
 a:["Logistic regression on file metadata","Convolutional neural network (CNN)","k-means clustering on file names","A rule-based YARA engine"],c:1,
 w:["Logistic regression works on engineered features, not raw byte sequences.","Correct: CNNs learn patterns directly from raw byte input.","Clustering file names won't reveal packing.","YARA rules are signatures; packed malware is designed to slip past them."],
 x:"CNNs over raw bytes can recognize packed (compressed or encrypted) binaries without hand-written signatures."}),
Q({id:'n107',d:1,o:'1.1',t:['ml-techniques','testing-oversight'],q:"A regulated bank needs a baseline intrusion classifier whose decisions auditors can easily examine and explain. Which model is the MOST appropriate starting point?",
 a:["A deep neural network with many hidden layers","Logistic regression","A generative adversarial network","An unsupervised autoencoder"],c:1,
 w:["Deep networks can be accurate but are hard to interpret.","Correct: its weights are directly inspectable, which suits audits.","GANs generate content; they aren't classifiers for this need.","Autoencoders flag anomalies and need no labels; explainability isn't their strength."],
 x:"In regulated settings, simpler interpretable models are often preferred when performance is comparable."}),
Q({id:'n108',d:1,o:'1.1',t:['ml-techniques'],q:"Why might a team use k-fold cross-validation instead of a single train/validation split?",
 a:["It removes the need for a test set entirely","It averages performance across k rotating held-out folds, so the estimate doesn't depend on one lucky or unlucky split","It makes training faster by using less data","It automatically balances minority classes"],c:1,
 w:["A final test set is still good practice.","Correct: each fold takes a turn as the held-out set and the scores are averaged.","It trains k times, so it's slower.","Balancing is a separate data technique."],
 x:"k-fold cross-validation gives a more stable estimate and helps reveal overfitting, drift, and silent poisoning."}),
Q({id:'n109',d:1,o:'1.1',t:['ml-techniques'],q:"A data scientist splits a labeled dataset into three mutually exclusive sets. Which set should provide the final, unbiased performance estimate?",
 a:["Training set","Validation set","Test set","Augmented set"],c:2,
 w:["The model learns from the training set, so it's biased in favor of it.","The validation set is used for tuning and sanity checks during development.","Correct: it's held back until the end.","Augmented data is synthetic training material, not an evaluation set."],
 x:"Training = learn. Validation = tune and check during development. Test = final unbiased estimate."}),

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecAI+ CY0-001 — 5-Day Readiness Bootcamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1C;
    --panel:#0F1729;
    --panel-2:#141F38;
    --line:#22304F;
    --ink:#E8ECF4;
    --ink-dim:#8B96AC;
    --cyan:#5AC8FA;
    --green:#3DDC84;
    --amber:#F5B942;
    --red:#F0555A;
    --mono:'JetBrains Mono',monospace;
    --disp:'Space Grotesk',sans-serif;
    --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);}
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(90,200,250,0.07), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(61,220,132,0.06), transparent 40%);
    min-height:100vh;
  }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  a{color:inherit;}
  .mono{font-family:var(--mono);}
  .disp{font-family:var(--disp);}

  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:300px;flex:none;background:linear-gradient(180deg,var(--panel),#0B1220);
    border-right:1px solid var(--line);padding:22px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;background:conic-gradient(from 220deg,var(--cyan),var(--green) 40%,var(--amber) 70%,var(--red) 100%);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:11px;color:#0A0F1C;flex:none;
  }
  .brand-text{line-height:1.15;}
  .brand-text .t1{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.02em;}
  .brand-text .t2{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);letter-spacing:.06em;}

  .gauge-card{
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;
  }
  .gauge-row{display:flex;align-items:center;gap:14px;}
  .gauge-ring{width:64px;height:64px;border-radius:50%;flex:none;position:relative;display:flex;align-items:center;justify-content:center;}
  .gauge-ring .hole{width:46px;height:46px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .gauge-ring .hole b{font-family:var(--mono);font-size:14px;line-height:1;}
  .gauge-ring .hole span{font-size:8px;color:var(--ink-dim);letter-spacing:.05em;margin-top:2px;}
  .gauge-label{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
  .gauge-status{font-family:var(--mono);font-weight:700;font-size:13px;}

  .domain-bars{margin-top:14px;display:flex;flex-direction:column;gap:9px;}
  .dbar-row{display:flex;flex-direction:column;gap:3px;}
  .dbar-top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-dim);}
  .dbar-top .code{font-family:var(--mono);color:var(--ink);}
  .dbar-track{height:6px;border-radius:4px;background:#1A2740;overflow:hidden;}
  .dbar-fill{height:100%;border-radius:4px;transition:width .4s ease;}

  nav.navlist{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
  .navlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin:14px 4px 6px;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;
    font-size:13px;color:var(--ink-dim);border:1px solid transparent;
  }
  .navitem:hover{background:#131E36;color:var(--ink);}
  .navitem.active{background:#132038;border-color:var(--line);color:var(--ink);}
  .navitem .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line);}
  .navitem .dot.done{background:var(--green);}
  .navitem .dot.partial{background:var(--amber);}
  .navitem .idx{font-family:var(--mono);font-size:11px;color:var(--ink-dim);width:16px;flex:none;}
  .navitem .pct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);}

  /* ---------- Main ---------- */
  #main{flex:1;min-width:0;padding:28px 34px 60px;max-width:980px;}
  .topline{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .topline h1{font-family:var(--disp);font-size:26px;margin:0;letter-spacing:-.01em;}
  .topline .sub{color:var(--ink-dim);font-size:13px;margin-top:4px;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
    padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);
  }

  .block{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;
  }
  .block-head{
    display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none;
  }
  .block-head:hover{background:#111C33;}
  .chk{
    width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
  }
  .chk.on{background:var(--green);border-color:var(--green);}
  .chk.on:after{content:'✓';font-size:12px;color:#06210F;font-weight:700;}
  .time{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);width:98px;flex:none;}
  .btitle{flex:1;min-width:0;}
  .btitle .name{font-weight:600;font-size:14.5px;}
  .btitle .tags{margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag{
    font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-dim);
  }
  .tag.obj{color:var(--cyan);border-color:rgba(90,200,250,.35);}
  .tag.lecture{color:var(--ink-dim);}
  .tag.lab{color:var(--amber);border-color:rgba(245,185,66,.35);}
  .tag.quiz{color:var(--green);border-color:rgba(61,220,132,.35);}
  .tag.admin{color:var(--ink-dim);}
  .caret{color:var(--ink-dim);font-size:12px;flex:none;transition:transform .15s;}
  .block.open .caret{transform:rotate(90deg);}
  .block-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .block.open .block-body{max-height:4000px;}
  .block-inner{padding:0 18px 18px 130px;font-size:13.8px;line-height:1.65;color:#CBD3E3;}
  .block-inner h4{font-family:var(--disp);font-size:13px;color:var(--ink);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px;}
  .block-inner h4:first-child{margin-top:0;}
  .block-inner ul{margin:0 0 10px;padding-left:18px;}
  .block-inner li{margin-bottom:4px;}
  .block-inner p{margin:0 0 10px;}
  .term-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;}
  .term-chip{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px;background:#0E1830;border:1px solid var(--line);color:var(--cyan);}

  .qcard{background:#0E1830;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;}
  .qcard .qtext{font-weight:600;font-size:13.6px;margin-bottom:10px;color:var(--ink);}
  .opt{
    display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:7px;border-radius:8px;
    background:#0A1224;border:1px solid var(--line);color:var(--ink);font-size:13px;cursor:pointer;font-family:var(--body);
  }
  .opt:hover{border-color:var(--cyan);}
  .opt.correct{background:rgba(61,220,132,.14);border-color:var(--green);color:var(--green);}
  .opt.wrong{background:rgba(240,85,90,.14);border-color:var(--red);color:var(--red);}
  .opt[disabled]{cursor:default;}
  .explain{font-size:12.5px;color:var(--ink-dim);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:none;}
  .explain.show{display:block;}

  .btn{
    font-family:var(--mono);font-size:12px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
    background:#101B32;color:var(--ink);cursor:pointer;
  }
  .btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .btn.primary{background:var(--cyan);color:#04121F;border-color:var(--cyan);font-weight:700;}
  .btn.primary:hover{opacity:.9;color:#04121F;}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* Flashcards */
  .fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0 30px;}
  .fc-filterbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;}
  .fc-scene{width:100%;max-width:520px;height:260px;perspective:1200px;cursor:pointer;}
  .fc-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s;}
  .fc-card.flipped{transform:rotateY(180deg);}
  .fc-face{
    position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;
    background:linear-gradient(160deg,#111D36,#0B1526);
  }
  .fc-face .k{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:10px;color:var(--ink-dim);}
  .fc-face .term{font-family:var(--disp);font-size:21px;font-weight:600;}
  .fc-face .def{font-size:14px;line-height:1.5;color:#CBD3E3;}
  .fc-back{transform:rotateY(180deg);}
  .fc-controls{display:flex;gap:10px;}
  .fc-progress{font-family:var(--mono);font-size:12px;color:var(--ink-dim);}

  /* Matching drill */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:14px;}
  .match-col h4{font-family:var(--disp);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin-bottom:10px;}
  .match-item{
    padding:11px 13px;margin-bottom:8px;border-radius:9px;border:1px solid var(--line);background:#0E1830;
    font-size:13px;cursor:pointer;transition:.12s;
  }
  .match-item:hover{border-color:var(--cyan);}
  .match-item.sel{border-color:var(--cyan);background:rgba(90,200,250,.12);}
  .match-item.correct{border-color:var(--green);background:rgba(61,220,132,.14);color:var(--green);cursor:default;}
  .match-item.wrong-flash{border-color:var(--red);background:rgba(240,85,90,.18);}
  .match-item.locked{opacity:.55;cursor:default;}

  /* Exam */
  .exam-shell{display:flex;flex-direction:column;gap:16px;}
  .exam-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .timer{font-family:var(--mono);font-size:20px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);}
  .timer.low{color:var(--red);border-color:var(--red);}
  .progress-strip{display:flex;gap:3px;flex-wrap:wrap;}
  .pdot{width:9px;height:9px;border-radius:2px;background:#1A2740;cursor:pointer;}
  .pdot.answered{background:var(--cyan);}
  .pdot.flagged{background:var(--amber);}
  .pdot.current{outline:2px solid var(--ink);outline-offset:1px;}

  .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
  .rcard{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .rcard .big{font-family:var(--mono);font-size:26px;font-weight:700;}
  .rcard .lbl{font-size:11px;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

  .empty{color:var(--ink-dim);font-size:13px;padding:30px 0;text-align:center;}

  @media(max-width:900px){
    #app{flex-direction:column;}
    #sidebar{width:100%;height:auto;position:relative;}
    #main{padding:20px;}
    .block-inner{padding-left:18px;}
    .match-grid{grid-template-columns:1fr;}
    .results-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">CY0</div>
      <div class="brand-text">
        <div class="t1">SECAI+ CONSOLE</div>
        <div class="t2">CY0-001 · 40HR BOOTCAMP</div>
      </div>
    </div>

    <div class="gauge-card">
      <div class="gauge-row">
        <div class="gauge-ring" id="gaugeRing">
          <div class="hole"><b id="gaugePct">0%</b><span>READY</span></div>
        </div>
        <div style="flex:1;">
          <div class="gauge-label">Overall readiness</div>
          <div class="gauge-status" id="gaugeStatus">NOT STARTED</div>
        </div>
      </div>
      <div class="domain-bars" id="domainBars"></div>
    </div>

    <nav class="navlist" id="navlist"></nav>
  </aside>

  <main id="main"></main>
</div>

<script>
/* ============================== DATA ============================== */

const DOMAINS = {
  1:{name:"Basic AI Concepts", short:"Basic AI Concepts", weight:17, color:'#5AC8FA'},
  2:{name:"Securing AI Systems", short:"Securing AI Systems", weight:40, color:'#F0555A'},
  3:{name:"AI-assisted Security", short:"AI-assisted Security", weight:24, color:'#F5B942'},
  4:{name:"AI Governance, Risk & Compliance", short:"GRC", weight:19, color:'#3DDC84'}
};

function q(text, opts, correctIdx, explain, domain){
  return {text, opts, correctIdx, explain, domain};
}

const DAYS = [
{
  id:1, key:'day1', label:'Day 1 · Monday', title:'Orientation + Domain 1 — Basic AI Concepts',
  domainFocus:1, dateNote:'08:00–17:00 · 8 hrs',
  blocks:[
    {id:'d1b0', time:'08:00–08:30', dur:'30m', type:'admin', obj:null, title:'Mission Briefing: Exam Format & Bootcamp Rules of Engagement',
      body:`<h4>Exam facts (CY0-001)</h4>
      <ul>
        <li>Up to 60 questions, 60 minutes, multiple-choice + performance-based (PBQ)</li>
        <li>Passing score: 600 on a 100–900 scale (roughly a 65–70% mastery bar)</li>
        <li>CompTIA has not published official per-domain percentage weights for CY0-001 as of this writing. What <i>is</i> confirmed (verified against the official Sybex/Wiley CY0-001 Study Guide): Domain 2 — Securing AI Systems — carries 6 of the 15 total sub-objectives, exactly 40% by objective count. Domains 1, 3, and 4 each carry 3 objectives (20% each by count). This bootcamp's time allocation is built on that confirmed count, not on an unverified third-party percentage split.</li>
        <li>Every Domain 2 sub-objective is written as "Given a scenario…" — that's CompTIA's signal it's PBQ territory. You will drill scenarios, not just definitions, all week.</li>
      </ul>
      <h4>How this bootcamp is built</h4>
      <ul>
        <li>Study time this week is allocated proportional to objective count — Domain 2 gets two full days (6 of 15 objectives), Domain 1 gets one day because it's foundational vocabulary everything else depends on.</li>
        <li>Each block ends with a knowledge check. Mark blocks complete as you finish — your readiness gauge on the left updates live and is saved automatically (only visible to you).</li>
        <li>Friday closes with a full 60-question timed simulation (drawn fresh from an 83-question bank) and a go/no-go readiness call before you book the real exam.</li>
      </ul>`,
      terms:[], quiz:[]},

    {id:'d1b1', time:'08:30–10:00', dur:'1h30m', type:'lecture', obj:'1.1', title:'AI Types, Training, and Prompt Engineering',
      body:`<h4>Types of AI (know these cold — compare/contrast is the exam verb here)</h4>
      <ul>
        <li><b>Generative AI</b> — produces new content (text, image, code) vs. classic AI that classifies/predicts on existing data</li>
        <li><b>Machine learning (ML)</b> — systems that improve from data without being explicitly reprogrammed for each task</li>
        <li><b>Statistical learning</b> — the math foundation under ML: regression, probability-based inference</li>
        <li><b>Deep learning</b> — ML using multi-layer neural networks</li>
        <li><b>Transformers</b> — the architecture behind modern LLMs; attention mechanisms let the model weigh relationships across an entire input</li>
        <li><b>NLP</b> — the broader field of machines processing human language; LLMs/SLMs/GANs are specific implementations</li>
        <li><b>LLM vs. SLM</b> — Large Language Models are broad, general-purpose, resource-heavy; Small Language Models are narrower, cheaper, often fine-tuned for a specific task or deployed at the edge</li>
        <li><b>GAN (Generative Adversarial Network)</b> — two networks (generator vs. discriminator) compete; generator improves by trying to fool the discriminator. Common in deepfake generation — ties directly into Domain 3's attack-vector content later this week</li>
      </ul>
      <h4>Model training concepts</h4>
      <ul>
        <li><b>Supervised learning</b> — trained on labeled data (input/output pairs)</li>
        <li><b>Unsupervised learning</b> — finds patterns/clusters in unlabeled data</li>
        <li><b>Reinforcement learning</b> — learns via reward/penalty feedback loops</li>
        <li><b>Fine-tuning</b> — further training a pre-trained model on a narrower, domain-specific dataset</li>
        <li><b>Pruning</b> — removing unneeded weights/parameters to shrink a model</li>
        <li><b>Quantization</b> — reducing numerical precision of weights to shrink size/speed up inference, at some accuracy cost</li>
      </ul>
      <h4>Model quality problems and dimensionality techniques (added from official study guide review)</h4>
      <ul>
        <li><b>Overfitting</b> — a model performs great on training data but fails to generalize to new examples (memorized instead of learned)</li>
        <li><b>Underfitting</b> — a model is too simple to capture the real pattern, performing poorly even on training data</li>
        <li><b>Concept drift</b> — a deployed model's accuracy quietly degrades over time because real-world data has shifted away from what it was trained on (e.g., a phishing-URL classifier trained last year missing this year's new phishing patterns)</li>
        <li><b>Data imbalance</b> — a training set with far more examples of one class than another, causing poor prediction accuracy for the minority class</li>
        <li><b>Precision, recall, F1 score</b> — standard model evaluation metrics tested against data the model hasn't seen before</li>
        <li><b>k-means clustering</b> — a common unsupervised technique for grouping similar data points (e.g., grouping similar network traffic to flag deviations)</li>
        <li><b>Principal component analysis (PCA)</b> — reduces the number of features in a dataset while preserving key patterns, useful for visualizing high-dimensional data like network traffic features</li>
      </ul>
      <h4>Prompt engineering vocabulary</h4>
      <ul>
        <li><b>System prompt</b> — sets model behavior/persona, usually not visible to the end user</li>
        <li><b>User prompt</b> — the input the end user actually types</li>
        <li><b>Zero-shot</b> — no examples given; <b>one-shot</b> — one example; <b>multi-shot (few-shot)</b> — several examples to steer output format/quality</li>
        <li><b>Prompt template</b> — a reusable, structured prompt pattern — this becomes a security control later (2.2) when it constrains what a user can inject</li>
      </ul>
      <p><b>Exam angle:</b> expect "explain why an LLM differs from an SLM" and "when would you fine-tune vs. prompt-engineer" style questions — the difference is training cost/scope vs. steering an existing model at inference time. Also expect a scenario that describes a model's accuracy quietly dropping months after deployment — that's concept drift, not a training bug.</p>`,
      terms:['Generative AI','Transformers','LLM','SLM','GAN','Fine-tuning','Pruning','Quantization','Zero/One/Multi-shot','Overfitting','Underfitting','Concept drift','PCA','k-means'],
      quiz:[
        q("A security team needs a lightweight model to run on-device for real-time endpoint anomaly scoring with minimal compute. Which best fits?",
          ["A general-purpose LLM","A small language model (SLM)","A GAN","An unsupervised clustering model"],1,
          "SLMs are narrower, cheaper, and better suited to constrained/edge deployments than a general-purpose LLM.",1),
        q("Reducing the numerical precision of a model's weights to shrink its size and speed inference, at some accuracy cost, is called:",
          ["Pruning","Fine-tuning","Quantization","Zero-shot prompting"],2,
          "Quantization lowers precision (e.g., 32-bit to 8-bit) to reduce size/latency.",1)
      ]},

    {id:'d1b2', time:'10:00–10:15', dur:'15m', type:'admin', obj:null, title:'Break', body:`<p>Short break. Stand up, hydrate.</p>`, terms:[], quiz:[]},

    {id:'d1b3', time:'10:15–11:45', dur:'1h30m', type:'lecture', obj:'1.2', title:'Data Security & RAG Foundations',
      body:`<h4>Data hygiene concepts</h4>
      <ul>
        <li><b>Lineage</b> — traceable history of where data came from and how it was transformed</li>
        <li><b>Provenance</b> — the origin/source authenticity of a specific piece of data</li>
        <li><b>Integrity</b> — assurance data hasn't been altered improperly</li>
        <li><b>Cleansing</b> — removing errors, duplicates, and inconsistencies before training/use</li>
        <li><b>Structured data</b> — highly organized, tables/databases, easy to secure. <b>Semi-structured data</b> — has some structure but needs custom validation (emails, log files). <b>Unstructured data</b> — free text, images, video; hardest to govern and makes up most AI training data</li>
        <li><b>Watermarking</b> — embedding a hidden signal in AI-generated or training content to prove origin/detect misuse</li>
      </ul>
      <h4>RAG — Retrieval-Augmented Generation (high-yield exam topic)</h4>
      <ul>
        <li>RAG lets a model pull in external/enterprise data at query time instead of relying only on what it was trained on</li>
        <li><b>Embeddings</b> — numerical vector representations of text/data that capture semantic meaning</li>
        <li><b>Vector database/storage</b> — stores embeddings for fast similarity search — this is where enterprise data meets model behavior, and it's a real attack surface (data poisoning, unauthorized retrieval)</li>
        <li>RAG is why "data access controls" (2.3) and "data security controls" (2.4) later this week matter so much — RAG pipelines are a direct pipe from your sensitive data into model output</li>
      </ul>
      <p><b>Exam angle:</b> RAG questions often disguise themselves as "why did the chatbot leak internal data?" scenarios — the answer usually traces back to missing access controls on the vector store or retrieval layer, not the model itself.</p>`,
      terms:['Lineage','Provenance','Watermarking','RAG','Embeddings','Vector database'],
      quiz:[
        q("A company's internal chatbot occasionally surfaces confidential HR documents to unauthorized employees. The chatbot uses RAG. Where should the investigation start?",
          ["The LLM's training data","Access controls on the vector database/retrieval layer","The GAN discriminator","The model's quantization settings"],1,
          "RAG pulls live enterprise data at query time via the vector store — unauthorized retrieval usually means missing access controls there, not a training-data problem.",1)
      ]},

    {id:'d1b5', time:'12:45–14:15', dur:'1h30m', type:'lecture', obj:'1.3', title:'Security Throughout the AI Life Cycle',
      body:`<h4>Life cycle stages (the official study guide breaks this into 8 — know the order, "at which stage should X happen" is classic CompTIA)</h4>
      <ol>
        <li><b>Business use case</b> — define the problem/value before touching data or models</li>
        <li><b>Data collection & preparation</b> — sourcing, consent, cleansing, lineage starts here</li>
        <li><b>Model development</b> — training the model against the prepared data</li>
        <li><b>Evaluation</b> — testing against bias, accuracy, and security criteria before anyone trusts the output</li>
        <li><b>Deployment</b> — releasing into production with guardrails and access controls in place</li>
        <li><b>Validation</b> — confirming the deployed model performs as expected in the real environment, not just in testing</li>
        <li><b>Monitoring & maintenance</b> — the life cycle doesn't end at launch; drift, abuse, and new threats have to be watched continuously</li>
        <li><b>Feedback & iteration</b> — user complaints, review logs, and performance issues feed back into the next round of development</li>
      </ol>
      <p><b>Exam angle:</b> a scenario about a team "collecting user complaints and reviewing logs to identify recurring model performance issues" is testing whether you recognize the <i>feedback and iteration</i> stage specifically — don't just default to "monitoring" for every post-deployment activity.</p>
      <h4>Human-centric design principles</h4>
      <ul>
        <li><b>Human-in-the-loop</b> — a human actively participates in the decision/output process</li>
        <li><b>Human oversight</b> — humans monitor and can intervene, even if not in every transaction</li>
        <li><b>Human validation</b> — humans verify/approve outputs before they're acted on, especially high-consequence ones</li>
      </ul>
      <p><b>Exam angle:</b> a scenario describing "the model auto-approves loan denials with no review" is testing whether you know that's missing human oversight/validation — a life-cycle and governance failure, not just a technical one.</p>`,
      terms:['Business case','Model evaluation','Deployment','Human-in-the-loop','Human oversight','Human validation'],
      quiz:[
        q("An organization deploys a fraud-detection model that automatically freezes accounts with zero human review of flagged cases. This is a gap in:",
          ["Data lineage","Human oversight/validation","Quantization","Watermarking"],1,
          "Automated high-consequence actions with no human check violate human-in-the-loop/oversight/validation principles.",1)
      ]},

    {id:'d1b6', time:'14:15–14:30', dur:'15m', type:'admin', obj:null, title:'Break', body:`<p>Short break.</p>`, terms:[], quiz:[]},

    {id:'d2b1', time:'08:15–09:45', dur:'1h30m', type:'lecture', obj:'2.1', title:'AI Threat-Modeling Resources',
      body:`<h4>Know which catalog to reach for — this is a matching skill on the exam</h4>
      <ul>
        <li><b>OWASP LLM Top 10</b> — the go-to list of top risks specific to large language model applications (prompt injection, insecure output handling, training data poisoning, etc.)</li>
        <li><b>OWASP ML Security Top 10</b> — broader machine-learning-specific risks beyond just LLMs</li>
        <li><b>MITRE ATLAS</b> — the adversarial-AI counterpart to MITRE ATT&CK; catalogs real-world adversary tactics/techniques against AI systems</li>
        <li><b>MIT AI Risk Repository</b> — a broad academic/industry-sourced database of AI risks across many categories, useful for GRC-adjacent framing</li>
        <li><b>CVE AI Working Group</b> — extends the standard CVE vulnerability-tracking process to AI-specific vulnerabilities</li>
      </ul>
      <p><b>Exam angle:</b> a described weakness, and you pick the framework/entry that models it. If it smells like "adversary tactics/techniques mapped like ATT&CK" → ATLAS. If it's "OWASP-style top risk list for LLM apps" → OWASP LLM Top 10. If it's "a tracked, numbered vulnerability" → CVE AI Working Group.</p>`,
      terms:['OWASP LLM Top 10','OWASP ML Top 10','MITRE ATLAS','MIT AI Risk Repository','CVE AI Working Group'],
      quiz:[
        q("A security architect wants a framework that catalogs real-world adversary tactics and techniques against AI systems, similar in structure to MITRE ATT&CK. Which resource fits?",
          ["OWASP LLM Top 10","MITRE ATLAS","MIT AI Risk Repository","CVE AI Working Group"],1,
          "MITRE ATLAS is explicitly the adversarial-AI counterpart to ATT&CK.",2),
        q("A newly discovered, trackable vulnerability in an open-source ML library should be referenced against:",
          ["OWASP ML Security Top 10","CVE AI Working Group","MIT AI Risk Repository","OWASP LLM Top 10"],1,
          "The CVE AI Working Group extends standard CVE tracking to AI-specific vulnerabilities.",2)
      ]},

    {id:'d2b2', time:'09:45–10:00', dur:'15m', type:'admin', obj:null, title:'Break', body:`<p>Short break.</p>`, terms:[], quiz:[]},

    {id:'d2b3', time:'10:00–11:30', dur:'1h30m', type:'lecture', obj:'2.2', title:'Security Controls for AI Systems',
      body:`<h4>Model controls</h4>
      <ul>
        <li><b>Guardrails</b> — rules/filters constraining model input/output (blocking disallowed topics, enforcing formats)</li>
        <li><b>Model evaluation</b> — ongoing testing of the model for accuracy, bias, and security regressions</li>
        <li><b>Prompt templates</b> — structured, constrained prompt formats that reduce free-text injection surface</li>
      </ul>
      <h4>Gateway controls (the chokepoint in front of the model)</h4>
      <ul>
        <li><b>Prompt firewall</b> — inspects/filters prompts before they reach the model, similar in spirit to a WAF</li>
        <li><b>Rate limits</b> — caps requests per time window per user/key</li>
        <li><b>Token limits</b> — caps the size of input/output to control cost and reduce abuse surface</li>
        <li><b>Input quotas</b> — overall usage caps over a period</li>
        <li><b>Modality limits</b> — restricting which input/output types are allowed (e.g., text-only, no image upload)</li>
        <li><b>Endpoint access controls</b> — who/what can even reach the API endpoint in the first place</li>
      </ul>
      <h4>Guardrail testing and validation (added from official study guide review)</h4>
      <ul>
        <li><b>Canary strings</b> — unique, planted phrases embedded in training or proprietary data specifically so a team can probe a deployed model afterward and check whether that exact phrase leaks out verbatim — a proactive test for guardrail failure and training-data leakage</li>
        <li><b>Jailbreak testing</b> — deliberately sending malicious/boundary-pushing prompts to a model in a controlled way to confirm its guardrails actually hold before attackers try the same thing</li>
      </ul>
      <p><b>Exam angle:</b> expect requirement-matching PBQs — "given these five requirements, choose the control stack that satisfies them." Model controls shape what the model itself does; gateway controls shape what reaches the model in the first place. Know which layer a given requirement belongs to. A scenario about proactively testing whether proprietary training phrases can be extracted post-deployment is describing canary strings specifically, not just "monitoring."</p>`,
      terms:['Guardrails','Model evaluation','Prompt templates','Prompt firewall','Rate limits','Token limits','Modality limits','Endpoint ACLs','Canary strings','Jailbreak testing'],
      quiz:[
        q("A requirement states: 'Prevent users from uploading images to a text-only support chatbot.' Which control satisfies this?",
          ["Rate limiting","Modality limits","Token limits","Model evaluation"],1,
          "Modality limits restrict which input/output types (text, image, audio) are permitted.",2),
        q("Which control inspects and filters prompts before they ever reach the model, functioning like a WAF for AI traffic?",
          ["Prompt firewall","Guardrails","Endpoint access control","Model evaluation"],0,
          "A prompt firewall sits at the gateway layer, filtering input before it reaches the model.",2)
      ]},

    {id:'d2b4', time:'11:30–12:30', dur:'1h', type:'admin', obj:null, title:'Lunch', body:`<p>Full break.</p>`, terms:[], quiz:[]},

    {id:'d2b5', time:'12:30–14:00', dur:'1h30m', type:'lecture', obj:'2.3', title:'Access Controls for AI Systems',
      body:`<h4>Four layers of AI access control (the new one is "agent access")</h4>
      <ul>
        <li><b>Model access</b> — who/what can invoke the model at all</li>
        <li><b>Data access</b> — who/what can reach the underlying training data or RAG-connected data stores</li>
        <li><b>Agent access</b> — what an autonomous AI agent is permitted to touch, execute, or call on its own. This is the layer most candidates haven't thought about before this exam — agents can take actions (file writes, API calls, purchases) without a human approving each step</li>
        <li><b>Network/API access</b> — traditional network-layer and API-key-based access restriction to the AI service itself</li>
      </ul>
      <p><b>Exam angle:</b> if a scenario describes an AI agent doing something it shouldn't have been able to do on its own (deleting records, sending emails, calling external APIs), that's an <b>agent access</b> control failure — tie this forward to "excessive agency" in objective 2.6 tomorrow.</p>`,
      terms:['Model access','Data access','Agent access','Network/API access'],
      quiz:[
        q("An autonomous AI agent with email-sending capability sends unauthorized messages to external recipients without approval. This points to a failure in:",
          ["Data access controls","Agent access controls","Modality limits","Watermarking"],1,
          "Agent access controls govern what an autonomous agent is permitted to do/execute on its own — the newest of the four access-control layers.",3)
      ]},

    {id:'d2b6', time:'14:00–14:15', dur:'15m', type:'admin', obj:null, title:'Break', body:`<p>Short break.</p>`, terms:[], quiz:[]},

    {id:'d2b7', time:'14:15–15:45', dur:'1h30m', type:'lab', obj:'2.2 / 2.3', title:'Scenario Lab: Design a Control Stack',
      body:`<p>Work through each scenario and decide which control(s) — model, gateway, or access-layer — satisfy the stated requirement. Write your answer before revealing.</p>
      <h4>Scenario A</h4>
      <p>A public-facing customer support chatbot must never process more than 2,000 tokens per conversation, to control cost and reduce prompt-stuffing abuse.</p>
      <p><i>Answer: Token limits (gateway control).</i></p>
      <h4>Scenario B</h4>
      <p>A finance team's internal RAG assistant should only be able to retrieve documents the requesting employee is already authorized to view in the source repository.</p>
      <p><i>Answer: Data access controls, enforced at the retrieval/vector-store layer — permissions must mirror source-system entitlements, not be looser.</i></p>
      <h4>Scenario C</h4>
      <p>An AI coding assistant with repo write-access should not be able to push directly to the production branch without a human-approved pull request.</p>
      <p><i>Answer: Agent access controls (constrain what the agent can execute) combined with human-in-the-loop/validation (life cycle principle from Day 1).</i></p>
      <h4>Scenario D</h4>
      <p>A vendor-hosted LLM API should reject all traffic that doesn't originate from your corporate VPN IP range.</p>
      <p><i>Answer: Network/API access controls.</i></p>`,
      terms:[], quiz:[]},

    {id:'d3b1', time:'08:15–09:45', dur:'1h30m', type:'lecture', obj:'2.4', title:'Data Security Controls for AI Systems',
      body:`<h4>Encryption states</h4>
      <ul>
        <li><b>In transit</b> — data moving between systems (TLS)</li>
        <li><b>At rest</b> — data stored on disk</li>
        <li><b>In use</b> — data actively being processed in memory (the differentiator most candidates forget). Two named technical approaches: <b>confidential computing</b> (secure enclaves — even the cloud provider can't see the raw data) and <b>homomorphic encryption</b> (performing computation directly on encrypted data without ever decrypting it)</li>
      </ul>
      <h4>Data-safety toolkit</h4>
      <ul>
        <li><b>Anonymization</b> — irreversibly removing identifying information so re-identification is not possible, even if combined with other public data sources</li>
        <li><b>Pseudonymization</b> — replacing identifying data with a reversible token/key — distinct from anonymization because someone holding the key can still re-identify the person</li>
        <li><b>Classification labels</b> — tagging data by sensitivity (public/internal/confidential/restricted) so controls can apply automatically</li>
        <li><b>Redaction</b> — permanently removing sensitive elements from a document/output</li>
        <li><b>Masking</b> — obscuring data (partial display, e.g., last 4 digits) while the underlying value may still exist elsewhere</li>
        <li><b>Minimization</b> — collecting/retaining only the data actually needed for the task</li>
      </ul>
      <p><b>Exam angle:</b> scenario questions hinge on picking the <i>right technique</i> for a described exposure — e.g., "an LLM output shows partial credit card numbers to a support agent" is masking; "training data must never reveal which real individuals it came from, even combined with outside data" is anonymization, not pseudonymization (which is reversible). "Processed inside a secure enclave so the cloud provider can't see it" is confidential computing specifically; "computed on <i>while still encrypted</i>, never decrypted" is homomorphic encryption.</p>`,
      terms:['Encryption in transit','Encryption at rest','Encryption in use','Confidential computing','Homomorphic encryption','Anonymization','Pseudonymization','Redaction','Masking','Minimization'],
      quiz:[
        q("Protecting data while it is actively being processed in memory during model inference is best described as:",
          ["Encryption at rest","Encryption in transit","Encryption in use","Data minimization"],2,
          "Encryption in use (e.g., confidential computing) protects data during active processing — the state most candidates overlook.",2),
        q("A support dashboard shows only the last four digits of a customer's SSN to agents. This is:",
          ["Anonymization","Masking","Redaction","Data minimization"],1,
          "Masking partially obscures a value for display while the full value may still exist in the system.",2)
      ]},

    {id:'d3b2', time:'09:45–10:00', dur:'15m', type:'admin', obj:null, title:'Break', body:`<p>Short break.</p>`, terms:[], quiz:[]},

    {id:'d3b3', time:'10:00–11:30', dur:'1h30m', type:'lecture', obj:'2.5', title:'Monitoring & Auditing for AI Systems',
      body:`<h4>Monitoring (ongoing, real-time posture)</h4>
      <ul>
        <li><b>Prompt monitoring</b> — logging/reviewing both queries and responses for abuse or drift</li>
        <li><b>Log sanitization and protection</b> — logs themselves can contain sensitive prompt content, so they need the same protections as the data they capture</li>
        <li><b>Response-confidence tracking</b> — watching model confidence scores to catch degrading reliability</li>
        <li><b>AI cost monitoring</b> — tracking spend across prompts, storage, and processing — unique to AI systems and a real operational/security signal (a cost spike can indicate abuse or a compromised key)</li>
        <li><b>Cost attribution</b> — a distinct practice from cost monitoring: identifying <i>which team or user</i> is driving spend, so a department generating 70% of monthly token consumption gets flagged specifically, not just "cost is up"</li>
      </ul>
      <h4>Three distinct rate-control concepts (frequently conflated — don't)</h4>
      <ul>
        <li><b>Rate monitoring</b> — watching for abnormal request patterns that might signal abuse or a malfunctioning client (detection, no action taken)</li>
        <li><b>Rate limiting</b> — actively rejecting requests once they exceed a defined threshold (a hard stop)</li>
        <li><b>Throttling</b> — slowing the rate of request processing to preserve availability under heavy load, without outright rejecting requests (a soft response, e.g. absorbing a legitimate demand surge)</li>
      </ul>
      <h4>Log and audit-trail integrity controls</h4>
      <ul>
        <li><b>Segregation of duties</b> — the same person should not both generate AI outputs and approve them for release without independent oversight</li>
        <li><b>Append-only logs</b> — a write mechanism (often paired with encryption) that prevents logs from being altered after the fact, protecting audit-trail integrity</li>
        <li><b>Retention policy enforcement</b> — logs and prompts shouldn't be kept indefinitely; failing to define and enforce a retention window is itself a governance failure regulators will flag</li>
      </ul>
      <h4>Auditing (periodic, quality + compliance lens)</h4>
      <ul>
        <li><b>Hallucinations</b> — auditing for confidently-stated false outputs</li>
        <li><b>Accuracy</b> — ongoing validation against ground truth</li>
        <li><b>Consistency auditing</b> — checking whether the model contradicts itself across similar questions, even when each individual answer is accurate</li>
        <li><b>Completeness auditing</b> — checking whether outputs are missing required information, not just whether they're wrong</li>
        <li><b>Bias and fairness</b> — checking for disparate outcomes across groups. Four named subtypes: <b>data bias</b> (skewed training data), <b>representation bias</b> (underrepresented groups), <b>algorithmic bias</b> (the model/algorithm itself), <b>outcome bias</b> (disparate real-world results even with equal inputs)</li>
        <li><b>Access</b> — auditing who actually used the system and what they touched</li>
      </ul>
      <p><b>Exam angle:</b> "cost monitoring" is an easy exam giveaway most candidates don't expect from a security exam — remember it explicitly, it's unique to AI systems. Watch for scenarios that name a specific rate-control word — "the system rejects requests over the threshold" is rate limiting; "the system slows down but keeps serving requests" is throttling; those are two different correct answers to two differently-worded questions.</p>`,
      terms:['Prompt monitoring','Log sanitization','Response-confidence tracking','AI cost monitoring','Cost attribution','Rate monitoring','Rate limiting','Throttling','Segregation of duties','Append-only logs','Hallucinations','Consistency auditing','Bias and fairness'],
      quiz:[
        q("A sudden spike in API spend on an LLM service, unaccompanied by a business reason, is most directly a signal to check via:",
          ["Bias and fairness auditing","AI cost monitoring","Watermarking","Data minimization review"],1,
          "AI cost monitoring tracks spend across prompts/storage/processing and can reveal abuse or a compromised key.",2),
        q("Confidently-stated but factually false model outputs are audited for under the category of:",
          ["Hallucinations","Log sanitization","Rate monitoring","Data lineage"],0,
          "Hallucination auditing specifically targets false-but-confident outputs.",2),
        q("An AI API receives a surge of 10,000 requests per minute during a demand spike. Instead of rejecting requests outright, the system slows down responses to preserve availability. This is:",
          ["Rate limiting","Throttling","Rate monitoring","Log sanitization"],1,
          "Throttling slows processing to preserve availability without outright rejecting requests — a softer response than rate limiting.",2),
        q("Auditors find one internal team responsible for 70% of monthly token consumption, causing cost spikes elsewhere. Which practice identifies this?",
          ["Rate monitoring","Cost attribution","Accuracy auditing","Log sanitization"],1,
          "Cost attribution identifies which team or user is driving spend, distinct from cost monitoring which just tracks the total.",2),
        q("A model gives complete, individually-correct answers but contradicts an earlier response to a very similar question. This is a:",
          ["Completeness issue","Consistency issue","Hallucination","Bias issue"],1,
          "Consistency auditing checks whether a model contradicts itself across similar questions, separate from whether any single answer is accurate.",2)
      ]},

    {id:'d3b4', time:'11:30–12:30', dur:'1h', type:'admin', obj:null, title:'Lunch', body:`<p>Full break — the biggest objective of the exam is right after this.</p>`, terms:[], quiz:[]},

    {id:'d3b5', time:'12:30–15:00', dur:'2h30m', type:'lecture', obj:'2.6', title:'Attack Analysis & Compensating Controls (the single highest-value objective on the exam)',
      body:`<h4>Attack taxonomy — know each one well enough to recognize it from a described symptom</h4>
      <ul>
        <li><b>Prompt injection</b> — malicious instructions smuggled into input to override intended model behavior</li>
        <li><b>Jailbreaking</b> — techniques to bypass a model's built-in safety/behavior restrictions</li>
        <li><b>Data poisoning</b> — corrupting training data so the model learns the wrong thing</li>
        <li><b>Model poisoning</b> — directly tampering with model weights/parameters (vs. the data feeding them)</li>
        <li><b>Model skewing</b> — a slower, subtler cousin of poisoning: users intentionally feed a model deceptive feedback over time, gradually biasing its behavior in their favor without tripping any single alarm</li>
        <li><b>Model inversion</b> — reconstructing sensitive training data by probing model outputs</li>
        <li><b>Model theft</b> — stealing a model's parameters/architecture via systematic extraction queries or direct exfiltration. A quieter variant is <b>indirect model theft</b> — an attacker infers proprietary behavior just from detailed confidence scores returned with every prediction, without ever "stealing" anything directly</li>
        <li><b>Membership inference</b> — determining whether a specific record was part of the training set (a privacy attack)</li>
        <li><b>Input manipulation</b> — crafting adversarial inputs (subtly altered images, text, or files) that cause a model to misclassify — the classic example is a modified stop sign an autonomous-vehicle model reads as a yield sign</li>
        <li><b>AI supply-chain / transfer-learning attacks</b> — when you build on a pretrained model or external dataset, you inherit whatever risk was hidden upstream. A poisoned public model or dataset can persist even after your own fine-tuning and deployment</li>
        <li><b>Model denial of service</b> — overwhelming a model with expensive queries to exhaust compute/cost/availability</li>
        <li><b>Insecure output handling</b> — treating model output as trusted/safe and passing it downstream without validation (e.g., into a shell or database query)</li>
        <li><b>Excessive agency</b> — an AI agent granted more autonomy/permissions than its task requires, enabling unintended actions</li>
        <li><b>Overreliance</b> — a human trusting model output without verification. Distinct from excessive agency: excessive agency is about what the <i>model/agent</i> can do; overreliance is about what the <i>human</i> fails to check</li>
      </ul>
      <h4>Attack → Compensating control mapping (the actual exam skill)</h4>
      <ul>
        <li>Prompt injection / jailbreaking → prompt firewalls, guardrails, prompt templates, jailbreak testing</li>
        <li>Data/model poisoning, model skewing → data integrity controls (cryptographic hashes/checksums), provenance/lineage verification, supply-chain vetting</li>
        <li>Model theft / indirect model theft / inversion / membership inference → rate limiting, output limiting (suppress detailed confidence scores), differential privacy techniques, access controls</li>
        <li>Input manipulation → adversarial training (including adversarial examples in the training set to build robustness), input validation</li>
        <li>AI supply-chain / transfer-learning attacks → vet pretrained models and datasets before adoption, treat upstream sources as untrusted until verified</li>
        <li>Model DoS → rate limits, token limits, cost monitoring/alerting</li>
        <li>Insecure output handling → treat model output as untrusted input downstream — validate/sanitize before executing or querying with it</li>
        <li>Excessive agency → agent access controls, least privilege, human-in-the-loop approval for consequential actions</li>
        <li>Overreliance → mandatory human review/validation gates on any high-consequence output, not just capability restrictions on the model itself</li>
      </ul>
      <p><b>This is the one objective to over-prepare.</b> It's the exam's single largest sub-objective and the most PBQ-heavy. You'll drill attack→control matching in the dedicated console tab this afternoon — now covering all 15 attack types above, not just 11.</p>`,
      terms:['Prompt injection','Jailbreaking','Data poisoning','Model poisoning','Model skewing','Model inversion','Model theft','Indirect model theft','Membership inference','Input manipulation','Supply-chain attack','Model DoS','Insecure output handling','Excessive agency','Overreliance'],
      quiz:[
        q("An application takes an LLM's generated code output and executes it directly without review. An attacker crafts a prompt that causes the model to output malicious shell commands, which then run. This is:",
          ["Model inversion","Insecure output handling","Membership inference","Data poisoning"],1,
          "Treating untrusted model output as safe to execute downstream is the definition of insecure output handling.",2),
        q("An attacker repeatedly queries a deployed model and uses the responses to reconstruct a close approximation of its parameters. This is:",
          ["Model theft","Jailbreaking","Excessive agency","Model denial of service"],0,
          "Extracting a model's parameters/behavior via systematic querying is model theft (extraction).",2),
        q("An AI coding agent with unrestricted repo and cloud-console access deletes a production database while completing an unrelated task. The root cause and best compensating control are:",
          ["Model DoS; add rate limits","Excessive agency; enforce agent access controls and least privilege","Data poisoning; add data lineage checks","Jailbreaking; add a prompt firewall"],1,
          "Excessive agency = more autonomy/permissions than the task required; the fix is least-privilege agent access controls and human approval for consequential actions.",2),
        q("A researcher determines with high confidence that a specific patient's medical record was included in a model's training data, based only on the model's outputs. This is:",
          ["Membership inference","Model poisoning","Insecure output handling","Model theft"],0,
          "Membership inference is specifically about determining whether a record was in the training set — a privacy attack.",2),
        q("A group of users deliberately gives an AI recommendation system misleading feedback during training, gradually causing it to favor their preferred outputs without ever triggering an alarm. This is:",
          ["Data poisoning","Model skewing","Prompt injection","Model theft"],1,
          "Model skewing is the slow, feedback-driven bias attack — distinct from data poisoning, which corrupts the training set directly.",2),
        q("An attacker never directly queries a model's weights, but infers its proprietary decision logic purely from the detailed confidence scores returned with every prediction. This is best described as:",
          ["Indirect model theft","Membership inference","Insecure output handling","Model DoS"],0,
          "Indirect model theft extracts proprietary behavior through exposed metadata like confidence scores, without directly exfiltrating the model.",2),
        q("A stop sign is subtly altered with stickers so that a computer-vision model classifies it as a yield sign. This is:",
          ["Model poisoning","Input manipulation","Model inversion","Excessive agency"],1,
          "Input manipulation crafts adversarial inputs to cause misclassification at inference time — the model itself is untouched.",2),
        q("A hospital's AI triage model occasionally misclassifies urgent cases, and clinicians act on its recommendations without independently verifying them. Which risk does the second half of this scenario illustrate?",
          ["Excessive agency","Overreliance","Model inversion","Data poisoning"],1,
          "Overreliance is a human failing to verify model output before acting on it — distinct from excessive agency, which is about what the model/agent itself is permitted to do.",2)
      ]},

    {id:'d4b1', time:'08:15–09:45', dur:'1h30m', type:'lecture', obj:'3.1', title:'AI-Enabled Tools for Security Tasks',
      body:`<h4>Tool landscape</h4>
      <ul>
        <li>IDE, browser, and CLI plug-ins that embed AI assistance into existing workflows</li>
        <li>Chatbots and personal assistants for analyst-facing Q&A and triage support</li>
        <li><b>Model Context Protocol (MCP) servers</b> — a current, exam-relevant way AI assistants connect to external tools/data sources in a standardized way (you're literally using one right now)</li>
      </ul>
      <h4>Use cases the exam cares about</h4>
      <ul>
        <li><b>Anomaly detection</b> — flags individual events that deviate from a learned baseline (e.g., a login at 3 a.m. from an unusual location)</li>
        <li><b>Pattern recognition</b> — a distinct, higher-level capability: correlates multiple seemingly benign events across time to surface a coordinated attack that no single event would trigger an alert for</li>
        <li>Vulnerability analysis, automated penetration testing</li>
        <li>Incident management and threat modeling support</li>
        <li>Fraud detection</li>
        <li>Summarization (turning huge logs/alerts into readable analyst summaries)</li>
      </ul>
      <p><b>Exam angle:</b> questions pair a task with the right tool category — "an analyst needs a fast way to summarize a week of SIEM alerts" points to summarization/chatbot tooling, not automated pentesting. Don't confuse anomaly detection (single deviant event) with pattern recognition (correlating many small, individually-normal events into one coordinated picture) — this exact distinction has appeared as a direct compare/contrast question.</p>`,
      terms:['MCP servers','Anomaly detection','Pattern recognition','Automated pentesting','Fraud detection','Summarization'],
      quiz:[
        q("A standardized protocol that lets an AI assistant connect to external tools and data sources is best described as:",
          ["A GAN","Model Context Protocol (MCP)","A prompt firewall","RAG"],1,"MCP standardizes how AI assistants connect to external tools/data — a current, exam-relevant concept.",3),
        q("Over a week, an AI tool notices the same external IP slowly accessing multiple servers with valid credentials, extracting small amounts of data from each — no single event triggers an alert, but the combined activity suggests a stealthy attack. This capability is:",
          ["Anomaly detection","Pattern recognition","Signature matching","Fraud detection"],1,
          "Pattern recognition correlates multiple individually-benign events into one coordinated finding, distinct from anomaly detection's single-event deviation.",3)
      ]},

    {id:'d4b3', time:'10:00–11:30', dur:'1h30m', type:'lecture', obj:'3.2', title:'How AI Enables or Enhances Attack Vectors',
      body:`<h4>Offense-side concepts (conceptual/"explain" objective — expect recognition, not simulation). This objective got a full dedicated chapter in the official study guide — treat it accordingly, it's not a throwaway.</h4>
      <ul>
        <li><b>Deepfakes</b> — AI-generated synthetic media used for impersonation (voice/video)</li>
        <li><b>Misinformation vs. disinformation</b> — misinformation is <i>unintentionally</i> spreading false content (people sharing something believing it's real); disinformation is a <i>deliberate</i>, organized attempt to manipulate opinion. Same content, different intent — the exam tests whether you catch which one a scenario describes</li>
        <li><b>Adversarial networks (GANs) used offensively</b> — attackers use GAN-produced content to evade AI detectors, poison models, or trick decision systems with adversarial patches</li>
        <li><b>AI-accelerated reconnaissance and social engineering</b> — automating target research and crafting highly personalized phishing/pretexting at scale</li>
        <li><b>Obfuscation and polymorphic malware</b> — AI rewrites malicious code into endless unique variants that evade signature detection. Named real-world examples: <b>WormGPT</b> and <b>FraudGPT</b> (malicious LLMs built for generating phishing emails and malware scripts), and <b>BlackMamba</b> (malware with no malicious code visible in static analysis — it queries an LLM at runtime to generate a fresh keylogger on the fly)</li>
        <li><b>Automated data correlation</b> — attackers using AI to stitch together disparate leaked/public data into actionable intelligence, prioritizing the most exploitable targets</li>
        <li><b>Automated attack generation</b> — AI agents automate an entire intrusion end-to-end: scanning, exploit selection, and execution, letting unskilled attackers run multistep campaigns without writing code</li>
        <li><b>AI-powered honeypot detection and evasion</b> — attackers use ML to analyze service responses and identify honeypots before engaging. The reverse also happens: attackers build convincing fake honeypots of their own to harvest credentials or malware from researchers</li>
        <li><b>AI-powered DDoS</b> — AI-driven botnets analyze live traffic conditions and adapt in real time — shifting ports, packet types, and timing based on feedback, making them far harder to block with static rule sets than a traditional DDoS</li>
      </ul>
      <p><b>Exam angle:</b> a described incident ("the CFO received a video call that looked and sounded exactly like the CEO authorizing a wire transfer") should trigger immediate recognition: deepfake-enabled impersonation. A viral AI-generated image causing panic with no organized campaign behind it is misinformation; the same image pushed deliberately by a coordinated actor is disinformation — read for intent, not just content.</p>`,
      terms:['Deepfakes','Misinformation','Disinformation','WormGPT','FraudGPT','BlackMamba','AI-accelerated recon','Obfuscation','Automated data correlation','Automated attack generation','AI-powered DDoS','Honeypot evasion'],
      quiz:[
        q("A finance employee receives a highly convincing video call appearing to be the CEO, requesting an urgent wire transfer. This attack is most accurately described as:",
          ["Model inversion","Deepfake-enabled impersonation","Data poisoning","Model theft"],1,
          "Synthetic video/voice impersonation used to manipulate a person is deepfake-enabled impersonation.",3),
        q("An AI-generated image of a bridge collapse goes viral and causes panic, but no organized campaign is behind it — people simply believed it was real and shared it. This is:",
          ["Disinformation","Misinformation","Deepfake impersonation","Model inversion"],1,
          "No deliberate coordinated intent = misinformation. The same content pushed intentionally by an organized actor would be disinformation.",3),
        q("Malware is found to contain no malicious instructions under static analysis, but at runtime it queries an LLM to generate a fresh keylogger. This defensive challenge best represents:",
          ["Polymorphic malware","A missing digital signature","Legacy software risk","Unencrypted communication"],0,
          "This is the BlackMamba pattern — AI-generated payloads at runtime evade static signature detection, a form of polymorphic malware.",3),
        q("A botnet dynamically shifts its target ports, packet types, and timing based on real-time traffic feedback during an attack, evading static block lists. This is:",
          ["Automated data correlation","AI-powered DDoS","Model denial of service","Automated attack generation"],1,
          "AI-powered DDoS specifically adapts attack parameters in real time based on live conditions, unlike a traditional static-pattern DDoS.",3)
      ]},

    {id:'d4b5', time:'12:30–14:00', dur:'1h30m', type:'lecture', obj:'3.3', title:'Using AI to Automate Security Tasks',
      body:`<h4>Automation in practice</h4>
      <ul>
        <li><b>Three tiers, not two</b> — <b>no-code</b> platforms use only visual/natural-language interfaces with zero scripting; <b>low-code</b> platforms allow some scripting for flexibility on top of visual tools; full <b>scripting</b> environments give complete programmatic control. AI lowers the barrier at every tier by generating scripts from natural language</li>
        <li>Document synthesis (turning raw findings into polished reports — sound familiar?)</li>
        <li>Incident-ticket management and triage automation</li>
        <li>AI-assisted change management — assessing proposed changes, auto-approving routine updates, recommending rollbacks, monitoring for unexpected behavior during deployment</li>
        <li>AI agents performing multi-step security work autonomously — the key differentiator from a plain automation script: an agent can plan, adapt, and act independently within its guardrails, not just follow a fixed predetermined sequence</li>
        <li><b>AI in CI/CD pipelines</b> — intelligent code scanning, software composition analysis (SCA), dependency analysis, unit/regression test generation, and model testing gates before deployment</li>
        <li><b>Static vs. dynamic code analysis</b> — static analysis examines code without running it (spotting insecure patterns, hardcoded secrets); dynamic analysis observes the application's actual live behavior. Both show up in AI-assisted CI/CD pipelines</li>
        <li><b>Automated rollback</b> — a distinct CI/CD capability: AI monitors live performance metrics after deployment and automatically reverts to the prior version if error rates or response times spike, alerting the team</li>
      </ul>
      <p><b>Exam angle:</b> if you've never watched an AI agent triage a ticket queue or gate a CI/CD pipeline on a failed model test, this is the section to review with extra care. Watch for the "no-code has zero scripting, low-code allows some" distinction specifically — it's a clean either/or the exam likes to test.</p>`,
      terms:['No-code','Low-code','Scripting','Document synthesis','AI-assisted change management','AI agents','CI/CD code scanning','SCA','Static analysis','Dynamic analysis','Automated rollback'],
      quiz:[
        q("A CI/CD pipeline automatically blocks a deployment when a new model version fails an automated bias/accuracy test gate. This is an example of:",
          ["Excessive agency","AI in CI/CD (model testing gate)","Model denial of service","Data poisoning"],1,
          "Automated model-testing gates inside CI/CD pipelines are a core AI-assisted security automation use case.",3),
        q("Which correctly distinguishes no-code from low-code automation platforms?",
          ["No-code platforms are inherently AI-driven, low-code is not","Low-code platforms allow some scripting for flexibility; no-code platforms use only visual/natural-language interfaces with no scripting at all","No-code always performs faster than low-code","Low-code cannot integrate AI assistants"],1,
          "No-code = zero scripting, visual/NL only. Low-code = visual tools plus some scripting flexibility.",3),
        q("Shortly after a new deployment, an AI system detects a sharp rise in error rates and response times, automatically reverts to the prior version, and alerts DevOps and security. This capability is:",
          ["Static code analysis","Automated rollback","Unit testing","Dynamic code analysis"],1,
          "Automated rollback is the CI/CD capability of monitoring live post-deploy metrics and automatically reverting on failure.",3),
        q("What differentiates an AI agent from a traditional automation script in a security context?",
          ["Agents always require human approval before any action","Scripts use machine learning; agents do not","An agent can plan, adapt, and act independently within its scope rather than following a fixed sequence","Agents cannot be used in CI/CD pipelines"],2,
          "The defining trait of an agent vs. a script is autonomous planning/adaptation within guardrails, not just fixed rule-following.",3)
      ]},

    {id:'d4b7', time:'14:15–15:15', dur:'1h', type:'lecture', obj:'4.1', title:'Governance Structures That Support AI',
      body:`<h4>Three governance structures (not just one — this was previously under-covered)</h4>
      <ul>
        <li><b>Centralized Center of Excellence (CoE)</b> — one team sets standards, manages the platform, and supports project teams directly</li>
        <li><b>Hub-and-spoke</b> — as programs mature, many shift here: the CoE (hub) provides shared resources/oversight while business units (spokes) drive their own execution</li>
        <li><b>Embedded</b> — AI roles live fully inside product teams with only a light central coordination layer. Trade-off: faster delivery, but higher risk of duplicate effort and inconsistent controls across teams</li>
        <li><b>AI policies and procedures</b> — the formal documented rules governing acceptable AI use, development, and deployment</li>
      </ul>
      <h4>Roles (know who does what — match-the-responsibility questions)</h4>
      <ul>
        <li><b>Data scientist</b> — builds/analyzes models and data pipelines</li>
        <li><b>Data engineer</b> — a distinct role from data scientist: builds/maintains the data pipelines themselves, owns data quality and data lineage for training datasets</li>
        <li><b>AI architect</b> — designs the end-to-end AI system architecture, including model type choices and integration approach</li>
        <li><b>ML engineer</b> — builds/productionizes ML models and pipelines</li>
        <li><b>MLOps engineer</b> — owns the operational deployment/monitoring pipeline for models (the ML equivalent of DevOps)</li>
        <li><b>AI security architect</b> — designs security controls specific to AI systems</li>
        <li><b>AI governance engineer</b> — implements governance tooling/processes</li>
        <li><b>AI risk analyst</b> — assesses/quantifies AI-related risk, conducts privacy impact assessments before project approval</li>
        <li><b>AI auditor</b> — independently reviews AI systems for compliance/quality</li>
      </ul>
      <p><b>Exam angle:</b> "who is responsible for X" questions are common — e.g., ongoing model monitoring/deployment pipeline health = MLOps engineer; independent compliance review = AI auditor; data pipeline quality and lineage specifically (not model-building) = data engineer, not data scientist. On structure questions, "fully decentralized with minimal central coordination" is describing the embedded model and its main risk is duplicate/inconsistent controls, not slow delivery.</p>`,
      terms:['AI Center of Excellence','Hub-and-spoke','Embedded model','Data engineer','MLOps engineer','AI security architect','AI governance engineer','AI risk analyst','AI auditor'],
      quiz:[
        q("Which role is most directly responsible for the operational health of a model's deployment and monitoring pipeline?",
          ["AI auditor","MLOps engineer","AI risk analyst","Data scientist"],1,
          "MLOps engineers own operational deployment/monitoring — the ML equivalent of DevOps.",4),
        q("An organization embeds AI developers directly within each product team with minimal central coordination. Which risk does this structure carry?",
          ["Excessive oversight slowing every project","Duplicate efforts and inconsistent controls across teams","Overreliance on a single Center of Excellence","Reduced ability to move quickly"],1,
          "The embedded model trades central consistency for speed — its main risk is duplicated effort and inconsistent controls, not slowness.",4),
        q("A team member builds and maintains data pipelines, ensures data quality, and manages data lineage for AI training datasets. This role is:",
          ["Data scientist","Data engineer","MLOps engineer","AI architect"],1,
          "Data engineer is distinct from data scientist — pipeline/quality/lineage ownership is the data engineer's job specifically.",4)
      ]},

    {id:'d5b1', time:'08:15–09:15', dur:'1h', type:'lecture', obj:'4.2', title:'Risks Associated with AI',
      body:`<h4>Responsible-AI principles (the "why" behind every risk below)</h4>
      <ul>
        <li>Fairness, reliability &amp; safety, transparency, privacy, explainability, inclusiveness, accountability, and <b>consistency</b> — eight principles total (consistency is the one most study materials leave off the list, and it means the model behaves predictably given similar inputs, not just accurately)</li>
      </ul>
      <h4>Practical risk list</h4>
      <ul>
        <li><b>Bias introduction</b> — model outputs systematically disadvantage a group</li>
        <li><b>Accidental data leakage</b> — sensitive data unintentionally surfaced in output</li>
        <li><b>Reputational damage</b> — public-facing AI failures damaging brand trust</li>
        <li><b>Model accuracy drift</b> — performance degrading over time as real-world data shifts from training data</li>
        <li><b>IP risk</b> — training on or generating content that infringes intellectual property</li>
        <li><b>Autonomous-system risk</b> — risk introduced specifically by systems acting without direct human control</li>
        <li><b>Shadow AI</b> — unsanctioned AI tool use inside the business, the modern version of shadow IT, and an easy scenario for exam writers (an employee pastes confidential data into a public chatbot the company never approved)</li>
      </ul>
      <p><b>Exam angle:</b> memorize "shadow AI" by name — it's a near-guaranteed appearance and easy to mix up with sanctioned/unsanctioned tooling from 4.3 below.</p>`,
      terms:['Bias introduction','Model accuracy drift','IP risk','Autonomous-system risk','Shadow AI'],
      quiz:[
        q("An employee pastes confidential contract terms into a free public AI chatbot that was never approved by IT. This is best described as:",
          ["Model accuracy drift","Shadow AI","Membership inference","Data poisoning"],1,
          "Unsanctioned AI tool use inside the business is shadow AI — the modern equivalent of shadow IT.",4)
      ]},

    {id:'d5b2', time:'09:15–10:15', dur:'1h', type:'lecture', obj:'4.3', title:'Compliance Impact on AI Use & Development',
      body:`<h4>Regulatory map (know which applies where, not the statute text)</h4>
      <ul>
        <li><b>EU AI Act</b> — the only <i>legally binding</i> regulation on this list; risk-tiered for AI systems touching the EU market. Four tiers, worth knowing by name: <b>unacceptable risk</b> (prohibited outright — e.g., social scoring systems), <b>high risk</b> (heavy obligations: documentation, transparency, human oversight, impact assessments), <b>limited risk</b> (lighter obligations — e.g., a general chatbot must disclose it's AI and offer a path to a human), <b>minimal risk</b> (no special obligations)</li>
        <li><b>NIST AI Risk Management Framework (AI RMF)</b> — U.S. voluntary (not legally binding) framework for managing AI risk (govern/map/measure/manage functions)</li>
        <li><b>ISO AI standards</b> — international standards for AI management systems, risk, safety, and system life cycles</li>
        <li><b>OECD AI standards</b> — international principles for trustworthy AI (transparency, robustness, accountability)</li>
      </ul>
      <h4>Corporate AI policy document hierarchy (a real distinction the exam tests — don't treat these as interchangeable)</h4>
      <ul>
        <li><b>Policy</b> — the top-level statement of what's allowed and why (e.g., "AI tools must not process unencrypted customer data")</li>
        <li><b>Standard</b> — the specific, measurable bar every implementation must meet ("data must be encrypted before use in any AI training")</li>
        <li><b>Procedure</b> — the step-by-step "how" for meeting the standard</li>
        <li><b>Guideline</b> — recommended but flexible/non-mandatory practice</li>
      </ul>
      <h4>Corporate-policy dimensions</h4>
      <ul>
        <li>Sanctioned vs. unsanctioned tools (ties directly to shadow AI above)</li>
        <li>Private vs. public models — a company choosing between a public AI service and an in-house model for sensitive customer data is making a private-vs-public-model decision specifically, distinct from the sanctioned/unsanctioned question</li>
        <li>Sensitive-data governance for AI-connected systems</li>
        <li>Third-party compliance evaluations before adopting vendor AI tools</li>
        <li>Data sovereignty — where data physically resides and which jurisdiction's law applies</li>
      </ul>
      <p><b>Exam angle:</b> you don't need statute-level memorization — you need to know which framework/category applies to a described situation ("a US federal contractor needs a structured way to govern AI risk" → NIST AI RMF; "which of these is legally binding" → EU AI Act, the others are voluntary/international-principle frameworks). A scenario naming a specific document ("Data should be encrypted before being used in any AI training") that reads like a measurable bar is describing a standard, not a policy.</p>`,
      terms:['EU AI Act','Unacceptable risk','High risk','NIST AI RMF','ISO AI standards','OECD standards','Policy','Standard','Procedure','Guideline','Data sovereignty'],
      quiz:[
        q("A US-based organization wants a voluntary, structured framework to govern, map, measure, and manage AI risk. Which is the best fit?",
          ["EU AI Act","NIST AI Risk Management Framework","OECD standards","ISO 27001"],1,"NIST AI RMF is the US voluntary framework built around govern/map/measure/manage functions.",4),
        q("Which of the following is the only legally binding regulation focused specifically on AI?",
          ["NIST AI RMF","OECD AI guidelines","ISO AI standards","EU AI Act"],3,
          "The EU AI Act is legally binding; NIST RMF, OECD, and ISO are voluntary/international-principle frameworks.",4),
        q("Under the EU AI Act's risk tiers, a government social scoring system would most likely be classified as:",
          ["Minimal risk","Limited risk","High risk","Unacceptable risk (prohibited)"],3,
          "Social scoring systems are a named example of the EU AI Act's unacceptable-risk tier, which is prohibited outright.",4),
        q("An internal document states: 'Data should be encrypted before being used in any AI training.' What type of document most likely contains this sentence?",
          ["Policy","Standard","Procedure","Guideline"],1,
          "A specific, measurable, mandatory bar like this is a standard — the step-by-step how-to would be the procedure.",4),
        q("A company must decide between using a publicly available AI service or developing a model in-house for analyzing sensitive customer data. This decision most directly relates to:",
          ["Sanctioned vs. unsanctioned AI tools","Private vs. public AI model usage","Data minimization","Incident response planning"],1,
          "This is specifically the private-vs-public-model policy dimension, not the sanctioned/unsanctioned tools question.",4)
      ]},

 {d:2,t:"Agent access control",def:"Governs what an autonomous AI agent is permitted to touch, execute, or call on its own."},
 {d:2,t:"Encryption in use",def:"Protecting data while actively processed in memory — e.g., confidential computing/secure enclaves."},

 {d:2,t:"Redaction",def:"Permanently removing sensitive elements from a document or output."},

 {d:2,t:"Prompt injection",def:"Malicious instructions smuggled into input to override intended model behavior."},

/* ============================== STATE ============================== */
const STORE_KEY = 'secai-bootcamp-progress-v1';
let STATE = {
  blocksDone:{},          // blockId -> true
  objRatings:{},          // '1.1' -> 1..3
  quizAnswers:{},         // blockId+qi -> chosenIdx
  fcIndex:0,
  fcDomainFilter:'all',
  matchState:{},          // attack text -> matched bool
  matchScore:0,
  examState:null,         // {answers:{}, flagged:{}, startedAt, duration, submitted}
};
let CURRENT_VIEW = 'day1';
let OPEN_BLOCK = null;

async function loadState(){
  try{
    const r = await window.storage.get(STORE_KEY, false);
    if(r && r.value){ STATE = Object.assign(STATE, JSON.parse(r.value)); }
  }catch(e){ /* no saved state yet */ }
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    try{ await window.storage.set(STORE_KEY, JSON.stringify(STATE), false); }catch(e){}
  },250);
}

/* ============================== PROGRESS CALC ============================== */
function allBlocks(){ return DAYS.flatMap(d=>d.blocks); }
function contentBlocks(){ return allBlocks().filter(b=>b.type!=='admin'); }

function domainBlockIds(domainNum){
  const ids=[];
  DAYS.forEach(d=>{ if(d.domainFocus===domainNum){ d.blocks.forEach(b=>{ if(b.type!=='admin') ids.push(b.id); }); } });
  return ids;
}
function domainPct(domainNum){
  const ids=domainBlockIds(domainNum);
  if(!ids.length) return 0;
  const done=ids.filter(id=>STATE.blocksDone[id]).length;
  return Math.round((done/ids.length)*100);
}
function overallPct(){
  const cb=contentBlocks();
  if(!cb.length) return 0;
  const done=cb.filter(b=>STATE.blocksDone[b.id]).length;
  return Math.round((done/cb.length)*100);
}
function dayPct(day){
  const cb=day.blocks.filter(b=>b.type!=='admin');
  if(!cb.length) return 100;
  const done=cb.filter(b=>STATE.blocksDone[b.id]).length;
  return Math.round((done/cb.length)*100);
}

  ring.style.background = 'conic-gradient('+col+' '+(pct*3.6)+'deg, #1A2740 0deg)';

  const barsEl=document.getElementById('domainBars');

  const nav=document.getElementById('navlist');
  nav.innerHTML='';

  DAYS.forEach(d=>{

/* ============================== RENDER: QUIZ WIDGET ============================== */
function renderQuiz(qObj, uid){
  const saved = STATE.quizAnswers[uid];
  const wrap=document.createElement('div');
  wrap.className='qcard';
  const qt=document.createElement('div'); qt.className='qtext'; qt.textContent=qObj.text; wrap.appendChild(qt);
  qObj.opts.forEach((optText,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=optText;
    if(saved!=null){
      b.disabled=true;
      if(i===qObj.correctIdx) b.classList.add('correct');
      else if(i===saved) b.classList.add('wrong');
    }
    b.onclick=()=>{
      if(STATE.quizAnswers[uid]!=null) return;
      STATE.quizAnswers[uid]=i; saveState();
      renderQuizButtons(wrap, qObj, uid);
    };
    wrap.appendChild(b);
  });
  const ex=document.createElement('div'); ex.className='explain'+(saved!=null?' show':'');
  ex.textContent=qObj.explain||'';
  wrap.appendChild(ex);
  return wrap;
}
function renderQuizButtons(wrap, qObj, uid){
  const opts=wrap.querySelectorAll('.opt');
  const saved=STATE.quizAnswers[uid];
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===qObj.correctIdx) b.classList.add('correct');
    else if(i===saved) b.classList.add('wrong');
  });
  wrap.querySelector('.explain').classList.add('show');
}

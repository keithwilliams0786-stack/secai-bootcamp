let PIPE={phase:'intro', hints:false};
function pipeTime(i){ return Math.max(8, 15 - i*0.5); }
function startPipeline(){
  const hints=PIPE.hints;
  PIPE={phase:'play', hints:hints, queue:gShuffle(PIPE_THREATS), idx:0, lives:3, score:0, streak:0, bestStreak:0, answered:false, chosen:null, fb:'', gain:0, newBest:false, hits:0};
  PIPE.timePer=pipeTime(0); PIPE.timeLeft=PIPE.timePer;
  SFX.play('click'); renderPipeline(); startPipeTimer();
}
function startPipeTimer(){
  stopGameTimers();
  GAME_KEYHANDLER=e=>{
    if(PIPE.phase!=='play') return;
    if(!PIPE.answered && e.key>='1' && e.key<='5'){ answerPipe(PIPE_LAYERS[+e.key-1].k); }
    else if(PIPE.answered && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); nextPipe(); }
  };
  GAME_TIMER=setInterval(()=>{
    if(PIPE.phase!=='play'||PIPE.answered) return;

    const tt=document.getElementById('pipeTime'); if(tt) tt.textContent=PIPE.timeLeft.toFixed(1)+'s';
    if(PIPE.timeLeft<=0) answerPipe(null);
  },100);

function answerPipe(k){
  if(PIPE.answered) return;
  const th=PIPE.queue[PIPE.idx];
  PIPE.answered=true; PIPE.chosen=k;
  if(k===th.layer){
    PIPE.streak++; PIPE.hits++; PIPE.bestStreak=Math.max(PIPE.bestStreak,PIPE.streak);
    const gain=100+Math.round(PIPE.timeLeft/PIPE.timePer*100)+Math.min(PIPE.streak-1,5)*20;
    PIPE.score+=gain; PIPE.gain=gain; PIPE.fb='ok'; SFX.play('correct');
  } else {
    PIPE.lives--; PIPE.streak=0; PIPE.gain=0; PIPE.fb=(k===null?'timeout':'bad');
    SFX.play(PIPE.lives<=0?'lose':'wrong');
  }
  renderPipeline();
}
function nextPipe(){
  if(PIPE.lives<=0 || PIPE.idx>=PIPE.queue.length-1){
    PIPE.phase='over'; PIPE.newBest=setBest('pipelineBest',PIPE.score);
    if(PIPE.lives>0) SFX.play('win');
    stopGameTimers(); renderPipeline(); return;
  }
  PIPE.idx++; PIPE.answered=false; PIPE.chosen=null; PIPE.fb='';
  PIPE.timePer=pipeTime(PIPE.idx); PIPE.timeLeft=PIPE.timePer;

}

/* ============================== GAME 2: JEOPARDY ============================== */
let JEO=null;
function jeoMakeFcClue(f){
  const esc=f.t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const masked=f.def.replace(new RegExp(esc,'ig'),'_____');
  const dis=gShuffle(FLASHCARDS.filter(x=>x.d===f.d && x.t!==f.t)).slice(0,3).map(x=>x.t);
  const opts=gShuffle([f.t].concat(dis));
  return {text:masked, opts:opts, correct:opts.indexOf(f.t), explain:f.t+' — '+f.def, len:masked.length};
}
function jeoMakeQClue(x){
  const order=gShuffle(x.opts.map((o,i)=>i));
  return {text:x.text, opts:order.map(i=>x.opts[i]), correct:order.indexOf(x.correctIdx), explain:x.explain};
}
function jeoNew(){
  const used=new Set();
  const cols=[1,2,3,4].map(dn=>{
    const fc=gShuffle(FLASHCARDS.filter(f=>f.d===dn)).slice(0,3).map(jeoMakeFcClue).sort((a,b)=>a.len-b.len);
    const qs=gShuffle(EXAM_BANK.filter(x=>x.domain===dn)).slice(0,2);
    qs.forEach(x=>used.add(x.text));
    return {dn:dn, clues:fc.concat(qs.map(jeoMakeQClue))};
  });
  const pool=gShuffle(EXAM_BANK.filter(x=>x.domain===2 && !used.has(x.text)));
  JEO={cols:cols, used:{}, score:0, dd:{c:Math.floor(Math.random()*4), r:1+Math.floor(Math.random()*4)},
       phase:'board', cur:null, wager:0, answered:false, chosen:null, right:0, finalQ:jeoMakeQClue(pool[0]), newBest:false};
}
function jeoPick(c,r){
  if(JEO.used[c+'-'+r]) return;
  const isDD=(JEO.dd.c===c && JEO.dd.r===r);
  JEO.cur={c:c, r:r, clue:JEO.cols[c].clues[r], value:(r+1)*100, dd:isDD, final:false};
  JEO.answered=false; JEO.chosen=null;
  if(isDD){ JEO.phase='wager'; SFX.play('dd'); } else { JEO.phase='clue'; SFX.play('click'); }
  renderJeopardy();
}
function jeoSetWager(n){ JEO.wager=n; JEO.phase='clue'; SFX.play('click'); renderJeopardy(); }
function jeoAnswer(i){
  if(JEO.answered) return;
  JEO.answered=true; JEO.chosen=i;
  const stake = JEO.cur.final||JEO.cur.dd ? JEO.wager : JEO.cur.value;
  if(i===JEO.cur.clue.correct){ JEO.score+=stake; JEO.right++; SFX.play('correct'); }
  else { JEO.score-=stake; SFX.play('wrong'); }
  if(!JEO.cur.final) JEO.used[JEO.cur.c+'-'+JEO.cur.r]=true;
  renderJeopardy();
}
function jeoContinue(){
  if(JEO.cur.final){ JEO.phase='done'; JEO.newBest=setBest('jeopardyBest',JEO.score); SFX.play('win'); renderJeopardy(); return; }
  if(Object.keys(JEO.used).length>=20){
    if(JEO.score>0){ JEO.phase='finalwager'; SFX.play('dd'); }
    else { JEO.phase='done'; JEO.newBest=setBest('jeopardyBest',JEO.score); }
  } else { JEO.phase='board'; SFX.play('click'); }
  renderJeopardy();
}
function jeoStartFinal(w){
  JEO.wager=w;
  JEO.cur={c:1, r:0, clue:JEO.finalQ, value:w, dd:false, final:true};
  JEO.answered=false; JEO.chosen=null; JEO.phase='clue'; SFX.play('click'); renderJeopardy();
}
function renderJeopardy(){
  if(!JEO) jeoNew();
  const main=gameHeader('Jeopardy Board','Four domains, five values. Wrong answers cost you the points, so read carefully. One tile hides a Daily Double.',
    ['SCORE: '+gMoney(JEO.score), 'BEST: '+gMoney(getBest('jeopardyBest'))]);
  const cats=[1,2,3,4].map(n=>DOMAINS[n].short);

  if(JEO.phase==='board'){
    const board=gEl('div','jeo-board');
    cats.forEach(c=>board.appendChild(gEl('div','jeo-head',c)));
    for(let r=0;r<5;r++){
      for(let c=0;c<4;c++){
        const used=!!JEO.used[c+'-'+r];
        const t=gEl('div','jeo-tile'+(used?' used':''), used?'':'$'+((r+1)*100));
        if(!used) t.onclick=()=>jeoPick(c,r);
        board.appendChild(t);
      }
    }
    main.appendChild(board);
    main.appendChild(gEl('div','g-stat','Tiles left: '+(20-Object.keys(JEO.used).length)+' · Rows 1–3 are term definitions, rows 4–5 are exam-style scenarios · Final Jeopardy follows the last tile.'));
    main.appendChild(document.createElement('br'));
    main.appendChild(gBtn('New board','',()=>{ jeoNew(); renderJeopardy(); }));
    return;
  }

  if(JEO.phase==='wager' || JEO.phase==='finalwager'){
    const isFinal = JEO.phase==='finalwager';
    const maxW = isFinal ? JEO.score : Math.max(JEO.score,500);
    const c=gEl('div','jeo-clue');
    c.appendChild(gEl('div','cat', isFinal?'Final Jeopardy':'Daily Double!'));
    c.appendChild(gEl('div','txt', isFinal?'Category: Securing AI Systems. How much of your '+gMoney(JEO.score)+' will you risk?':'Category: '+cats[JEO.cur.c]+'. Choose your wager (max $'+maxW+').'));
    main.appendChild(c);
    let opts = isFinal ? [0, Math.round(maxW/2/50)*50, maxW] : [100,250,500,maxW];
    opts=Array.from(new Set(opts.filter(v=>v>=0 && v<=maxW))).sort((a,b)=>a-b);
    const row=gEl('div','g-row');
    opts.forEach(v=>row.appendChild(gBtn('$'+v, v===maxW?'primary big':'big', ()=> isFinal?jeoStartFinal(v):jeoSetWager(v))));
    main.appendChild(row);
    return;
  }

  if(JEO.phase==='clue'){
    const cur=JEO.cur;
    const c=gEl('div','jeo-clue');
    const cat = cur.final ? 'Final Jeopardy · wager $'+JEO.wager : cats[cur.c]+' · '+(cur.dd?'Daily Double · wager $'+JEO.wager:'$'+cur.value);
    c.appendChild(gEl('div','cat',cat));
    c.appendChild(gEl('div','txt',cur.clue.text));
    main.appendChild(c);
    cur.clue.opts.forEach((o,i)=>{
      const b=gEl('button','g-opt',String.fromCharCode(65+i)+'.  '+o);
      if(JEO.answered){
        b.disabled=true;
        if(i===cur.clue.correct) b.classList.add('right');
        else if(i===JEO.chosen) b.classList.add('wrong');
      } else b.onclick=()=>jeoAnswer(i);
      main.appendChild(b);
    });
    if(JEO.answered){
      const ok=(JEO.chosen===cur.clue.correct);
      const stake=cur.final||cur.dd?JEO.wager:cur.value;
      const fb=gEl('div','g-fb '+(ok?'ok':'bad'));
      fb.appendChild(gEl('b',null,(ok?'Correct! +$':'Incorrect. -$')+stake+'. '));
      fb.appendChild(document.createTextNode(cur.clue.explain));
      main.appendChild(fb);
      main.appendChild(gBtn(cur.final?'See final score →':'Continue →','primary big',jeoContinue));
    }
    return;
  }

  if(JEO.phase==='done'){
    const s=JEO.score;
    const rating = s>=4500?'Champion — you own this material':s>=3000?'Contender — solid, tighten the gaps':s>=1500?'Rookie — keep drilling flashcards':'Back to the flashcards — then come back';
    const c=gEl('div','g-card');
    c.appendChild(gEl('h3',null,'Game over — final score '+gMoney(s)+(JEO.newBest?' · NEW PERSONAL BEST':'')));
    c.appendChild(gEl('p',null,rating+'. Clues answered correctly: '+JEO.right+'.'));
    c.appendChild(gBtn('Play a new board','primary big',()=>{ jeoNew(); renderJeopardy(); }));
    main.appendChild(c);
  }
}

let WHEEL=null;
function wheelNew(){
  const pool=gShuffle(FLASHCARDS.filter(f=>f.t.length<=24 && (f.t.match(/[A-Za-z]/g)||[]).length>=4));
  WHEEL={round:0, words:pool.slice(0,5), total:0, angle:0, newBest:false, solvedCount:0};
  wheelStartRound();
}
function wheelStartRound(){
  const f=WHEEL.words[WHEEL.round];
  WHEEL.card=f; WHEEL.word=f.t.toUpperCase();
  WHEEL.guessed=new Set(); WHEEL.wrong=0; WHEEL.maxWrong=6; WHEEL.bank=0;
  WHEEL.phase='spin'; WHEEL.pending=0; WHEEL.msg='Spin the wheel to start the round.'; WHEEL.solved=false;
}
function wheelMasked(){
  const esc=WHEEL.card.t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return WHEEL.card.def.replace(new RegExp(esc,'ig'),'_____');
}
function wheelLetters(){ return Array.from(new Set(WHEEL.word.split('').filter(ch=>/[A-Z]/.test(ch)))); }
function wheelAllRevealed(){ return wheelLetters().every(ch=>WHEEL.guessed.has(ch)); }
function wheelSpin(){
  if(WHEEL.phase!=='spin') return;
  WHEEL.phase='spinning'; WHEEL.msg='Spinning…';
  const idx=Math.floor(Math.random()*WHEEL_WEDGES.length);
  const off=(Math.random()*20)-10;
  const target=idx*30+15+off;
  const cur=((WHEEL.angle%360)+360)%360;
  const delta=(((-target-cur)%360)+360)%360;
  WHEEL.angle=WHEEL.angle+360*4+delta;
  renderWheel();
  const svg=document.getElementById('wheelSvg');
  if(svg){ svg.style.transform='rotate('+(WHEEL.angle-360*4-delta)+'deg)'; void svg.getBoundingClientRect(); svg.style.transform='rotate('+WHEEL.angle+'deg)'; }
  let n=0; const gaps=[]; for(let i=0;i<20;i++) gaps.push(55+i*i*0.75);
  let t=0; gaps.forEach(g=>{ t+=g; setTimeout(()=>{ if(WHEEL&&WHEEL.phase==='spinning') SFX.play('tick'); }, t); });
  WHEEL_TIMEOUT=setTimeout(()=>{
    const w=WHEEL_WEDGES[idx];
    if(w.v<0){ WHEEL.bank=0; WHEEL.phase='spin'; WHEEL.msg='BANKRUPT! Round bank wiped to $0. Spin again.'; SFX.play('bankrupt'); }
    else { WHEEL.pending=w.v; WHEEL.phase='guess'; WHEEL.msg='You landed on $'+w.v+'. Pick a consonant.'; SFX.play('correct'); }
    renderWheel();
  }, 3300);
}
function wheelGuess(ch){
  if(WHEEL.guessed.has(ch)) return;
  const isV=VOWELS.indexOf(ch)>=0;
  if(WHEEL.phase==='guess' && isV) return;
  if(WHEEL.phase==='vowel' && !isV) return;
  if(WHEEL.phase!=='guess' && WHEEL.phase!=='vowel') return;
  WHEEL.guessed.add(ch);
  const count=WHEEL.word.split('').filter(c=>c===ch).length;
  if(WHEEL.phase==='vowel') WHEEL.bank-=250;
  if(count>0){
    if(WHEEL.phase==='guess'){ WHEEL.bank+=WHEEL.pending*count; WHEEL.msg=ch+' appears '+count+'× — +$'+(WHEEL.pending*count)+'.'; }
    else WHEEL.msg='Vowel '+ch+' appears '+count+'×.';
    SFX.play('correct');
  } else {
    WHEEL.wrong++; WHEEL.msg='No '+ch+'. Strike '+WHEEL.wrong+' of '+WHEEL.maxWrong+'.'; SFX.play('wrong');
  }
  WHEEL.pending=0;
  if(wheelAllRevealed()){ wheelEndRound(true, 'Board complete!'); return; }
  if(WHEEL.wrong>=WHEEL.maxWrong){ wheelEndRound(false, 'Out of strikes.'); return; }
  WHEEL.phase='spin'; renderWheel();
}
function wheelBuyVowel(){
  if(WHEEL.phase!=='spin') return;
  if(WHEEL.bank<250){ WHEEL.msg='A vowel costs $250 — you only have $'+WHEEL.bank+' this round.'; SFX.play('wrong'); renderWheel(); return; }
  if(VOWELS.split('').every(v=>WHEEL.guessed.has(v))){ WHEEL.msg='All vowels already guessed.'; renderWheel(); return; }
  WHEEL.phase='vowel'; WHEEL.msg='Pick a vowel (costs $250).'; SFX.play('click'); renderWheel();
}
function wheelSolveOpen(){ if(WHEEL.phase==='spin'){ WHEEL.phase='solve'; WHEEL.msg='Type the full term.'; SFX.play('click'); renderWheel(); } }
function wheelNorm(s){ return s.toUpperCase().replace(/[^A-Z0-9]/g,''); }
function wheelSolveSubmit(txt){
  if(wheelNorm(txt)===wheelNorm(WHEEL.word)){
    WHEEL.word.split('').forEach(ch=>{ if(/[A-Z]/.test(ch)) WHEEL.guessed.add(ch); });
    wheelEndRound(true,'Solved!');
  } else {
    WHEEL.wrong++; WHEEL.msg='Not quite. Strike '+WHEEL.wrong+' of '+WHEEL.maxWrong+'.'; SFX.play('wrong');
    if(WHEEL.wrong>=WHEEL.maxWrong){ wheelEndRound(false,'Out of strikes.'); return; }
    WHEEL.phase='spin'; renderWheel();
  }
}
function wheelEndRound(won, why){
  WHEEL.phase='roundEnd'; WHEEL.solved=won;
  if(won){ const gain=WHEEL.bank+500; WHEEL.total+=gain; WHEEL.solvedCount++; WHEEL.msg=why+' Banked $'+WHEEL.bank+' + $500 solve bonus = +$'+gain+'.'; SFX.play('win'); }
  else { WHEEL.msg=why+' You forfeit this round\'s $'+WHEEL.bank+'.'; SFX.play('lose'); }
  renderWheel();
}
function wheelNextRound(){
  if(WHEEL.round>=WHEEL.words.length-1){
    WHEEL.phase='gameEnd'; WHEEL.newBest=setBest('wheelBest',WHEEL.total); SFX.play('win');
  } else { WHEEL.round++; wheelStartRound(); SFX.play('click'); }
  renderWheel();
}
function wheelSvgMarkup(){
  const R=125, C=130, n=WHEEL_WEDGES.length, step=360/n;
  const pt=(a,r)=>{ const rad=a*Math.PI/180; return [C+r*Math.sin(rad), C-r*Math.cos(rad)]; };
  let s='<svg id="wheelSvg" class="wheel-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" style="transform:rotate('+WHEEL.angle+'deg)">';
  WHEEL_WEDGES.forEach((w,i)=>{
    const a0=i*step, a1=(i+1)*step, p0=pt(a0,R), p1=pt(a1,R);
    const fill = w.v<0 ? '#3A0F14' : (w.v===1000 ? '#B8901A' : WHEEL_COLORS[i%WHEEL_COLORS.length]);
    s+='<path d="M'+C+','+C+' L'+p0[0].toFixed(2)+','+p0[1].toFixed(2)+' A'+R+','+R+' 0 0 1 '+p1[0].toFixed(2)+','+p1[1].toFixed(2)+' Z" fill="'+fill+'" stroke="#0A0F1C" stroke-width="2"/>';
    const mid=a0+step/2;
    s+='<text transform="rotate('+mid+' '+C+' '+C+')" x="'+C+'" y="'+(C-R+30)+'" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="'+(w.v<0?9:13)+'" fill="'+(w.v<0?'#F0555A':'#fff')+'">'+w.l+'</text>';
  });
  s+='<circle cx="'+C+'" cy="'+C+'" r="14" fill="#0A0F1C" stroke="#22304F" stroke-width="2"/></svg>';
  return s;
}
function renderWheel(){
  if(!WHEEL) wheelNew();
  const pills = WHEEL.phase==='gameEnd' ? ['TOTAL: $'+WHEEL.total] :
    ['ROUND '+(WHEEL.round+1)+' / '+WHEEL.words.length, 'BANK: $'+WHEEL.bank, 'TOTAL: $'+WHEEL.total, 'BEST: $'+getBest('wheelBest')];
  const main=gameHeader('Wheel of Security','Spin, guess consonants, buy vowels, and solve the term from its definition. Five rounds.', pills);

  if(WHEEL.phase==='gameEnd'){
    const c=gEl('div','g-card');
    c.appendChild(gEl('h3',null,'Game over — total $'+WHEEL.total+(WHEEL.newBest?' · NEW PERSONAL BEST':'')));
    c.appendChild(gEl('p',null,'Terms solved: '+WHEEL.solvedCount+' of '+WHEEL.words.length+'. Missed ones are worth another pass through the flashcards.'));
    const list=gEl('ul'); WHEEL.words.forEach(w=>list.appendChild(gEl('li',null,w.t+' — '+w.def))); c.appendChild(list);
    c.appendChild(gBtn('Play again','primary big',()=>{ wheelNew(); renderWheel(); }));
    main.appendChild(c); return;
  }

  const top=gEl('div','wheel-wrap');
  const box=gEl('div','wheel-box'); box.appendChild(gEl('div','wheel-ptr'));
  const holder=gEl('div'); holder.innerHTML=wheelSvgMarkup(); box.appendChild(holder.firstChild);
  top.appendChild(box);
  const info=gEl('div'); info.style.flex='1'; info.style.minWidth='240px';
  info.appendChild(gEl('div','g-stat','CATEGORY: D'+WHEEL.card.d+' · '+DOMAINS[WHEEL.card.d].short));
  const clue=gEl('p',null,wheelMasked()); clue.style.fontSize='16px'; clue.style.lineHeight='1.55'; clue.style.margin='8px 0';
  info.appendChild(clue);
  info.appendChild(gEl('div','g-stat','Strikes: '+'✖'.repeat(WHEEL.wrong)+'○'.repeat(WHEEL.maxWrong-WHEEL.wrong)+'   ·   Vowels cost $250'));
  top.appendChild(info);
  main.appendChild(top);

  const board=gEl('div','word-board');
  const revealAll = WHEEL.phase==='roundEnd';
  WHEEL.word.split(' ').forEach(wd=>{
    const g=gEl('div','word-group');
    wd.split('').forEach(ch=>{
      let cls='wtile', txt='';
      if(!/[A-Z]/.test(ch)){ cls+=' punct'; txt=ch; }
      else if(WHEEL.guessed.has(ch)){ cls+=' shown'; txt=ch; }
      else if(revealAll){ cls+=' miss'; txt=ch; }
      else { cls+=' blank'; txt=ch; }
      g.appendChild(gEl('div',cls,txt));
    });
    board.appendChild(g);
  });
  main.appendChild(board);

  const fb=gEl('div','g-fb'+(WHEEL.phase==='roundEnd'?(WHEEL.solved?' ok':' bad'):'')); fb.textContent=WHEEL.msg; main.appendChild(fb);

  if(WHEEL.phase==='roundEnd'){
    const ex=gEl('div','g-fb'); ex.appendChild(gEl('b',null,WHEEL.card.t+' — ')); ex.appendChild(document.createTextNode(WHEEL.card.def)); main.appendChild(ex);
    main.appendChild(gBtn(WHEEL.round>=WHEEL.words.length-1?'See final score →':'Next round →','primary big',wheelNextRound));
    return;
  }

  const kb=gEl('div','kbd');
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{
    const isV=VOWELS.indexOf(ch)>=0;
    const inWord=WHEEL.word.indexOf(ch)>=0;
    const b=gEl('button','key-btn'+(isV?' vowel':''),ch);
    if(WHEEL.guessed.has(ch)){ b.disabled=true; b.classList.add(inWord?'hit':'miss'); }
    else if(WHEEL.phase==='guess') b.disabled=isV;
    else if(WHEEL.phase==='vowel') b.disabled=!isV;
    else b.disabled=true;
    b.onclick=()=>wheelGuess(ch);
    kb.appendChild(b);
  });
  main.appendChild(kb);

  const row=gEl('div','g-row');
  const spin=gBtn(WHEEL.phase==='spinning'?'Spinning…':'Spin the wheel','primary big',wheelSpin); spin.disabled=(WHEEL.phase!=='spin'); row.appendChild(spin);
  const bv=gBtn('Buy a vowel ($250)','',wheelBuyVowel); bv.disabled=(WHEEL.phase!=='spin'); row.appendChild(bv);
  const sv=gBtn('Solve','',wheelSolveOpen); sv.disabled=(WHEEL.phase!=='spin'); row.appendChild(sv);
  main.appendChild(row);

  if(WHEEL.phase==='solve'){
    const sr=gEl('div','g-row'); sr.style.marginTop='12px';
    const inp=gEl('input','g-input'); inp.type='text'; inp.placeholder='Type the term…'; inp.autocomplete='off';
    const go=()=>wheelSolveSubmit(inp.value);
    inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
    sr.appendChild(inp); sr.appendChild(gBtn('Submit','primary',go));
    sr.appendChild(gBtn('Cancel','',()=>{ WHEEL.phase='spin'; WHEEL.msg='Spin the wheel.'; renderWheel(); }));
    main.appendChild(sr);
    setTimeout(()=>inp.focus(),0);
  }

  GAME_KEYHANDLER=e=>{
    const ch=e.key.toUpperCase();
    if(ch.length===1 && ch>='A' && ch<='Z' && (WHEEL.phase==='guess'||WHEEL.phase==='vowel')) wheelGuess(ch);
    else if((e.key==='Enter'||e.key===' ') && WHEEL.phase==='spin'){ e.preventDefault(); wheelSpin(); }
  };
}



/* ============================== PBQ SIMULATOR: ARCHITECTURE CONTROLS ============================== */
const PBQ_NODES=[
  {k:'cloud', name:'Cloud control plane', ico:'☁️', need:['IAM policies','Resource policies']},
  {k:'gw',    name:'API Gateway',         ico:'🚪', need:['Connection rate limits','Authentication token validation']},
  {k:'waf',   name:'WAF',                 ico:'🧱', need:['Threat protection','Input token validation']},
  {k:'pfw',   name:'Prompt firewall',     ico:'🔥', need:['Injection policies','Guardrails']},
  {k:'model', name:'Model',               ico:'⚙️', need:['Token input quota','Modality limitations']}
];
const PBQ_OPTIONS=['Select control'].concat(gShuffle(PBQ_NODES.flatMap(n=>n.need)));
let PBQA=null;
function pbqaNew(){
  PBQA={picks:{}, checked:false, opts:gShuffle(PBQ_OPTIONS.slice(1))};
  PBQ_NODES.forEach(n=>{ PBQA.picks[n.k]=['','']; });
}
function pbqaPick(nk, slot, val){
  if(PBQA.checked) return;
  // Prevent picking the same control twice within one node — a real PBQ wouldn't let you either.
  const other=PBQA.picks[nk][slot===0?1:0];
  if(val && val===other){ renderPbqArch(); return; } // re-render to snap the dropdown back to its real (empty) value
  PBQA.picks[nk][slot]=val;
  renderPbqArch();
}
function pbqaCheck(){
  PBQA.checked=true;
  let right=0, total=0;
  PBQ_NODES.forEach(n=>{
    total+=n.need.length;
    // Grade by SET membership per node, not dropdown position — the two controls just need to be
    // the correct pair for that node, in either order. (Previously this compared slot-by-slot,
    // which wrongly marked a fully-correct node wrong if the two picks were in the other order.)
    const needSet=new Set(n.need);
    const picks=PBQA.picks[n.k];
    const nodeRight = picks.length===new Set(picks).size && picks.every(p=>needSet.has(p)) && picks.length===n.need.length;
    if(nodeRight) right+=n.need.length;
    n.nodeCorrect=nodeRight;
  });
  PBQA.right=right; PBQA.total=total;
  setBest('pbqArchBest', right);
  SFX.play(right===total?'win':(right>=total*0.7?'correct':'wrong'));
  renderPbqArch();
}
function renderPbqArch(){
  if(!PBQA) pbqaNew();
  const done = PBQA.checked;
  const main=gameHeader('PBQ Simulator — Architecture Controls',
    'Performance-based question style: assign each control to the layer where it actually belongs, edge to model.',
    done?['SCORE: '+PBQA.right+' / '+PBQA.total, 'BEST: '+getBest('pbqArchBest')+' / 10']:['BEST: '+getBest('pbqArchBest')+' / 10']);

  const intro=gEl('div','g-card');
  intro.appendChild(gEl('p',null,'Every control below belongs on exactly one node. Pick two controls per node from the dropdowns, then check your answers. This mirrors the official exam\'s drag/select architecture diagrams.'));
  main.appendChild(intro);

  const dia=gEl('div','pbq-diagram');
  PBQ_NODES.forEach((n,ni)=>{
    const node=gEl('div','pbq-node');
    node.appendChild(gEl('div','ico',n.ico));
    node.appendChild(gEl('h4',null,n.name));
    const nodeOk = done ? n.nodeCorrect : false;
    for(let slot=0; slot<2; slot++){
      const sel=document.createElement('select');
      const optAll=['Select control'].concat(PBQA.opts);
      optAll.forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op); });
      sel.value=PBQA.picks[n.k][slot]||'Select control';
      if(done){
        sel.disabled=true;
        // Graded per NODE (the pair as a set), not per dropdown position — picking both correct
        // controls for a node in either order counts as right for both.
        sel.classList.add(nodeOk ? 'right' : 'wrong');
      } else {
        sel.onchange=()=>pbqaPick(n.k, slot, sel.value==='Select control'?'':sel.value);
      }
      node.appendChild(sel);
    }
    if(done && !nodeOk){
      node.appendChild(gEl('div','pbq-slot-fb bad','This node needs: '+n.need.join(' + ')));
    }
    dia.appendChild(node);
    if(ni<PBQ_NODES.length-1){ const ar=gEl('div','pbq-arrow-row','→'); dia.appendChild(ar); }
  });
  main.appendChild(dia);

  const row=gEl('div','g-row'); row.style.marginTop='16px';
  if(!done){
    const allFilled=PBQ_NODES.every(n=>PBQA.picks[n.k][0] && PBQA.picks[n.k][1]);
    const cb=gBtn('Check Answers','primary big',pbqaCheck); cb.disabled=!allFilled;
    row.appendChild(cb);
    if(!allFilled) row.appendChild(gEl('span','g-stat','Fill every slot before checking.'));
  } else {
    const msg = PBQA.right===PBQA.total ? 'Perfect — every control on the right layer.' :
      PBQA.right>=PBQA.total*0.7 ? 'Solid, but review the misses below.' : 'Review the layer order and try again.';
    main.appendChild(gEl('div','g-fb '+(PBQA.right===PBQA.total?'ok':'bad'), msg));
    row.appendChild(gBtn('New attempt','primary big',()=>{ pbqaNew(); renderPbqArch(); }));
  }
  main.appendChild(row);
}

/* ============================== PBQ SIMULATOR: FRAMEWORK SORT ============================== */
const PBQ_SORT_OWASP=[
  {t:'Broken access control', cat:'owasp', why:'OWASP Top 10 (web) — a general access-control failure, not LLM-specific.'},
  {t:'Cryptographic failures', cat:'owasp', why:'OWASP Top 10 (web) — weak, missing, or misused encryption.'},
  {t:'Authentication failures', cat:'owasp', why:'OWASP Top 10 (web) — broken authentication/session handling.'},
  {t:'Security misconfiguration', cat:'owasp', why:'OWASP Top 10 (web) — insecure defaults or unnecessary features left enabled.'},
  {t:'Vulnerable and outdated components', cat:'owasp', why:'OWASP Top 10 (web) — using components with known vulnerabilities.'}
];
// Current (2025) OWASP Top 10 for LLM Applications — kept to ONE consistent version, not mixed with the older 2023 names
const PBQ_SORT_LLM=[
  {t:'Prompt injection', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM01 — the #1 LLM-specific risk.'},
  {t:'Sensitive information disclosure', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM02 — the model reveals confidential data in its own output.'},
  {t:'Supply chain', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM03 — risk from third-party models, datasets, or plugins.'},
  {t:'Data and model poisoning', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM04 — corrupting training data or the model itself.'},
  {t:'Improper output handling', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM05 — treating model output as trusted without validation.'},
  {t:'Excessive agency', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM06 — a model/agent granted more capability than it needs.'},
  {t:'System prompt leakage', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM07 — the system prompt itself gets exposed.'},
  {t:'Vector and embedding weaknesses', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM08 — flaws in how embeddings/vector stores are generated or managed, common in RAG.'},
  {t:'Misinformation', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM09 — confidently wrong output presented as fact (replaced the older \'overreliance\' framing).'},
  {t:'Unbounded consumption', cat:'llm', why:'OWASP LLM Top 10 (2025), LLM10 — uncontrolled resource/cost usage, covers denial-of-wallet style abuse.'}
];
const PBQ_SORT_STRIDE=[
  {t:'Spoofing', cat:'stride', why:'The S in STRIDE — impersonating a user or system.'},
  {t:'Tampering', cat:'stride', why:'The T in STRIDE — unauthorized modification of data.'},
  {t:'Repudiation', cat:'stride', why:'The R in STRIDE — denying an action with no proof otherwise.'},
  {t:'Information disclosure', cat:'stride', why:'The I in STRIDE — exposing data to unauthorized parties. Compare to the LLM tile \'sensitive information disclosure\' — same idea, different named list.'},
  {t:'Model denial of service', cat:'stride', why:'STRIDE\'s denial-of-service category, applied specifically to an AI model.'},
  {t:'Elevation of privilege', cat:'stride', why:'The E in STRIDE — gaining higher permissions than granted.'}
];
const PBQ_SORT_COLS=[{k:'owasp',name:'OWASP Top 10 (Web)'},{k:'llm',name:'OWASP Top 10 (LLM)'},{k:'stride',name:'STRIDE'}];
let PSORT=null;
function psortNew(){
  // Guarantee full representation every round: all 5 general-OWASP items, all 6 STRIDE items
  // (STRIDE is only meaningful as its complete 6 letters), and 5 of the 10 current LLM items for variety.
  const items=gShuffle(
    PBQ_SORT_OWASP.concat(PBQ_SORT_STRIDE).concat(gShuffle(PBQ_SORT_LLM).slice(0,5))
  );
  PSORT={items:items, placed:{}, sel:null, right:0, wrong:0};
}
function psortSelect(i){
  if(PSORT.placed[i]!=null) return;
  PSORT.sel = (PSORT.sel===i? null : i);
  SFX.play('click'); renderPsort();
}
function psortPlace(colKey){
  if(PSORT.sel==null) return;
  const i=PSORT.sel; const it=PSORT.items[i];
  if(it.cat===colKey){ PSORT.placed[i]=colKey; PSORT.right++; SFX.play('correct'); }
  else { PSORT.wrong++; SFX.play('wrong'); PSORT.lastWrong={i:i, col:colKey}; }
  PSORT.sel=null;
  if(Object.keys(PSORT.placed).length===PSORT.items.length){
    setBest('pbqSortBest', PSORT.right);
    SFX.play('win');
  }
  renderPsort();
}
function renderPsort(){
  if(!PSORT) psortNew();
  const allDone = Object.keys(PSORT.placed).length===PSORT.items.length;
  const main=gameHeader('PBQ Simulator — Framework Sort',
    'Click a risk, then click the framework list it actually belongs to. Some terms look alike on purpose — read closely.',
    ['SORTED: '+Object.keys(PSORT.placed).length+' / '+PSORT.items.length, 'CORRECT: '+PSORT.right, 'BEST: '+getBest('pbqSortBest')+' / '+PSORT.items.length]);

  const pool=gEl('div','sort-pool');
  PSORT.items.forEach((it,i)=>{
    if(PSORT.placed[i]!=null) return;
    const chip=gEl('div','sort-chip'+(PSORT.sel===i?' sel':''), it.t);
    chip.onclick=()=>psortSelect(i);
    pool.appendChild(chip);
  });
  if(pool.children.length===0){
    pool.appendChild(gEl('span','g-stat','All items sorted.'));
  }
  main.appendChild(pool);

  const cols=gEl('div','sort-cols');
  PBQ_SORT_COLS.forEach(c=>{
    const col=gEl('div','sort-col');
    col.appendChild(gEl('h4',null,c.name));
    PSORT.items.forEach((it,i)=>{ if(PSORT.placed[i]===c.k) col.appendChild(gEl('div','placed',it.t)); });
    col.onclick=()=>psortPlace(c.k);
    cols.appendChild(col);
  });
  main.appendChild(cols);

  if(PSORT.lastWrong!=null){
    const it=PSORT.items[PSORT.lastWrong.i];
    const fb=gEl('div','g-fb bad');
    fb.appendChild(gEl('b',null,'"'+it.t+'" is not '+PBQ_SORT_COLS.find(c=>c.k===PSORT.lastWrong.col).name+'. '));
    fb.appendChild(document.createTextNode(it.why));
    main.appendChild(fb);
  }
  if(allDone){
    const fb=gEl('div','g-fb '+(PSORT.right===PSORT.items.length?'ok':'bad'));
    fb.textContent='Board complete — '+PSORT.right+' correct on first placement, '+PSORT.wrong+' misses along the way.';
    main.appendChild(fb);
    main.appendChild(gBtn('New board','primary big',()=>{ psortNew(); renderPsort(); }));
  } else {
    main.appendChild(gBtn('New board','',()=>{ psortNew(); renderPsort(); }));
  }
}


/* ============================== MASTER RENDER ============================== */
function render(){
  stopGameTimers();
  if(CURRENT_VIEW!=='exam') clearInterval(examTimerHandle);
  renderSidebar();
  if(CURRENT_VIEW==='tracker') renderTracker();
  else if(CURRENT_VIEW==='flashcards') renderFlashcards();
  else if(CURRENT_VIEW==='match') renderMatch();
  else if(CURRENT_VIEW==='exam') renderExam();
  else if(CURRENT_VIEW==='pipeline'){ renderPipeline(); if(PIPE.phase==='play') startPipeTimer(); }
  else if(CURRENT_VIEW==='jeopardy') renderJeopardy();
  else if(CURRENT_VIEW==='wheel') renderWheel();
  else if(CURRENT_VIEW==='pbqarch') renderPbqArch();
  else if(CURRENT_VIEW==='pbqsort') renderPsort();
  else if(CURRENT_VIEW==='readiness') renderReadiness();
  else if(CURRENT_VIEW==='braindump') renderBrainDump();
  else if(CURRENT_VIEW==='pbqmulti') renderPbqKind('multi','PBQ: Tool Selection','Dropdown matching, configuration checkboxes, and radio scenarios — the CertMaster practice-test format');
  else if(CURRENT_VIEW==='pbqtable') renderPbqKind('table','PBQ: Attack / Control Table','Place each tile in the right cell of a three-column table');
  else if(CURRENT_VIEW==='pbqrules') renderPbqKind('rules','PBQ: Policy Rule Builder','Build IF/THEN rules using only the values in the policy excerpt');
  else renderDay(CURRENT_VIEW);
}

(async function init(){
  applyLessonAddenda();
  await loadState();
  render();
})();
</script>
</body>
</html>

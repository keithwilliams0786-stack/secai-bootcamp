    blk.appendChild(head);

    const body=document.createElement('div'); body.className='block-body';
    const inner=document.createElement('div'); inner.className='block-inner';
    inner.innerHTML = b.body;
    if(b.terms && b.terms.length){
      const h4=document.createElement('h4'); h4.textContent='Key Terms'; inner.appendChild(h4);

      b.terms.forEach(t=>{ const c=document.createElement('span'); c.className='term-chip'; c.textContent=t; chips.appendChild(c); });

      b.quiz.forEach((qq,i)=>{ inner.appendChild(renderQuiz(qq, b.id+'-q'+i)); });
    }
    body.appendChild(inner);
    blk.appendChild(body);
    main.appendChild(blk);
  });
}

function currentDeck(){
  if(STATE.fcDomainFilter==='all') return FLASHCARDS;
  return FLASHCARDS.filter(c=>c.d===Number(STATE.fcDomainFilter));
}
function renderFlashcards(){
  const main=document.getElementById('main'); main.innerHTML='';
  const top=document.createElement('div'); top.className='topline';
  top.innerHTML='<div><h1>Flashcards</h1><div class="sub">Click a card to flip. '+FLASHCARDS.length+' terms across all four domains.</div></div>';
  main.appendChild(top);

  const wrap=document.createElement('div'); wrap.className='fc-wrap';
  const filterBar=document.createElement('div'); filterBar.className='fc-filterbar';
  [['all','All'], [1,'D1'], [2,'D2'], [3,'D3'], [4,'D4']].forEach(([val,lab])=>{
    const b=document.createElement('button');
    b.className='btn'+(String(STATE.fcDomainFilter)===String(val)?' primary':'');
    b.textContent=lab;
    b.onclick=()=>{ STATE.fcDomainFilter=val; STATE.fcIndex=0; saveState(); render(); };
    filterBar.appendChild(b);
  });
  wrap.appendChild(filterBar);

  const deck=currentDeck();
  if(STATE.fcIndex>=deck.length) STATE.fcIndex=0;
  const card=deck[STATE.fcIndex];

  const scene=document.createElement('div'); scene.className='fc-scene';
  const inner=document.createElement('div'); inner.className='fc-card'; inner.id='fcCard';
  let flipped=false;
  const front=document.createElement('div'); front.className='fc-face';
  front.innerHTML='<span class="k mono">D'+card.d+' · TERM</span><div class="term">'+card.t+'</div>';
  const back=document.createElement('div'); back.className='fc-face fc-back';
  back.innerHTML='<span class="k mono">D'+card.d+' · DEFINITION</span><div class="def">'+card.def+'</div>';
  inner.appendChild(front); inner.appendChild(back);
  scene.appendChild(inner);
  scene.onclick=()=>{ flipped=!flipped; inner.classList.toggle('flipped'); };
  wrap.appendChild(scene);

  const prog=document.createElement('div'); prog.className='fc-progress'; prog.textContent=(STATE.fcIndex+1)+' / '+deck.length; wrap.appendChild(prog);

  const controls=document.createElement('div'); controls.className='fc-controls';
  const prevB=document.createElement('button'); prevB.className='btn'; prevB.textContent='← Prev';
  prevB.onclick=()=>{ STATE.fcIndex=(STATE.fcIndex-1+deck.length)%deck.length; saveState(); render(); };
  const shufB=document.createElement('button'); shufB.className='btn'; shufB.textContent='Shuffle';
  shufB.onclick=()=>{ STATE.fcIndex=Math.floor(Math.random()*deck.length); saveState(); render(); };
  const nextB=document.createElement('button'); nextB.className='btn primary'; nextB.textContent='Next →';
  nextB.onclick=()=>{ STATE.fcIndex=(STATE.fcIndex+1)%deck.length; saveState(); render(); };
  controls.appendChild(prevB); controls.appendChild(shufB); controls.appendChild(nextB);
  wrap.appendChild(controls);

  main.appendChild(wrap);
}

  resetBtn.onclick=()=>{ STATE.matchState={}; matchSelection={a:null,c:null}; saveState(); render(); };
  main.appendChild(resetBtn);

  const grid=document.createElement('div'); grid.className='match-grid';

    colA.appendChild(el);
  });

  const colC=document.createElement('div'); colC.className='match-col';
  colC.innerHTML='<h4>Compensating Control</h4>';
  const shuffledC=[...MATCH_PAIRS].sort(()=>Math.random()-0.5);
  shuffledC.forEach(p=>{
    const done = STATE.matchState[p.a];
    const el=document.createElement('div');
    el.className='match-item'+(done?' correct locked':'')+(matchSelection.c===p.c?' sel':'');
    el.textContent=p.c;
    if(!done){
      el.onclick=()=>{ matchSelection.c=p.c; tryMatch(); render(); };
    }
    colC.appendChild(el);
  });

  grid.appendChild(colA); grid.appendChild(colC);
  main.appendChild(grid);

  function tryMatch(){
    if(matchSelection.a && matchSelection.c){
      const pair = MATCH_PAIRS.find(p=>p.a===matchSelection.a);
      if(pair && pair.c===matchSelection.c){
        STATE.matchState[pair.a]=true; saveState();
      }
      matchSelection={a:null,c:null};
    }
  }
}

/* ============================== RENDER: FINAL EXAM ============================== */
let examTimerHandle=null;
function sampleExamQuestions(){
  const quotas = {1:10, 2:23, 3:15, 4:12}; // sums to 60, proportional to the 83-question bank composition
  const byDomain = {1:[],2:[],3:[],4:[]};
  EXAM_BANK.forEach(qq=>{ if(byDomain[qq.domain]) byDomain[qq.domain].push(qq); });
  let picked=[];
  [1,2,3,4].forEach(dn=>{
    const pool=[...byDomain[dn]].sort(()=>Math.random()-0.5);
    picked = picked.concat(pool.slice(0, Math.min(quotas[dn], pool.length)));
  });
  return picked.sort(()=>Math.random()-0.5);
}
function startExam(){
  STATE.examState = { questions: sampleExamQuestions(), answers:{}, flagged:{}, current:0, startedAt:Date.now(), duration:60*60, submitted:false };
  saveState(); render();
}
function renderExam(){
  const main=document.getElementById('main'); main.innerHTML='';
  const top=document.createElement('div'); top.className='topline';
  top.innerHTML='<div><h1>Final Exam Simulation</h1><div class="sub">60 questions, freshly drawn from an 83-question bank each attempt · weighted to blueprint · 60-minute timer</div></div>';
  main.appendChild(top);

  const es=STATE.examState;
  if(!es || es.submitted){
    if(es && es.submitted){ renderExamResults(main, es); return; }
    const startCard=document.createElement('div'); startCard.className='block open';
    const bd=document.createElement('div'); bd.className='block-body'; bd.style.maxHeight='none';
    const bi=document.createElement('div'); bi.className='block-inner'; bi.style.padding='20px';
    bi.innerHTML='<p>This simulates exam-day conditions: 60 questions randomly drawn from an 83-question bank, one 60-minute timer, no going back to study material. Question mix mirrors the real blueprint (Domain 2 heaviest, Domain 1 lightest). Retake it and you\'ll get a different draw.</p>';
    const b=document.createElement('button'); b.className='btn primary'; b.textContent='Start 60-Minute Simulation';
    b.onclick=startExam;
    bi.appendChild(b);
    bd.appendChild(bi); startCard.appendChild(bd); main.appendChild(startCard);
    return;
  }

  const elapsed = Math.floor((Date.now()-es.startedAt)/1000);
  const remaining = Math.max(0, es.duration - elapsed);
  if(remaining<=0 && !es.submitted){ submitExam(); return; }

  const exTop=document.createElement('div'); exTop.className='exam-top';
  const mins=String(Math.floor(remaining/60)).padStart(2,'0');
  const secs=String(remaining%60).padStart(2,'0');
  const timer=document.createElement('div'); timer.className='timer'+(remaining<300?' low':''); timer.textContent=mins+':'+secs;
  exTop.appendChild(timer);
  const submitB=document.createElement('button'); submitB.className='btn primary'; submitB.textContent='Submit Exam';
  submitB.onclick=submitExam;
  exTop.appendChild(submitB);
  main.appendChild(exTop);

  const strip=document.createElement('div'); strip.className='progress-strip'; strip.style.margin='12px 0';
  es.questions.forEach((qq,i)=>{
    const dot=document.createElement('div');
    let cls='pdot';
    if(es.answers[i]!=null) cls+=' answered';
    if(es.flagged[i]) cls+=' flagged';
    if(es.current===i) cls+=' current';
    dot.className=cls;
    dot.onclick=()=>{ es.current=i; saveState(); render(); };
    strip.appendChild(dot);
  });
  main.appendChild(strip);

  const i = es.current;
  const qq = es.questions[i];
  const qCard=document.createElement('div'); qCard.className='block open';
  const qBody=document.createElement('div'); qBody.className='block-body'; qBody.style.maxHeight='none';
  const qInner=document.createElement('div'); qInner.className='block-inner'; qInner.style.padding='20px';
  qInner.innerHTML='<div class="pill" style="margin-bottom:10px;">Question '+(i+1)+' / '+es.questions.length+' · Domain '+qq.domain+'</div>';
  const qt=document.createElement('div'); qt.style.cssText='font-weight:600;font-size:15px;margin-bottom:14px;color:var(--ink);'; qt.textContent=qq.text;
  qInner.appendChild(qt);
  qq.opts.forEach((optText,oi)=>{
    const b=document.createElement('button'); b.className='opt';
    if(es.answers[i]===oi) b.classList.add('sel');
    b.style.borderColor = es.answers[i]===oi? 'var(--cyan)':'';
    b.textContent=optText;
    b.onclick=()=>{ es.answers[i]=oi; saveState(); render(); };
    qInner.appendChild(b);
  });
  const navRow=document.createElement('div'); navRow.style.cssText='display:flex;gap:10px;margin-top:16px;align-items:center;';
  const prevB=document.createElement('button'); prevB.className='btn'; prevB.textContent='← Prev'; prevB.disabled=i===0;
  prevB.onclick=()=>{ es.current=Math.max(0,i-1); saveState(); render(); };
  const flagB=document.createElement('button'); flagB.className='btn'; flagB.textContent=es.flagged[i]?'Unflag':'Flag for review';
  flagB.onclick=()=>{ es.flagged[i]=!es.flagged[i]; saveState(); render(); };
  const nextB=document.createElement('button'); nextB.className='btn primary'; nextB.textContent='Next →'; nextB.disabled=i===es.questions.length-1;
  nextB.onclick=()=>{ es.current=Math.min(es.questions.length-1,i+1); saveState(); render(); };
  navRow.appendChild(prevB); navRow.appendChild(flagB); navRow.appendChild(nextB);
  qInner.appendChild(navRow);
  qBody.appendChild(qInner); qCard.appendChild(qBody); main.appendChild(qCard);

  clearInterval(examTimerHandle);
  examTimerHandle=setInterval(()=>{
    if(CURRENT_VIEW!=='exam' || !STATE.examState || STATE.examState.submitted){ clearInterval(examTimerHandle); return; }
    const el=document.querySelector('.timer');
    if(!el){ clearInterval(examTimerHandle); return; }
    const rem = Math.max(0, STATE.examState.duration - Math.floor((Date.now()-STATE.examState.startedAt)/1000));
    const m=String(Math.floor(rem/60)).padStart(2,'0'); const s=String(rem%60).padStart(2,'0');
    el.textContent=m+':'+s;
    if(rem<300) el.classList.add('low');
    if(rem<=0){ submitExam(); }
  },1000);
}
function submitExam(){
  if(!STATE.examState || STATE.examState.submitted) return;
  STATE.examState.submitted=true;
  saveState(); render();
}
function renderExamResults(main, es){
  let correct=0; const byDomain={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0}};
  const missed=[];
  es.questions.forEach((qq,i)=>{
    byDomain[qq.domain].t++;
    if(es.answers[i]===qq.correctIdx){ correct++; byDomain[qq.domain].c++; }
    else missed.push({i,qq});
  });
  const pct = Math.round((correct/es.questions.length)*100);
  const scaled = Math.round(100 + (pct/100)*800); // rough mapping onto 100-900 scale
  const pass = scaled>=600;

  const rc=document.createElement('div'); rc.className='block open';
  const rb=document.createElement('div'); rb.className='block-body'; rb.style.maxHeight='none';
  const ri=document.createElement('div'); ri.className='block-inner'; ri.style.padding='20px';
  ri.innerHTML = '<h4 style="margin-top:0;">Result</h4>';
  const grid=document.createElement('div'); grid.className='results-grid';
  grid.innerHTML =
    '<div class="rcard"><div class="big" style="color:'+(pass?'var(--green)':'var(--red)')+';">'+scaled+'</div><div class="lbl">Estimated scaled score (pass ≥ 600)</div></div>'+
    '<div class="rcard"><div class="big">'+pct+'%</div><div class="lbl">'+correct+' / '+es.questions.length+' correct</div></div>';
  ri.appendChild(grid);

  const dbars=document.createElement('div');
  [1,2,3,4].forEach(dn=>{
    const st=byDomain[dn]; const p= st.t? Math.round((st.c/st.t)*100):0;
    const row=document.createElement('div'); row.className='dbar-row'; row.style.marginBottom='8px';
    row.innerHTML='<div class="dbar-top"><span><span class="code">D'+dn+'</span> '+DOMAINS[dn].short+'</span><span>'+st.c+'/'+st.t+' ('+p+'%)</span></div><div class="dbar-track"><div class="dbar-fill" style="width:'+p+'%;background:'+DOMAINS[dn].color+';"></div></div>';
    dbars.appendChild(row);
  });
  ri.appendChild(dbars);

  const verdict=document.createElement('p');
  verdict.style.marginTop='16px';
  verdict.innerHTML = pass?
    '<b style="color:var(--green);">Above the passing bar.</b> Review your missed questions below, then check the Day 5 Go/No-Go criteria before booking.':
    '<b style="color:var(--red);">Below the passing bar.</b> Focus remediation on your weakest domain above before re-attempting.';
  ri.appendChild(verdict);

  const retryB=document.createElement('button'); retryB.className='btn primary'; retryB.style.marginTop='10px'; retryB.textContent='Retake Simulation';
  retryB.onclick=()=>{ STATE.examState=null; saveState(); render(); };
  ri.appendChild(retryB);

  rb.appendChild(ri); rc.appendChild(rb); main.appendChild(rc);

  const mc=document.createElement('div'); mc.className='block open';
  const mb=document.createElement('div'); mb.className='block-body'; mb.style.maxHeight='none';
  const mi=document.createElement('div'); mi.className='block-inner'; mi.style.padding='20px';
  mi.innerHTML='<h4 style="margin-top:0;">Missed Questions ('+missed.length+')</h4>';
  if(!missed.length){ mi.innerHTML+='<p class="empty">Clean sweep. Nothing missed.</p>'; }
  missed.forEach(m=>{
    const card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<div class="qtext">D'+m.qq.domain+' · '+m.qq.text+'</div>'+
      '<div style="font-size:12.5px;color:var(--ink-dim);margin-bottom:4px;">Your answer: '+(es.answers[m.i]!=null? m.qq.opts[es.answers[m.i]] : '(unanswered)')+'</div>'+
      '<div style="font-size:12.5px;color:var(--green);margin-bottom:6px;">Correct: '+m.qq.opts[m.qq.correctIdx]+'</div>'+
      '<div class="explain show">'+m.qq.explain+'</div>';
    mi.appendChild(card);
  });
  mb.appendChild(mi); mc.appendChild(mb); main.appendChild(mc);
}

/* ============================== MASTER RENDER ============================== */
function render(){
  renderSidebar();
  if(CURRENT_VIEW==='tracker') renderTracker();
  else if(CURRENT_VIEW==='flashcards') renderFlashcards();
  else if(CURRENT_VIEW==='match') renderMatch();
  else if(CURRENT_VIEW==='exam') renderExam();
  else renderDay(CURRENT_VIEW);
}

(async function init(){
  await loadState();
  render();
})();
</script>
